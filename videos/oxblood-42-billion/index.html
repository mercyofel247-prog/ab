<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>$42,000,000,000 — In One Day (oxblood collapse)</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Track 2 "oxblood collapse" */
        --ground: #0b0b0c; /* near-black ground */
        --oxblood: #7a160e; /* deep oxblood accent — rim/edge only */
        --ash: #3a3a3e; /* ash graphite secondary */
        --bone: #ede8dd; /* warm bone type */
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        /* resolves to the renderer's bundled Inter; extra-condensed look comes
           from a static scaleX squeeze on #hero-fit (never animated) */
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      /* the "camera" — everything that gets the push-in + contact shake */
      #world {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* restrained dark field, no lift in the blacks */
      #bg {
        position: absolute;
        inset: -4%;
        background:
          radial-gradient(70% 60% at 50% 48%, #131114 0%, #0d0c0e 46%, #090809 74%, var(--ground) 100%);
      }

      /* faint oxblood breath low in the frame — never a symmetric glow */
      #haze {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(46% 40% at 72% 30%, rgba(122, 22, 14, 0.16) 0%, rgba(122, 22, 14, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0.75;
      }

      #dust,
      #particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #particles {
        will-change: opacity;
      }

      .p,
      .d {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        will-change: transform, opacity;
      }

      #puff {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 900px;
        height: 900px;
        margin: -450px 0 0 -450px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(122, 22, 14, 0.32) 0%, rgba(122, 22, 14, 0.1) 40%, rgba(122, 22, 14, 0) 70%);
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }

      #scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 1600px;
        perspective-origin: 50% 47%;
      }

      #hero-scale {
        position: relative;
        will-change: transform, filter;
        transform-origin: 50% 50%;
      }

      #hero-fit {
        position: relative;
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #hero {
        font-weight: 900;
        font-size: 260px;
        line-height: 0.9;
        letter-spacing: -0.02em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-transform: uppercase;
      }

      /* the loud figure — warm-bone metallic face, hard key upper-left */
      #hero {
        position: relative;
        z-index: 2;
        background: linear-gradient(
          132deg,
          #fdfaf3 0%,
          #ede8dd 26%,
          #d7d1c3 60%,
          #c2bbab 82%,
          #b3ab9a 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        /* hard key upper-left + real extruded depth down-right into ash/black + contact shadow */
        text-shadow:
          -1px -1px 0 rgba(255, 251, 242, 0.45),
          1px 1px 0 #34343a,
          2px 2px 0 #2f2f34,
          3px 3px 0 #2a2a2f,
          4px 4px 0 #252529,
          5px 5px 0 #202024,
          6px 6px 0 #1b1b1f,
          7px 7px 0 #171719,
          8px 8px 0 #121214,
          9px 9px 0 #0e0e10,
          10px 11px 24px rgba(0, 0, 0, 0.62),
          14px 20px 40px rgba(0, 0, 0, 0.5);
      }

      #sub-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 65.5%;
        text-align: center;
        pointer-events: none;
      }

      #subtitle {
        display: inline-block;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        /* machined ash-graphite, lifted just enough off the ground to stay legible */
        color: #7d7d84;
        text-transform: uppercase;
        font-variant-caps: small-caps;
        will-change: transform, opacity;
      }
      #subtitle .w {
        display: inline-block;
        will-change: transform, opacity;
      }

      /* ---------- grade overlays (do not move with the camera) ---------- */
      #grain {
        position: absolute;
        inset: -3%;
        opacity: 0.08;
        mix-blend-mode: overlay;
        pointer-events: none;
        will-change: transform;
        background-repeat: repeat;
        background-size: 256px 256px;
      }

      #ca {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.5;
        background:
          radial-gradient(130% 130% at 0% 0%, rgba(255, 40, 40, 0.06) 0%, rgba(255, 40, 40, 0) 38%),
          radial-gradient(130% 130% at 100% 100%, rgba(40, 200, 255, 0.06) 0%, rgba(40, 200, 255, 0) 38%);
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(78% 74% at 50% 47%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.78) 100%);
      }

      /* 2.35:1 letterbox inside the 16:9 frame */
      .lb {
        position: absolute;
        left: -2%;
        right: -2%;
        height: 132px;
        background: #000;
        pointer-events: none;
        z-index: 5;
      }
      #lb-top {
        top: 0;
      }
      #lb-bottom {
        bottom: 0;
      }

      /* exit fall-off toward the ground colour */
      #fade {
        position: absolute;
        inset: 0;
        background: var(--ground);
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.5"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <div id="world">
          <div id="bg"></div>
          <div id="haze" data-layout-allow-overflow></div>
          <div id="dust" data-layout-allow-overflow></div>

          <!-- heavy dark vignette darkens the field but sits UNDER the numeral -->
          <div id="vignette"></div>

          <div id="scene">
            <div id="hero-scale" data-layout-allow-overflow>
              <div id="hero-fit" data-layout-allow-overflow>
                <div id="hero">$42,000,000,000</div>
              </div>
            </div>
          </div>

          <div id="sub-wrap">
            <div id="subtitle">In One Day</div>
          </div>

          <div id="particles" data-layout-allow-overflow></div>
          <div id="puff"></div>
        </div>

        <div id="grain"></div>
        <div id="ca"></div>
        <div id="lb-top" class="lb"></div>
        <div id="lb-bottom" class="lb"></div>
        <div id="fade"></div>
      </section>

      <audio
        id="boom"
        data-start="0"
        data-duration="4.5"
        data-track-index="2"
        src="assets/boom.wav"
        data-volume="0.95"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---------- deterministic RNG (mulberry32) — no Math.random / Date.now ---------- */
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const FPS = 24;
      const F = (f) => f / FPS; // frame -> seconds

      const stage = document.querySelector("#stage");
      const hero = document.querySelector("#hero");
      const heroFit = document.querySelector("#hero-fit");
      const particlesEl = document.querySelector("#particles");
      const dustEl = document.querySelector("#dust");

      // Build everything only AFTER the substituted web font is loaded — otherwise
      // the width measurement below is taken against a fallback font and the numeral
      // overflows the frame. The runtime waits for the timeline to be registered.
      document.fonts.ready.then(function () {
      /* ---------- fit the numeral to 82% of frame width ---------- */
      const TARGET_W = 1920 * 0.82; // 1574.4px — the loudest number in the film
      const CONDENSE = 0.7; // static horizontal squeeze -> heavy extra-condensed face
      const natW = hero.getBoundingClientRect().width || 1;
      // final width = natW * FIT * CONDENSE === TARGET_W
      const FIT = TARGET_W / (natW * CONDENSE);
      heroFit.style.transform = "scale(" + FIT + ") scaleX(" + CONDENSE + ")";

      // The un-transformed numeral box is wider than the frame, so grid centering
      // of the overflow leaves it off-centre. Measure the real centre and translate
      // #hero-scale so the numeral is exactly frame-centred (keeps the push-in from
      // cropping one side). Done BEFORE sampling particles so they coalesce onto it.
      const CENTER_X = 960;
      {
        const sr0 = stage.getBoundingClientRect();
        const h0 = hero.getBoundingClientRect();
        const curCenter = h0.left - sr0.left + h0.width / 2;
        const HERO_DX = CENTER_X - curCenter;
        gsap.set("#hero-scale", { x: HERO_DX });
      }

      /* ---------- split the subtitle into words for a staggered rise ---------- */
      const subEl = document.querySelector("#subtitle");
      const subWords = subEl.textContent.trim().split(/\s+/);
      subEl.innerHTML = subWords
        .map((w, i) => '<span class="w">' + w + (i < subWords.length - 1 ? "&nbsp;" : "") + "</span>")
        .join("");
      const wordEls = subEl.querySelectorAll(".w");

      /* ---------- moving 35mm-style grain (seeded noise tile) ---------- */
      (function buildGrain() {
        const size = 128;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const x = c.getContext("2d");
        const im = x.createImageData(size, size);
        const r = mulberry32(0x6a11a5);
        for (let i = 0; i < size * size; i++) {
          const v = (r() * 255) | 0;
          im.data[i * 4] = v;
          im.data[i * 4 + 1] = v;
          im.data[i * 4 + 2] = v;
          im.data[i * 4 + 3] = 255;
        }
        x.putImageData(im, 0, 0);
        document.querySelector("#grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
      })();

      /* ---------- sample the fitted numeral into ~300 glyph target points ---------- */
      const stageRect = stage.getBoundingClientRect();
      const hr = hero.getBoundingClientRect();
      const heroLeft = hr.left - stageRect.left;
      const heroTop = hr.top - stageRect.top;
      const heroW = Math.max(2, hr.width);
      const heroH = Math.max(2, hr.height);

      const cw = Math.min(1400, Math.round(heroW));
      const ch = Math.min(300, Math.round(heroH));
      const cvs = document.createElement("canvas");
      cvs.width = cw;
      cvs.height = ch;
      const cx = cvs.getContext("2d");
      const FONT = '900 200px "Helvetica Neue",Arial,sans-serif';
      cx.font = FONT;
      cx.textBaseline = "alphabetic";
      const heroStr = "$42,000,000,000";
      const m = cx.measureText(heroStr);
      const asc = m.actualBoundingBoxAscent || 150;
      const desc = m.actualBoundingBoxDescent || 40;
      const textW = m.width || cw;
      const textH = asc + desc || ch;
      cx.setTransform(cw / textW, 0, 0, ch / textH, 0, (asc * ch) / textH);
      cx.fillStyle = "#fff";
      cx.fillText(heroStr, 0, 0);

      const data = cx.getImageData(0, 0, cw, ch).data;
      const filled = [];
      const step = 2;
      for (let y = 0; y < ch; y += step) {
        for (let x = 0; x < cw; x += step) {
          if (data[(y * cw + x) * 4 + 3] > 96) filled.push([x, y]);
        }
      }

      // seeded shuffle, then take ~300 evenly from the shuffled set
      const shuf = mulberry32(0x51ed42);
      for (let i = filled.length - 1; i > 0; i--) {
        const j = (shuf() * (i + 1)) | 0;
        const t = filled[i];
        filled[i] = filled[j];
        filled[j] = t;
      }
      const COUNT = Math.min(300, filled.length);
      const chosen = filled.slice(0, COUNT);

      /* ---------- build the coalescing fragments ---------- */
      const prng = mulberry32(0x0da7a9);
      const parts = [];
      for (let i = 0; i < COUNT; i++) {
        const gx = heroLeft + (chosen[i][0] / cw) * heroW;
        const gy = heroTop + (chosen[i][1] / ch) * heroH;
        // scattered off-frame seed — ONE inward trajectory (no scatter-then-reform)
        const ang = prng() * Math.PI * 2;
        const dist = 1250 + prng() * 1500;
        const sx = gx + Math.cos(ang) * dist;
        const sy = gy + Math.sin(ang) * dist * 0.72;
        const size = 2 + prng() * 4.5;
        const bone = prng() < 0.4; // mix of warm-bone + oxblood metallic fragments
        const el = document.createElement("div");
        el.className = "p";
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.background = bone
          ? "radial-gradient(circle, #f3eee3 0%, #cabfa6 100%)"
          : "radial-gradient(circle, #b5473c 0%, #7a160e 100%)";
        el.style.boxShadow = bone ? "0 0 4px rgba(237,232,221,0.5)" : "0 0 5px rgba(122,22,14,0.65)";
        particlesEl.appendChild(el);
        parts.push({ el, gx, gy, sx, sy, order: i });
      }

      /* ---------- ambient oxblood dust (continuous lateral drift, seeded) ---------- */
      const drng = mulberry32(0xd05702);
      const dust = [];
      const DUST_N = 46;
      for (let i = 0; i < DUST_N; i++) {
        const x0 = drng() * 1920;
        const y0 = 120 + drng() * 840;
        const size = 1.5 + drng() * 3;
        const el = document.createElement("div");
        el.className = "d";
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.background = drng() < 0.5 ? "rgba(122,22,14,0.55)" : "rgba(200,190,170,0.4)";
        dustEl.appendChild(el);
        dust.push({ el, x0, y0, drift: (drng() < 0.5 ? -1 : 1) * (60 + drng() * 120), yamp: 8 + drng() * 22, ph: drng() });
      }

      /* ================= TIMELINE ================= */
      const tl = gsap.timeline({ paused: true });

      // ---- initial states ----
      gsap.set("#world", { scale: 1.0, x: 0, y: 0 });
      gsap.set(hero, { opacity: 0 });
      gsap.set("#hero-scale", { scale: 1 });
      gsap.set("#particles", { opacity: 1 });
      gsap.set("#puff", { opacity: 0, scale: 0.6 });
      gsap.set(wordEls, { opacity: 0, y: 6 });

      // rack-focus blur + deep-oxblood emissive rim baked onto the real numeral.
      // The rim is a directional glow up-right => rims ONLY the top-right edge
      // (one edge, never a symmetric glow). filter is animated via onUpdate.
      const focus = { blur: 8 }; // rack focus: 8px -> 0
      const rim = { a: 0 }; // oxblood rim strength: 0 -> bloom -> breath
      const applyFilter = () => {
        const a = rim.a;
        hero.style.filter =
          "blur(" + focus.blur.toFixed(3) + "px) " +
          "drop-shadow(7px -7px 10px rgba(122,22,14," + (a * 0.85).toFixed(3) + ")) " +
          "drop-shadow(3px -3px 4px rgba(122,22,14," + a.toFixed(3) + "))";
      };
      applyFilter();

      // fragments start scattered off-frame, dim
      parts.forEach((p) => gsap.set(p.el, { x: p.sx, y: p.sy, opacity: 0.5 }));
      // dust seeded start
      dust.forEach((d) => gsap.set(d.el, { x: d.x0, y: d.y0, opacity: 0.0 }));

      /* ---- 0–1500ms (f0–36): CONVERGENCE ---- */
      // ~300 fragments fly inward on ONE accelerating (power3.in) trajectory, per-particle stagger ~0.003s
      parts.forEach((p) => {
        const t0 = p.order * 0.003;
        tl.to(p.el, { x: p.gx, y: p.gy, opacity: 1, duration: 0.6, ease: "power3.in" }, t0);
      });

      // simultaneous slow stage push-in 1.00 -> 1.04 on sine.inOut
      tl.to("#world", { scale: 1.04, duration: F(36), ease: "sine.inOut" }, 0);

      // ambient dust drifts in (fade up early, then lives to the end)
      tl.to(dust.map((d) => d.el), { opacity: 1, duration: 0.8, ease: "sine.out" }, 0);

      /* ---- 1500–1750ms (f36–42): SOLIDIFY / IMPACT — the sync frame (BOOM on f36) ---- */
      const T_IMPACT = F(36); // 1.500s — the hard boom lands here
      // 1) fragments merge into the solid numeral: particle layer crossfades out (expo.out), hero crossfades in
      tl.to("#particles", { opacity: 0, duration: 0.25, ease: "expo.out" }, T_IMPACT);
      tl.to(hero, { opacity: 1, duration: 0.12, ease: "expo.out" }, T_IMPACT);
      // 2) 80ms scale settle with back.out overshoot (1.00 -> 1.05 -> 1.00)
      tl.to("#hero-scale", { scale: 1.05, duration: 0.04, ease: "back.out(3)" }, T_IMPACT);
      tl.to("#hero-scale", { scale: 1.0, duration: 0.18, ease: "power2.out" }, T_IMPACT + 0.04);
      // 3) oxblood rim blooms 0 -> full on expo.out
      tl.to(rim, { a: 0.9, duration: 0.25, ease: "expo.out", onUpdate: applyFilter }, T_IMPACT);
      // 4) 6px contact camera-shake on #world, damping out over 250ms
      const shake = [
        [6, -4],
        [-5, 5],
        [4.2, -3.4],
        [-3, 2.4],
        [2, -1.6],
        [-1.1, 0.9],
        [0, 0],
      ];
      let st = T_IMPACT;
      const sd = 0.25 / shake.length;
      shake.forEach((s) => {
        tl.to("#world", { x: s[0], y: s[1], duration: sd, ease: "power1.inOut" }, st);
        st += sd;
      });
      // 5) dust-puff kicks outward on power2.out
      tl.to("#puff", { opacity: 0.55, scale: 1.35, duration: 0.14, ease: "power2.out" }, T_IMPACT);
      tl.to("#puff", { opacity: 0, duration: 0.4, ease: "power2.out" }, T_IMPACT + 0.12);

      /* ---- 1750–2400ms (f42–58): RACK FOCUS + subtitle ---- */
      // solid numeral resolves 8px blur -> razor sharp on power2.out
      tl.to(focus, { blur: 0, duration: F(58) - F(42), ease: "power2.out", onUpdate: applyFilter }, F(42));
      // "IN ONE DAY" fades + rises 6px into place, staggered under the hero
      tl.to(
        wordEls,
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.07 },
        F(42),
      );

      /* ---- 2400–4300ms (f58–103): SUSTAINED MOTION — never stops ---- */
      // push-in continues 1.04 -> 1.10 on sine.inOut
      tl.to("#world", { scale: 1.1, duration: F(103) - F(58), ease: "sine.inOut" }, F(58));
      // rim does one slow strength breath 0.85 -> 0.70 -> 0.85
      const breathHalf = (F(103) - F(58)) / 2;
      tl.to(rim, { a: 0.7, duration: breathHalf, ease: "sine.inOut", onUpdate: applyFilter }, F(58));
      tl.to(rim, { a: 0.85, duration: breathHalf, ease: "sine.inOut", onUpdate: applyFilter }, F(58) + breathHalf);

      /* ---- ambient dust: continuous lateral drift across the WHOLE clip (alive to the end) ---- */
      dust.forEach((d) => {
        tl.to(
          d.el,
          {
            x: d.x0 + d.drift,
            y: d.y0 - d.yamp,
            duration: 4.5,
            ease: "sine.inOut",
            onUpdate: function () {
              // gentle seeded vertical bob layered on the drift
              const pr = this.progress();
              const yy = d.y0 - d.yamp * Math.sin((pr + d.ph) * Math.PI * 2);
              d.el.style.transform =
                "translate(" + (d.x0 + d.drift * pr) + "px," + yy + "px)";
            },
          },
          0,
        );
      });

      /* ---- moving film grain: re-jitter every ~2 frames for the full clip
             (one proxy tween drives it, so no overlapping tweens on #grain) ---- */
      const grng = mulberry32(0x9a1a11);
      const GSTEPS = 54;
      const grainOffs = [];
      for (let i = 0; i < GSTEPS; i++) {
        grainOffs.push([(grng() - 0.5) * 12, (grng() - 0.5) * 12]);
      }
      const grainEl = document.querySelector("#grain");
      const grainProxy = { t: 0 };
      tl.to(
        grainProxy,
        {
          t: 1,
          duration: 4.5,
          ease: "none",
          onUpdate: function () {
            const idx = Math.min(GSTEPS - 1, Math.floor(this.progress() * GSTEPS));
            grainEl.style.transform = "translate(" + grainOffs[idx][0] + "px," + grainOffs[idx][1] + "px)";
          },
        },
        0,
      );

      /* ---- 4300–4500ms (f103–108): EXIT — fast fall-off toward the ground colour ---- */
      // hold the numeral locked; begin a fast fall-off on the final frames (do not fully cut mid-motion)
      tl.to("#fade", { opacity: 0.92, duration: F(108) - F(104), ease: "power2.in" }, F(104));

      // pin the timeline to exactly 108 frames so motion is authored to the very end
      tl.set({}, {}, F(108));

      window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
