<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shot 08 — They Guess, It Doesn't</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0b0b0c;
        --bone: #ede8dd;
        --oxblood: #7a160e;
        --graphite: #3a3a3e;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(120% 95% at 62% 46%, #131314 0%, #0e0e0f 46%, var(--ground) 100%);
      }

      /* everything but the background/overlays rides one barely-visible
         ambient breathing loop so the frame never sits fully motionless */
      #scene {
        position: absolute;
        inset: 0;
      }

      /* ---------------- dust ---------------- */
      .dust {
        position: absolute;
        border-radius: 50%;
        background: var(--bone);
        pointer-events: none;
        will-change: transform, opacity;
      }

      /* ---------------- die (flat 2D panel, lower-left, subordinate —
         only rotation/x/y/scale are reliably tweenable by this runtime,
         so no 3D cube faces here) ---------------- */
      #die-wrap {
        position: absolute;
        left: 220px;
        top: 790px;
        width: 220px;
        height: 190px;
      }

      #die-shadow {
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 130px;
        height: 30px;
        margin-left: -65px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 72%);
        border-radius: 50%;
        will-change: transform, opacity;
      }

      #die-face {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 92px;
        height: 92px;
        margin-left: -46px;
        margin-top: -46px;
        border-radius: 11px;
        background: linear-gradient(155deg, #46464a 0%, var(--graphite) 45%, #262629 100%);
        box-shadow:
          inset 0 0 0 1px rgba(237, 232, 221, 0.06),
          0 10px 18px rgba(0, 0, 0, 0.55);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 15px;
        will-change: transform, opacity;
      }

      .pip {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(35% 35% at 35% 32%, #cfc9bc 0%, #8f8a80 55%, #57534c 100%);
        align-self: center;
        justify-self: center;
      }

      /* ---------------- mechanical iris — dominates the right two-thirds
         of the frame ---------------- */
      #eye-wrap {
        position: absolute;
        left: 1300px;
        top: 490px;
      }

      #eye-cluster {
        position: relative;
        width: 720px;
        height: 720px;
        margin-left: -360px;
        margin-top: -360px;
        will-change: transform;
      }

      /* brushed dark metal body — layered static gradients (banding +
         a soft sheen) stand in for a metal texture; none of this is
         GSAP-animated, so a rich static look costs nothing */
      #eye-socket {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          repeating-linear-gradient(
            98deg,
            rgba(255, 255, 255, 0.028) 0px,
            rgba(255, 255, 255, 0.028) 1px,
            rgba(0, 0, 0, 0) 1px,
            rgba(0, 0, 0, 0) 3px
          ),
          radial-gradient(60% 56% at 38% 32%, #55555b 0%, #3f3f44 34%, #2a2a2e 62%, #18181a 100%);
        box-shadow:
          inset 0 0 0 2px rgba(237, 232, 221, 0.05),
          0 30px 70px rgba(0, 0, 0, 0.6);
      }

      /* the machined bevel — a raised metallic rim just inside the
         socket's outer edge; static conic sheen, never animated */
      #eye-bevel {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 648px;
        height: 648px;
        margin-left: -324px;
        margin-top: -324px;
        border-radius: 50%;
        border: 3px solid transparent;
        background:
          conic-gradient(
              from 220deg,
              rgba(237, 232, 221, 0.32) 0deg,
              rgba(237, 232, 221, 0.04) 70deg,
              rgba(0, 0, 0, 0.35) 150deg,
              rgba(237, 232, 221, 0.1) 230deg,
              rgba(237, 232, 221, 0.32) 360deg
            )
            border-box;
        -webkit-mask:
          linear-gradient(#000 0 0) padding-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      /* soft emissive halo behind the ring — glow baked in as static CSS
         (blur/gradient aren't reliably tweenable here); GSAP only ever
         moves its opacity/scale, which reads as the halo brightening */
      #iris-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 700px;
        margin-left: -350px;
        margin-top: -350px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(122, 22, 14, 0.65) 0%, rgba(122, 22, 14, 0.28) 46%, rgba(122, 22, 14, 0) 72%);
        filter: blur(16px);
        will-change: transform, opacity;
      }

      /* the ring itself — emissive stroke only, never a flat fill; its
         glow edge is static box-shadow, GSAP only tweens opacity/scale */
      #iris-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 560px;
        height: 560px;
        margin-left: -280px;
        margin-top: -280px;
        border-radius: 50%;
        border: 34px solid var(--oxblood);
        box-shadow:
          0 0 46px 6px rgba(122, 22, 14, 0.55),
          inset 0 0 34px 6px rgba(122, 22, 14, 0.4);
        will-change: transform, opacity;
      }

      /* impact burst — static bright gradient, GSAP only tweens opacity */
      #iris-flash {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 560px;
        height: 560px;
        margin-left: -280px;
        margin-top: -280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 200, 0.85) 0%, rgba(230, 120, 100, 0.35) 45%, rgba(230, 120, 100, 0) 75%);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      #eye-pupil {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 260px;
        height: 260px;
        margin-left: -130px;
        margin-top: -130px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 42% 38%, #1c1c1e 0%, #0a0a0b 60%, #000 100%);
        box-shadow: inset 0 0 30px 8px rgba(0, 0, 0, 0.8);
      }

      /* the specular glint travels the bevel (the socket's outer rim),
         not the inner ring, per spec */
      #glint-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 648px;
        height: 648px;
        margin-left: -324px;
        margin-top: -324px;
      }

      #glint {
        position: absolute;
        left: 50%;
        top: 0;
        width: 26px;
        height: 26px;
        margin-left: -13px;
        margin-top: -3px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, var(--bone) 0%, rgba(237, 232, 221, 0.55) 55%, rgba(237, 232, 221, 0) 100%);
      }

      /* ---------------- caption ---------------- */
      /* static positioning wrapper (never touched by GSAP) + a plain inner
         element GSAP animates opacity/y on — keeps GSAP from ever owning
         (and discarding) the CSS translateX centering transform */
      #caption-pos {
        position: absolute;
        left: 1300px;
        top: 900px;
        transform: translateX(-50%);
        z-index: 110;
      }

      #caption {
        white-space: nowrap;
        color: var(--bone);
        font-weight: 700;
        font-size: 50px;
        letter-spacing: 0.05em;
        text-align: center;
      }

      #grain-overlay,
      #hf-vignette {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="shein_08_iris"
      data-start="0"
      data-duration="3.2"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div id="scene" data-layout-allow-overflow>
          <div id="dust-field" data-layout-allow-overflow></div>

          <div id="die-wrap" data-layout-allow-overflow>
            <div id="die-shadow"></div>
            <div id="die-face">
              <div class="pip" style="grid-column:1;grid-row:1"></div>
              <div class="pip" style="grid-column:3;grid-row:1"></div>
              <div class="pip" style="grid-column:1;grid-row:2"></div>
              <div class="pip" style="grid-column:3;grid-row:2"></div>
              <div class="pip" style="grid-column:1;grid-row:3"></div>
              <div class="pip" style="grid-column:3;grid-row:3"></div>
            </div>
          </div>

          <div id="eye-wrap" data-layout-allow-overflow>
            <div id="eye-cluster">
              <div id="eye-socket"></div>
              <div id="eye-bevel"></div>
              <div id="iris-glow"></div>
              <div id="iris-ring"></div>
              <div id="iris-flash"></div>
              <div id="eye-pupil"></div>
              <div id="glint-wrap"><div id="glint"></div></div>
            </div>
          </div>
        </div>

        <!-- grain-overlay (installed component, compositions/components/grain-overlay.html) -->
        <div
          id="grain-overlay"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100"
        >
          <div class="grain-texture"></div>
        </div>

        <!-- vignette (installed component, compositions/components/vignette.html) -->
        <div
          id="hf-vignette"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90"
        ></div>

        <!-- caption lives outside #scene (which gets a stacking context from its
             own GSAP transform) so its z-index can actually clear the vignette/grain -->
        <div id="caption-pos"><div id="caption">THEY GUESS. IT DOESN&rsquo;T.</div></div>
      </section>
    </div>

    <style>
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }

      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.12;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }

      #hf-vignette {
        background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.68) 100%);
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};

      // ---- deterministic PRNG (mulberry32) — no Math.random anywhere ----
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(84621);

      const tl = gsap.timeline({ paused: true });

      // ======================================================
      // dust field — seeded, continuous drift for the full 3.2s.
      // Positions ALWAYS use non-negative timeline positions: a negative
      // position retroactively shifts every other child's start time.
      // ======================================================
      const dustField = document.querySelector("#dust-field");
      const DUST_COUNT = 18;
      for (let i = 0; i < DUST_COUNT; i++) {
        const mote = document.createElement("div");
        mote.className = "dust";
        const size = 2 + rand() * 3;
        const x = 100 + rand() * 1720;
        const y = 480 + rand() * 540;
        const driftX = (rand() - 0.5) * 90;
        const driftY = -40 - rand() * 60;
        const dur = 2.6 + rand() * 2.2;
        const startAt = rand() * 1.4; // organic phase-offset, never negative
        const opac = 0.08 + rand() * 0.16;
        mote.style.width = size + "px";
        mote.style.height = size + "px";
        mote.style.left = x + "px";
        mote.style.top = y + "px";
        mote.style.opacity = String(opac);
        dustField.appendChild(mote);

        gsap.set(mote, { x: 0, y: 0 });
        tl.to(
          mote,
          { x: driftX, y: driftY, duration: dur, ease: "sine.inOut", yoyo: true, repeat: 6 },
          startAt,
        );
      }

      // ======================================================
      // ambient push — the whole scene breathes, never fully still
      // ======================================================
      tl.to("#scene", { scale: 1.006, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);

      // ======================================================
      // Beat 1 (0.0 - 0.5s) — die tumbles to a settled rest
      // ======================================================
      gsap.set("#die-face", { rotation: 34, x: -40, y: -40, scale: 0.92 });
      gsap.set("#die-shadow", { opacity: 0.12, scaleX: 0.55, scaleY: 0.55 });

      tl.to("#die-face", { rotation: -6, x: 0, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 0);
      tl.to("#die-shadow", { opacity: 0.5, scaleX: 1, scaleY: 1, duration: 0.42, ease: "power2.out" }, 0);
      // tiny settle bounce closing out beat 1
      tl.to("#die-face", { y: 5, scaleY: 0.94, scaleX: 1.04, duration: 0.06, ease: "power1.in" }, 0.42);
      tl.to("#die-face", { y: 0, scaleY: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, 0.48);

      // eye holds through beat 1 (no motion of its own beyond ambient push)

      // ======================================================
      // Beat 2 (0.5 - 1.4s) — the oxblood ring irises open across the eye
      // (bloom in, standing in for a clip-path aperture reveal — clip-path
      // isn't reliably tweenable on this runtime); glint travels the bevel
      // ======================================================
      gsap.set("#iris-ring", { opacity: 0, scale: 0.12 });
      gsap.set("#iris-glow", { opacity: 0, scale: 0.5 });
      tl.to("#iris-ring", { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.5);
      tl.to("#iris-glow", { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.5);

      gsap.set("#glint-wrap", { rotation: -90 });
      gsap.set("#glint", { opacity: 0 });
      tl.to("#glint-wrap", { rotation: 270, duration: 0.9, ease: "power2.inOut" }, 0.5);
      tl.to("#glint", { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.5);
      tl.to("#glint", { opacity: 0, duration: 0.15, ease: "power1.in" }, 1.25);

      // ======================================================
      // Beat 3 (1.4 - 1.7s) — full emissive snap + overshoot-and-settle
      // punch (the eye has locked on); die dims; a beat later the caption
      // settles in beneath the eye
      // ======================================================
      gsap.set("#iris-flash", { opacity: 0 });
      tl.to("#iris-flash", { opacity: 1, duration: 0.05, ease: "none" }, 1.4);
      tl.to("#iris-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 1.45);

      tl.to("#iris-glow", { opacity: 1, scale: 1.14, duration: 0.07, ease: "power4.out" }, 1.4);
      tl.to("#iris-glow", { opacity: 0.82, scale: 1, duration: 0.22, ease: "power2.out" }, 1.47);

      // hard overshoot-and-settle punch on the whole eye cluster
      tl.to("#eye-cluster", { scale: 1.09, duration: 0.06, ease: "power4.out" }, 1.4);
      tl.to("#eye-cluster", { scale: 1, duration: 0.09, ease: "power2.out" }, 1.46);

      // the die dims as it loses the frame's attention
      tl.to("#die-face", { opacity: 0.6, duration: 0.3, ease: "power2.out" }, 1.4);

      // a beat later: caption settles in beneath the eye
      gsap.set("#caption", { opacity: 0, y: 18 });
      tl.to("#caption", { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, 1.55);

      // ======================================================
      // Beat 4 (1.7 - 3.2s) — gentle ambient idle to the final frame: the
      // iris breathes faintly, dust keeps drifting, nothing goes fully
      // static (scene breathing + dust above already run the full 3.2s)
      // ======================================================
      tl.to(
        "#iris-glow",
        { opacity: 0.6, scale: 0.96, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 1 },
        1.7,
      );

      window.__timelines["shein_08_iris"] = tl;
    </script>
  </body>
</html>
