<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shot 08 — They Guess, It Doesn't</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0b0b0c;
        --bone: #ede8dd;
        --oxblood: #7a160e;
        --graphite: #3a3a3e;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(120% 95% at 62% 46%, #131314 0%, #0e0e0f 46%, var(--ground) 100%);
      }

      /* everything but the background/overlays rides one barely-visible
         ambient breathing loop (and, briefly, the impact camera-shake) so
         the frame never sits fully motionless */
      #scene {
        position: absolute;
        inset: 0;
      }

      /* ---------------- dust ---------------- */
      .dust {
        position: absolute;
        border-radius: 50%;
        background: var(--bone);
        pointer-events: none;
        will-change: transform, opacity;
      }

      /* ---------------- die (flat 2D panel, lower-left, subordinate —
         only rotation/x/y/scale/opacity/width/height are reliably
         tweenable by this runtime, so no 3D cube faces here) ---------------- */
      #die-wrap {
        position: absolute;
        left: 220px;
        top: 790px;
        width: 220px;
        height: 190px;
      }

      #die-shadow {
        position: absolute;
        left: 50%;
        bottom: 18px;
        width: 130px;
        height: 30px;
        margin-left: -65px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 72%);
        border-radius: 50%;
        will-change: transform, opacity;
      }

      #die-face {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 92px;
        height: 92px;
        margin-left: -46px;
        margin-top: -46px;
        border-radius: 11px;
        background: linear-gradient(155deg, #46464a 0%, var(--graphite) 45%, #262629 100%);
        box-shadow:
          inset 0 0 0 1px rgba(237, 232, 221, 0.06),
          0 10px 18px rgba(0, 0, 0, 0.55);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 15px;
        will-change: transform, opacity;
      }

      .pip {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(35% 35% at 35% 32%, #cfc9bc 0%, #8f8a80 55%, #57534c 100%);
        align-self: center;
        justify-self: center;
      }

      /* ---------------- mechanical iris — 55% of frame width (1056px),
         fully contained within the frame, centered on the right third ---------------- */
      #eye-wrap {
        position: absolute;
        left: 1280px;
        top: 540px;
      }

      #eye-cluster {
        position: relative;
        width: 1056px;
        height: 1056px;
        margin-left: -528px;
        margin-top: -528px;
        will-change: transform;
      }

      /* brushed dark metal body — layered static gradients (banding +
         a soft sheen) stand in for a metal texture; none of this is
         GSAP-animated, so a rich static look costs nothing */
      #eye-socket {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          repeating-linear-gradient(
            98deg,
            rgba(255, 255, 255, 0.028) 0px,
            rgba(255, 255, 255, 0.028) 1px,
            rgba(0, 0, 0, 0) 1px,
            rgba(0, 0, 0, 0) 3px
          ),
          radial-gradient(60% 56% at 38% 32%, #55555b 0%, #3f3f44 34%, #2a2a2e 62%, #18181a 100%);
        box-shadow:
          inset 0 0 0 2px rgba(237, 232, 221, 0.05),
          0 30px 70px rgba(0, 0, 0, 0.6);
      }

      /* the machined bevel — a raised metallic rim just inside the
         socket's outer edge; static conic sheen, never animated */
      #eye-bevel {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 950px;
        height: 950px;
        margin-left: -475px;
        margin-top: -475px;
        border-radius: 50%;
        border: 4px solid transparent;
        background:
          conic-gradient(
              from 220deg,
              rgba(237, 232, 221, 0.32) 0deg,
              rgba(237, 232, 221, 0.04) 70deg,
              rgba(0, 0, 0, 0.35) 150deg,
              rgba(237, 232, 221, 0.1) 230deg,
              rgba(237, 232, 221, 0.32) 360deg
            )
            border-box;
        -webkit-mask:
          linear-gradient(#000 0 0) padding-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      /* soft emissive halo behind the ring — glow baked in as static CSS
         (blur/gradient aren't reliably tweenable here); GSAP only ever
         moves its opacity, which reads as the halo brightening */
      #iris-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 900px;
        height: 900px;
        margin-left: -450px;
        margin-top: -450px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(122, 22, 14, 0.65) 0%, rgba(122, 22, 14, 0.28) 46%, rgba(122, 22, 14, 0) 72%);
        filter: blur(18px);
        will-change: opacity;
      }

      /* the ring's full-brightness fill — a solid, FIXED-size oxblood
         disc; GSAP only ever tweens its opacity. The dark #aperture disc
         on top of it is what actually changes radius — that geometric
         shrink/grow is what uncovers this fill into a visible "ring". */
      #ring-fill {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 700px;
        margin-left: -350px;
        margin-top: -350px;
        border-radius: 50%;
        background: var(--oxblood);
        will-change: opacity;
      }

      /* the dark aperture — a REAL camera-diaphragm stand-in: GSAP tweens
         its width/height directly (both on the runtime's supported-
         property list), shrinking its actual footprint to uncover more of
         #ring-fill beneath it. Centered with a static transform (not a
         width-dependent margin) so it stays centered as its size changes. */
      #aperture {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(60% 56% at 38% 32%, #4a4a50 0%, #34343a 34%, #202024 62%, #0c0c0d 100%);
        box-shadow: inset 0 0 34px 8px rgba(0, 0, 0, 0.75);
        will-change: width, height;
      }

      /* impact burst — static bright gradient, GSAP only tweens opacity */
      #iris-flash {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 700px;
        margin-left: -350px;
        margin-top: -350px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 200, 0.85) 0%, rgba(230, 120, 100, 0.35) 45%, rgba(230, 120, 100, 0) 75%);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      /* the specular glint travels the bevel once */
      #glint-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 950px;
        height: 950px;
        margin-left: -475px;
        margin-top: -475px;
      }

      #glint {
        position: absolute;
        left: 50%;
        top: 0;
        width: 30px;
        height: 30px;
        margin-left: -15px;
        margin-top: -4px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, var(--bone) 0%, rgba(237, 232, 221, 0.55) 55%, rgba(237, 232, 221, 0) 100%);
      }

      /* ---------------- caption ---------------- */
      /* static positioning wrapper (never touched by GSAP) + a plain inner
         element GSAP animates opacity on — keeps GSAP from ever owning
         (and discarding) the CSS translateX centering transform. The eye
         is 55% of frame width and nearly fills the frame's height too, so
         there is no room for the caption entirely below it without
         overlap; it sits in the bottom safe margin with a text-shadow so
         it stays legible over whatever it crosses. */
      #caption-pos {
        position: absolute;
        left: 1280px;
        top: 978px;
        transform: translateX(-50%);
        z-index: 110;
      }

      #caption {
        white-space: nowrap;
        color: var(--bone);
        font-weight: 700;
        font-size: 48px;
        letter-spacing: 0.05em;
        text-align: center;
        text-shadow:
          0 2px 10px rgba(0, 0, 0, 0.85),
          0 0 26px rgba(0, 0, 0, 0.65);
      }

      #grain-overlay,
      #hf-vignette {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="shein_08_iris"
      data-start="0"
      data-duration="3.2"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div id="scene" data-layout-allow-overflow>
          <div id="dust-field" data-layout-allow-overflow></div>

          <div id="die-wrap" data-layout-allow-overflow>
            <div id="die-shadow"></div>
            <div id="die-face">
              <div class="pip" style="grid-column:1;grid-row:1"></div>
              <div class="pip" style="grid-column:3;grid-row:1"></div>
              <div class="pip" style="grid-column:1;grid-row:2"></div>
              <div class="pip" style="grid-column:3;grid-row:2"></div>
              <div class="pip" style="grid-column:1;grid-row:3"></div>
              <div class="pip" style="grid-column:3;grid-row:3"></div>
            </div>
          </div>

          <div id="eye-wrap" data-layout-allow-overflow>
            <div id="eye-cluster">
              <div id="eye-socket"></div>
              <div id="eye-bevel"></div>
              <div id="iris-glow"></div>
              <div id="ring-fill"></div>
              <div id="aperture"></div>
              <div id="iris-flash"></div>
              <div id="glint-wrap"><div id="glint"></div></div>
            </div>
          </div>
        </div>

        <!-- grain-overlay (installed component, compositions/components/grain-overlay.html) -->
        <div
          id="grain-overlay"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100"
        >
          <div class="grain-texture"></div>
        </div>

        <!-- vignette (installed component, compositions/components/vignette.html) -->
        <div
          id="hf-vignette"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90"
        ></div>

        <!-- caption lives outside #scene (which gets a stacking context from its
             own GSAP transform) so its z-index can actually clear the vignette/grain -->
        <div id="caption-pos"><div id="caption">THEY GUESS. IT DOESN&rsquo;T.</div></div>
      </section>
    </div>

    <style>
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }

      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.12;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }

      #hf-vignette {
        background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.68) 100%);
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};

      // ---- deterministic PRNG (mulberry32) — no Math.random anywhere ----
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(84621);

      const tl = gsap.timeline({ paused: true });

      // ======================================================
      // dust field — seeded, continuous drift for the full 3.2s.
      // Positions ALWAYS use non-negative timeline positions: a negative
      // position retroactively shifts every other child's start time.
      // ======================================================
      const dustField = document.querySelector("#dust-field");
      const DUST_COUNT = 18;
      for (let i = 0; i < DUST_COUNT; i++) {
        const mote = document.createElement("div");
        mote.className = "dust";
        const size = 2 + rand() * 3;
        const x = 100 + rand() * 1720;
        const y = 480 + rand() * 540;
        const driftX = (rand() - 0.5) * 90;
        const driftY = -40 - rand() * 60;
        const dur = 2.6 + rand() * 2.2;
        const startAt = rand() * 1.4; // organic phase-offset, never negative
        const opac = 0.08 + rand() * 0.16;
        mote.style.width = size + "px";
        mote.style.height = size + "px";
        mote.style.left = x + "px";
        mote.style.top = y + "px";
        mote.style.opacity = String(opac);
        dustField.appendChild(mote);

        gsap.set(mote, { x: 0, y: 0 });
        tl.to(
          mote,
          { x: driftX, y: driftY, duration: dur, ease: "sine.inOut", yoyo: true, repeat: 6 },
          startAt,
        );
      }

      // ======================================================
      // ambient push — the whole scene breathes, never fully still
      // (roughly 1.00 to 1.03 and back, continuously)
      // ======================================================
      tl.to("#scene", { scale: 1.03, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);

      // ======================================================
      // Beat 1 (0.0 - 0.5s) — the die is already mid-tumble at frame 0 and
      // settles fully by 0.5s with a slight rotational overshoot-and-stop
      // (back.out gives the overshoot for free).
      // ======================================================
      gsap.set("#die-face", { rotation: 262, x: -46, y: -34, scale: 0.9 });
      gsap.set("#die-shadow", { opacity: 0.14, scaleX: 0.55, scaleY: 0.55 });

      tl.to("#die-face", { rotation: -7, x: 0, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, 0);
      tl.to("#die-shadow", { opacity: 0.5, scaleX: 1, scaleY: 1, duration: 0.42, ease: "power2.out" }, 0);
      // tiny settle bounce closing out beat 1
      tl.to("#die-face", { y: 4, scaleY: 0.95, scaleX: 1.03, duration: 0.04, ease: "power1.in" }, 0.42);
      tl.to("#die-face", { y: 0, scaleY: 1, scaleX: 1, duration: 0.08, ease: "power2.out" }, 0.46);

      // ======================================================
      // Beat 2 (0.5 - 1.4s) — TRUE aperture close-down-and-reopen: the
      // dark #aperture disc's own width/height shrink (a real geometric
      // radius change, both properties on this runtime's supported list),
      // uncovering the fixed-size oxblood #ring-fill disc beneath it,
      // while that fill's opacity brightens over the same window. A
      // specular glint sweeps the bevel once alongside it. The eye holds
      // fully closed (dormant) until this window starts.
      // ======================================================
      const APERTURE_CLOSED_D = 760; // fully covers ring-fill: no red visible
      const APERTURE_OPEN_D = 320; // resting open size once the ring is revealed

      gsap.set("#aperture", { width: APERTURE_CLOSED_D, height: APERTURE_CLOSED_D });
      gsap.set("#ring-fill", { opacity: 0.04 }); // dormant: essentially no red yet
      gsap.set("#iris-glow", { opacity: 0 });

      tl.to(
        "#aperture",
        { width: APERTURE_OPEN_D, height: APERTURE_OPEN_D, duration: 0.9, ease: "power2.out" },
        0.5,
      );
      tl.to("#ring-fill", { opacity: 0.78, duration: 0.9, ease: "power2.out" }, 0.5);
      tl.to("#iris-glow", { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.5);

      gsap.set("#glint-wrap", { rotation: -90 });
      gsap.set("#glint", { opacity: 0 });
      tl.to("#glint-wrap", { rotation: 270, duration: 0.9, ease: "power2.inOut" }, 0.5);
      tl.to("#glint", { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.5);
      tl.to("#glint", { opacity: 0, duration: 0.15, ease: "power1.in" }, 1.25);

      // ======================================================
      // Beat 3 (1.4 - 1.55s, exact impact at 1.4) — the aperture mechanism
      // snaps fully open: eye-cluster punches to 112% in <100ms and
      // springs back to 100% by 1.55s exactly; a 6px camera-shake on
      // #scene damps out over the same 150ms window; the ring flashes to
      // its single brightest value at the instant of the punch, then
      // settles to a steady glow; the die dims to about half brightness
      // in this same 100ms window.
      // ======================================================
      tl.to("#eye-cluster", { scale: 1.12, duration: 0.08, ease: "power4.out" }, 1.4);
      tl.to("#eye-cluster", { scale: 1.0, duration: 0.07, ease: "power2.out" }, 1.48);

      // 6px camera-shake, damping out over 1.4 -> 1.55
      tl.to("#scene", { x: 6, y: -4, duration: 0.02, ease: "none" }, 1.4);
      tl.to("#scene", { x: -5, y: 3, duration: 0.02, ease: "none" }, 1.42);
      tl.to("#scene", { x: 4, y: -3, duration: 0.02, ease: "none" }, 1.44);
      tl.to("#scene", { x: -3, y: 2, duration: 0.02, ease: "none" }, 1.46);
      tl.to("#scene", { x: 2, y: -1, duration: 0.02, ease: "none" }, 1.48);
      tl.to("#scene", { x: -1, y: 1, duration: 0.02, ease: "none" }, 1.5);
      tl.to("#scene", { x: 0, y: 0, duration: 0.03, ease: "power1.out" }, 1.52);

      gsap.set("#iris-flash", { opacity: 0 });
      tl.to("#iris-flash", { opacity: 1, duration: 0.04, ease: "none" }, 1.4);
      tl.to("#iris-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 1.44);

      // ring flashes to its single brightest value at the exact instant of
      // the punch, then settles back to a steady glow
      tl.to("#ring-fill", { opacity: 1, duration: 0.04, ease: "none" }, 1.4);
      tl.to("#ring-fill", { opacity: 0.8, duration: 0.25, ease: "power2.out" }, 1.44);
      tl.to("#iris-glow", { opacity: 1, duration: 0.04, ease: "none" }, 1.4);
      tl.to("#iris-glow", { opacity: 0.82, duration: 0.25, ease: "power2.out" }, 1.44);

      // the die dims to roughly half brightness in the same 100ms window
      tl.to("#die-face", { opacity: 0.5, duration: 0.1, ease: "power2.out" }, 1.4);

      // ======================================================
      // Beat 4 (1.55s) — a beat after the impact has fully finished (never
      // simultaneously with it), the caption fades in. Its color is a
      // static CSS value (never GSAP-animated) and the fade is fast
      // enough (~2 frames at 24fps) that it never reads as a gray
      // mid-transition — it's the correct bone hex from its first visible
      // frame, just very briefly ramping opacity.
      // ======================================================
      gsap.set("#caption", { opacity: 0 });
      tl.to("#caption", { opacity: 1, duration: 0.08, ease: "power1.out" }, 1.55);

      // ======================================================
      // Beat 5 (1.7 - 2.9s) — sustained: nothing new happens, but nothing
      // stops either. The ring pulses faintly; ambient scene breathing and
      // dust (above) already run continuously through the full 3.2s.
      // ======================================================
      tl.to(
        "#ring-fill",
        { opacity: 0.68, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 4 },
        1.7,
      );

      // ======================================================
      // Beat 6 (2.9 - 3.2s) — calm, fully resolved hold: dust and the
      // faint ring-breath (both already running through 3.2s) keep the
      // frame alive without introducing anything new. No fade to black —
      // this is a hard cut into the next shot.
      // ======================================================

      window.__timelines["shein_08_iris"] = tl;
    </script>
  </body>
</html>
