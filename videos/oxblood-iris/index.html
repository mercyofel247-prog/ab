<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Oxblood Iris — They Guess. It Doesn't.</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0b0b0c;
        --graphite: #3a3a3e;
        --graphite-hi: #55555b;
        --graphite-lo: #202023;
        --metal: #c9c4ba;
        --metal-hi: #e8e3d8;
        --metal-lo: #8d887e;
        --ox: #7a160e;
        --ox-hi: #c43c26;
        --ox-lo: #470c08;
        --bone: #ede8dd;
        --pupil: #0a0a0b;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }

      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* faint cold vignette + grain for atmosphere */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 46% 46%, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, 0.62) 100%);
        pointer-events: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.5;
        pointer-events: none;
      }

      .dust {
        position: absolute;
        border-radius: 50%;
        background: rgba(201, 196, 186, 0.5);
        filter: blur(0.5px);
        pointer-events: none;
      }

      /* ================= scene push (barely-visible ambient scale) ================= */
      #scene-push {
        position: absolute;
        inset: 0;
        display: block;
      }

      /* ================= die ================= */
      #die-stage {
        position: absolute;
        left: 60px;
        top: 660px;
        width: 360px;
        height: 360px;
        perspective: 900px;
        perspective-origin: 50% 60%;
      }

      #die-cube {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        transform-style: preserve-3d;
        will-change: transform;
      }

      #die-shadow {
        position: absolute;
        left: 50%;
        bottom: 24px;
        width: 150px;
        height: 34px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 72%);
        transform: translateX(-50%);
        pointer-events: none;
      }

      .face {
        position: absolute;
        width: 126px;
        height: 126px;
        border-radius: 14px;
        background: linear-gradient(155deg, var(--graphite-hi) 0%, var(--graphite) 45%, var(--graphite-lo) 100%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.06),
          inset 0 10px 18px rgba(255, 255, 255, 0.05),
          inset 0 -14px 20px rgba(0, 0, 0, 0.4);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 20px;
      }

      .pip {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: radial-gradient(35% 35% at 35% 30%, #101012 0%, #050506 70%);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
        justify-self: center;
        align-self: center;
        opacity: 0;
      }

      .face-top {
        transform: rotateX(90deg) translateZ(63px);
      }
      .face-front {
        transform: translateZ(63px);
      }
      .face-right {
        transform: rotateY(90deg) translateZ(63px);
        filter: brightness(0.86);
      }

      /* pip layouts per face (fixed dice faces: top=5, front=3, right=2) */
      .face-top .p1 {
        grid-area: 1 / 1;
        opacity: 1;
      }
      .face-top .p2 {
        grid-area: 1 / 3;
        opacity: 1;
      }
      .face-top .p3 {
        grid-area: 2 / 2;
        opacity: 1;
      }
      .face-top .p4 {
        grid-area: 3 / 1;
        opacity: 1;
      }
      .face-top .p5 {
        grid-area: 3 / 3;
        opacity: 1;
      }

      .face-front .p1 {
        grid-area: 1 / 1;
        opacity: 1;
      }
      .face-front .p2 {
        grid-area: 2 / 2;
        opacity: 1;
      }
      .face-front .p3 {
        grid-area: 3 / 3;
        opacity: 1;
      }

      .face-right .p1 {
        grid-area: 1 / 1;
        opacity: 1;
      }
      .face-right .p2 {
        grid-area: 3 / 3;
        opacity: 1;
      }

      /* ================= mechanical iris / eye ================= */
      #iris-outer {
        position: absolute;
        left: 860px;
        top: 20px;
        width: 1040px;
        height: 1040px;
      }

      #iris-cluster {
        position: relative;
        width: 100%;
        height: 100%;
        will-change: transform;
      }

      /* brushed dark-metal housing with a machined bevel */
      #iris-housing {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          repeating-conic-gradient(
            from 0deg,
            rgba(255, 255, 255, 0.09) 0deg 1.2deg,
            rgba(0, 0, 0, 0.05) 1.2deg 2.6deg
          ),
          radial-gradient(50% 50% at 50% 50%, var(--metal) 0%, var(--metal) 58%, var(--metal-lo) 78%, #6b665e 100%);
        box-shadow:
          inset 0 0 0 10px rgba(255, 255, 255, 0.12),
          inset 0 0 0 14px rgba(0, 0, 0, 0.32),
          inset 0 18px 40px rgba(255, 255, 255, 0.1),
          inset 0 -26px 50px rgba(0, 0, 0, 0.45),
          0 30px 70px rgba(0, 0, 0, 0.55);
      }

      /* machined concentric grooves */
      #iris-grooves {
        position: absolute;
        inset: 46px;
        border-radius: 50%;
        background: repeating-radial-gradient(
          circle at 50% 50%,
          rgba(0, 0, 0, 0.16) 0px,
          rgba(0, 0, 0, 0.16) 1px,
          rgba(255, 255, 255, 0.07) 2px,
          rgba(255, 255, 255, 0.07) 3px
        );
        opacity: 0.55;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 63%, transparent 100%, #000 100%);
      }

      /* rotating specular glint sweeping the bevel */
      #glint-rotor {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      #glint {
        position: absolute;
        left: 50%;
        top: -6px;
        width: 210px;
        height: 96px;
        transform: translateX(-50%);
        background: radial-gradient(50% 50% at 50% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 72%);
        opacity: 0;
        filter: blur(2px);
      }

      /* inner well — closed aperture, dark, no red until 0.5s */
      #iris-well {
        position: absolute;
        inset: 96px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 44%, #16151a 0%, var(--pupil) 62%, #000 100%);
        box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.6), inset 0 14px 30px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      /* emissive oxblood ring — revealed via clip-path, like an aperture opening */
      #iris-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          transparent 0%,
          transparent 20%,
          var(--ox-hi) 34%,
          var(--ox) 54%,
          var(--ox-lo) 72%,
          transparent 82%
        );
        clip-path: circle(0% at 50% 50%);
        filter: brightness(0.72) saturate(0.9);
      }

      #iris-pupil {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 36%;
        height: 36%;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 42% 38%, #232227 0%, #0a0a0b 70%, #000 100%);
        transform: translate(-50%, -50%);
      }

      /* ================= caption ================= */
      #caption {
        position: absolute;
        left: 380px;
        top: 902px;
        width: 1120px;
        font-size: 46px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--bone);
        text-transform: uppercase;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.2"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="grain" data-layout-allow-overflow></div>
        <div class="vignette" data-layout-allow-overflow></div>

        <div id="scene-push" data-layout-allow-overflow>
          <div id="die-stage" data-layout-allow-overflow>
            <div id="die-shadow"></div>
            <div id="die-cube">
              <div class="face face-top">
                <div class="pip p1"></div>
                <div class="pip p2"></div>
                <div class="pip p3"></div>
                <div class="pip p4"></div>
                <div class="pip p5"></div>
              </div>
              <div class="face face-front">
                <div class="pip p1"></div>
                <div class="pip p2"></div>
                <div class="pip p3"></div>
              </div>
              <div class="face face-right">
                <div class="pip p1"></div>
                <div class="pip p2"></div>
              </div>
            </div>
          </div>

          <div id="iris-outer" data-layout-allow-overflow>
            <div id="iris-cluster">
              <div id="iris-housing"></div>
              <div id="iris-grooves"></div>
              <div id="glint-rotor">
                <div id="glint"></div>
              </div>
              <div id="iris-well">
                <div id="iris-ring"></div>
                <div id="iris-pupil"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="caption">They guess. It doesn't.</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // ---- deterministic dust motes ----
      const stage = document.getElementById("stage");
      const dustSeeds = [
        { x: 180, y: 220, s: 3, dx: 30, dy: -18 },
        { x: 420, y: 140, s: 2, dx: -22, dy: 24 },
        { x: 720, y: 300, s: 4, dx: 26, dy: 20 },
        { x: 1040, y: 160, s: 2, dx: -18, dy: -26 },
        { x: 260, y: 520, s: 3, dx: 24, dy: 22 },
        { x: 1620, y: 200, s: 3, dx: -26, dy: 18 },
        { x: 1780, y: 420, s: 2, dx: -20, dy: -20 },
        { x: 1500, y: 860, s: 2, dx: 18, dy: -22 },
        { x: 980, y: 940, s: 3, dx: 22, dy: -18 },
        { x: 150, y: 900, s: 2, dx: 20, dy: -16 },
      ];
      const dustEls = dustSeeds.map((d) => {
        const el = document.createElement("div");
        el.className = "dust";
        el.style.left = d.x + "px";
        el.style.top = d.y + "px";
        el.style.width = d.s + "px";
        el.style.height = d.s + "px";
        el.style.opacity = "0";
        stage.insertBefore(el, stage.firstChild.nextSibling);
        return el;
      });

      const tl = gsap.timeline({ paused: true });

      // ---- constants ----
      const DIE_SETTLE = 0.5;
      const IRIS_OPEN_START = 0.5;
      const IRIS_OPEN_DUR = 0.9; // -> ends 1.4
      const IMPACT_T = 1.4;
      const IMPACT_RETURN = 1.55;
      const CAPTION_T = 1.55;
      const AMBIENT_START = 1.7;
      const AMBIENT_MID_END = 2.9;
      const END = 3.2;

      // ================= dust: gentle drift across the whole take =================
      dustEls.forEach((el, i) => {
        const seed = dustSeeds[i];
        gsap.set(el, { opacity: 0, x: 0, y: 0 });
        tl.to(el, { opacity: 0.35, duration: 0.5, ease: "sine.out" }, 0.1 + i * 0.05);
        tl.to(el, { x: seed.dx, y: seed.dy, duration: END, ease: "sine.inOut" }, 0);
      });

      // ================= die: tumble in and settle by 0.5s =================
      gsap.set("#die-cube", { rotationX: -430, rotationY: 260, rotationZ: -40, scale: 0.82, transformOrigin: "50% 50%" });
      gsap.set("#die-stage", { opacity: 0 });
      gsap.set("#die-shadow", { opacity: 0 });

      tl.to("#die-stage", { opacity: 1, duration: 0.12, ease: "none" }, 0);
      tl.to("#die-shadow", { opacity: 1, duration: 0.3, ease: "sine.out" }, 0.1);
      // tumble to a settled resting orientation with a slight rotational overshoot
      tl.to(
        "#die-cube",
        { rotationX: -14, rotationY: 18, rotationZ: -6, scale: 1, duration: 0.4, ease: "back.out(1.9)" },
        0.05,
      );

      // die dims slightly once the eye takes over (1.4s onward, sustained)
      tl.to("#die-stage", { opacity: 0.55, duration: 0.3, ease: "power2.out" }, IMPACT_T);

      // ================= iris: dormant, then aperture reveal =================
      // 0 - 0.5s: dormant, no red — element already starts clipped to 0%, nothing to do.

      // specular glint sweep starts its rotor slightly ahead of frame-left
      gsap.set("#glint-rotor", { rotation: -110 });

      // clip-path reveal — the emissive ring irises open like a camera aperture
      tl.to(
        "#iris-ring",
        { clipPath: "circle(52% at 50% 50%)", duration: IRIS_OPEN_DUR, ease: "power4.out" },
        IRIS_OPEN_START,
      );
      tl.to("#iris-ring", { filter: "brightness(1) saturate(1)", duration: IRIS_OPEN_DUR, ease: "power4.out" }, IRIS_OPEN_START);

      // specular glint travels the metal bevel in the same 900ms window
      tl.to("#glint", { opacity: 0.9, duration: 0.18, ease: "sine.out" }, IRIS_OPEN_START);
      tl.to("#glint", { opacity: 0, duration: 0.3, ease: "sine.in" }, IRIS_OPEN_START + IRIS_OPEN_DUR - 0.3);
      tl.to("#glint-rotor", { rotation: 250, duration: IRIS_OPEN_DUR, ease: "sine.inOut" }, IRIS_OPEN_START);

      // ================= impact at 1.4s: snap to full emissive brightness =================
      tl.to("#iris-ring", { filter: "brightness(1.7) saturate(1.15)", duration: 0.05, ease: "none" }, IMPACT_T);
      tl.to(
        "#iris-ring",
        { filter: "brightness(1.08) saturate(1.05)", duration: 0.4, ease: "power2.out" },
        IMPACT_T + 0.05,
      );
      tl.set("#iris-housing", { filter: "brightness(1.25)" }, IMPACT_T);
      tl.to("#iris-housing", { filter: "brightness(1)", duration: 0.35, ease: "power2.out" }, IMPACT_T + 0.02);

      // discrete impact — cluster punches to 111% then returns to 100% by 1.55s
      tl.to("#iris-cluster", { scale: 1.11, duration: 0.09, ease: "power2.out" }, IMPACT_T);
      tl.to("#iris-cluster", { scale: 1, duration: IMPACT_RETURN - (IMPACT_T + 0.09), ease: "back.out(2.4)" }, IMPACT_T + 0.09);

      // ================= caption =================
      gsap.set("#caption", { y: 22 });
      tl.to("#caption", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, CAPTION_T);

      // ================= ambient hold: nothing new, but never still =================
      // whole-scene barely-visible push (1.008 -> 1.05, sine.inOut)
      gsap.set("#scene-push", { scale: 1.008, transformOrigin: "50% 50%" });
      tl.to(
        "#scene-push",
        { scale: 1.05, duration: 0.3, ease: "sine.inOut", repeat: 3, yoyo: true },
        AMBIENT_START,
      );

      // oxblood ring breathes +-6% opacity
      tl.to(
        "#iris-ring",
        { opacity: 0.94, duration: 0.3, ease: "sine.inOut", repeat: 3, yoyo: true },
        AMBIENT_START,
      );

      // settle (2.9 - 3.2s): ease the breathing back to a steady, sharp rest — never a fade
      tl.to("#scene-push", { scale: 1.02, duration: 0.2, ease: "sine.out" }, AMBIENT_MID_END);
      tl.to("#iris-ring", { opacity: 1, duration: 0.2, ease: "sine.out" }, AMBIENT_MID_END);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
