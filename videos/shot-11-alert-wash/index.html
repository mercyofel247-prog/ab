<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shot 11 — $8.8 Trillion Alert Wash</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ── Mode B anchor palette ──────────────────────────────────
         machined-metal steel + studio key + lit-red emissive alert   */
      :root {
        --bg-0: #04050a;
        --bg-1: #0f1218;
        --bg-2: #262b34;
        --steel-hi: #f4f6f9;
        --steel-mid: #aab2bd;
        --steel-lo: #3d434d;
        --alert: #ff2436;
        --alert-hi: #ff7d88;
        --alert-deep: #b3121f;
        --ink-dim: #8f96a1;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-0);
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(120% 95% at 50% 34%, var(--bg-2) 0%, var(--bg-1) 48%, var(--bg-0) 100%);
      }

      /* Studio key light — a soft directional hotspot from upper-left,
         powers on at the head of the shot. */
      .keylight {
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(48% 42% at 38% 20%, rgba(214, 228, 244, 0.5) 0%, rgba(214, 228, 244, 0) 62%),
          radial-gradient(70% 60% at 62% 78%, rgba(120, 138, 162, 0.18) 0%, rgba(120, 138, 162, 0) 60%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* brushed-metal streaks */
      .brushed {
        position: absolute;
        inset: -10% -10%;
        background: repeating-linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.05) 0px,
          rgba(255, 255, 255, 0.05) 1px,
          rgba(255, 255, 255, 0) 3px,
          rgba(255, 255, 255, 0) 7px,
          rgba(255, 255, 255, 0.03) 8px,
          rgba(255, 255, 255, 0) 10px
        );
        mix-blend-mode: overlay;
        opacity: 0.55;
      }

      /* fine hairline grid — data-instrument texture */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.5;
      }

      /* diagonal hazard stripes — only lit during the alert wash */
      .hazard {
        position: absolute;
        inset: -20%;
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 36, 54, 0.16) 0px,
          rgba(255, 36, 54, 0.16) 34px,
          rgba(255, 36, 54, 0) 34px,
          rgba(255, 36, 54, 0) 92px
        );
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* full-frame red alert wash — floods in from the right */
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(80% 70% at 68% 50%, rgba(255, 36, 54, 0.55) 0%, rgba(179, 18, 31, 0.28) 42%, rgba(179, 18, 31, 0) 78%),
          linear-gradient(90deg, rgba(120, 6, 14, 0) 30%, rgba(255, 36, 54, 0.22) 100%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* thin scanning alert line that sweeps the frame */
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 3px;
        background: linear-gradient(90deg, rgba(255, 36, 54, 0) 0%, var(--alert-hi) 50%, rgba(255, 36, 54, 0) 100%);
        box-shadow: 0 0 22px 4px rgba(255, 36, 54, 0.6);
        opacity: 0;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(75% 65% at 50% 46%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.64) 100%);
      }

      /* editorial crop marks in the corners */
      .frame {
        position: absolute;
        inset: 46px;
        pointer-events: none;
      }
      .tick {
        position: absolute;
        width: 42px;
        height: 42px;
        border: 2px solid rgba(255, 255, 255, 0.16);
        opacity: 0;
      }
      .tick.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
      .tick.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
      .tick.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
      .tick.br { bottom: 0; right: 0; border-left: none; border-top: none; }

      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        z-index: 4;
      }

      .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.44em;
        text-transform: uppercase;
        color: #c4cad3;
        opacity: 0;
      }

      /* machined-metal number — stacked steel base + red emissive overlay */
      .number-stack {
        position: relative;
        display: inline-block;
      }

      .amount {
        font-size: 210px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .amount.steel {
        position: relative;
        background: linear-gradient(
          180deg,
          var(--steel-hi) 0%,
          var(--steel-mid) 42%,
          var(--steel-lo) 54%,
          var(--steel-hi) 62%,
          var(--steel-mid) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.6));
      }

      /* the "lit-red emissive" layer that ignites on the wash */
      .amount.emissive {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          var(--alert-hi) 0%,
          var(--alert) 42%,
          var(--alert-deep) 58%,
          var(--alert-hi) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        mix-blend-mode: screen;
        filter: drop-shadow(0 0 26px rgba(255, 36, 54, 0.75));
        opacity: 0;
        pointer-events: none;
      }

      /* specular highlight that sweeps across the number once */
      .spec {
        position: absolute;
        top: -12%;
        bottom: -12%;
        width: 240px;
        left: 0;
        transform: translateX(-320px) skewX(-16deg);
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.14) 46%,
          rgba(255, 255, 255, 0.34) 50%,
          rgba(255, 255, 255, 0.14) 54%,
          rgba(255, 255, 255, 0) 100%
        );
        mix-blend-mode: overlay;
        opacity: 0;
        pointer-events: none;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 26px;
        opacity: 0;
      }
      .wordmark .rule {
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, rgba(170, 178, 189, 0), var(--steel-mid));
      }
      .wordmark .rule.right {
        background: linear-gradient(90deg, var(--steel-mid), rgba(170, 178, 189, 0));
      }
      .wordmark .label {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.52em;
        text-indent: 0.52em;
        color: var(--steel-hi);
        text-transform: uppercase;
      }

      .readout {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.1em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-dim);
        white-space: nowrap;
      }

      /* the ALERT tag that snaps on with the wash */
      .alert-tag {
        position: absolute;
        top: 300px;
        left: 50%;
        transform: translateX(-50%) scale(1);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 26px;
        border: 2px solid var(--alert);
        border-radius: 4px;
        background: rgba(255, 36, 54, 0.08);
        box-shadow: 0 0 30px rgba(255, 36, 54, 0.35), inset 0 0 18px rgba(255, 36, 54, 0.18);
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        text-transform: uppercase;
        color: var(--alert-hi);
        opacity: 0;
        z-index: 5;
      }
      .alert-tag .dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--alert);
        box-shadow: 0 0 14px 3px rgba(255, 36, 54, 0.9);
      }

      .flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(64% 58% at 50% 46%, rgba(255, 120, 130, 0.55) 0%, rgba(255, 120, 130, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="keylight" class="keylight" data-layout-allow-overflow></div>
        <div class="brushed" data-layout-allow-overflow></div>
        <div class="grid"></div>
        <div id="hazard" class="hazard" data-layout-allow-overflow></div>
        <div id="wash" class="wash"></div>
        <div id="scanline" class="scanline"></div>

        <div class="frame">
          <div class="tick tl"></div>
          <div class="tick tr"></div>
          <div class="tick bl"></div>
          <div class="tick br"></div>
        </div>

        <div class="center">
          <div id="eyebrow" class="eyebrow">USD · Global Exposure</div>

          <div class="number-stack">
            <div id="amount" class="amount steel" data-layout-allow-occlusion>$0.0T</div>
            <div id="amountGlow" class="amount emissive" aria-hidden="true" data-layout-allow-occlusion>$8.8T</div>
            <div id="spec" class="spec"></div>
          </div>

          <div id="wordmark" class="wordmark">
            <span class="rule"></span>
            <span class="label">Trillion</span>
            <span class="rule right"></span>
          </div>

          <div id="readout" class="readout">$0</div>
        </div>

        <div id="alertTag" class="alert-tag">
          <span class="dot"></span>
          <span>Alert · Threshold Breached</span>
        </div>

        <div id="flash" class="flash"></div>

        <div class="vignette"></div>
      </section>

      <audio
        id="sting"
        data-start="0"
        data-duration="6"
        data-track-index="2"
        src="assets/sting.wav"
        data-volume="0.9"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const amountEl = document.querySelector("#amount");
      const glowEl = document.querySelector("#amountGlow");
      const readoutEl = document.querySelector("#readout");

      const TARGET_T = 8.8;

      function renderCount(trillions) {
        const bounded = Math.max(0, Math.min(TARGET_T, trillions));
        const label = "$" + bounded.toFixed(1) + "T";
        amountEl.textContent = label;
        glowEl.textContent = label;
        readoutEl.textContent = "$" + Math.round(bounded * 1e12).toLocaleString("en-US");
      }

      renderCount(0);

      const count = { v: 0 };
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // ── initial state ────────────────────────────────────────────
      gsap.set("#keylight", { opacity: 0 });
      gsap.set("#amount", { opacity: 0, y: 22, scale: 0.97 });
      gsap.set(["#eyebrow", "#wordmark"], { opacity: 0 });
      gsap.set(".tick", { opacity: 0 });
      gsap.set("#amountGlow", { opacity: 0 });
      gsap.set(["#wash", "#hazard", "#scanline", "#alertTag", "#flash"], { opacity: 0 });

      // ── head: studio key powers on, machined-metal number keys in ─
      tl.to("#keylight", { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.1);
      tl.to("#amount", { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 0.2);
      tl.to("#eyebrow", { opacity: 1, duration: 0.5 }, 0.32);
      tl.to(".tick", { opacity: 1, duration: 0.5, stagger: 0.05 }, 0.35);

      // data beat: fast machined count-up 0 -> 8.8
      tl.to(
        count,
        {
          v: TARGET_T,
          duration: 1.15,
          ease: "power2.out",
          onUpdate: () => renderCount(count.v),
          onComplete: () => renderCount(TARGET_T),
        },
        0.3,
      );

      // one specular pass across the number
      tl.fromTo("#spec", { x: -320, opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.75);
      tl.to("#spec", { x: 320, duration: 0.7, ease: "power1.inOut" }, 0.75);
      tl.to("#spec", { opacity: 0, duration: 0.2 }, 1.3);

      // wordmark + settle micro-pop as the number locks
      tl.to("#wordmark", { opacity: 1, duration: 0.5 }, 1.35);
      tl.to("#amount", { scale: 1.03, duration: 0.12, ease: "back.out(2.2)" }, 1.5);
      tl.to("#amount", { scale: 1, duration: 0.28, ease: "power2.out" }, 1.62);

      // ═══ 2.05s — THE ALERT WASH ═════════════════════════════════
      const HIT = 2.05;

      // red floods in from the right, fast, then eases to a held tint
      tl.fromTo(
        "#wash",
        { opacity: 0, xPercent: 14 },
        { opacity: 1, xPercent: 0, duration: 0.14, ease: "power1.out" },
        HIT,
      );
      tl.to("#wash", { opacity: 0.62, duration: 0.5, ease: "power2.out" }, HIT + 0.14);

      // pre-alert label yields to the ALERT tag
      tl.to("#eyebrow", { opacity: 0, duration: 0.2, ease: "power1.out" }, HIT);

      // the metal ignites red (emissive) + gains a red glow
      tl.to("#amountGlow", { opacity: 1, duration: 0.14, ease: "power1.out" }, HIT);
      tl.fromTo(
        "#amount",
        { filter: "drop-shadow(0 12px 30px rgba(0,0,0,0.6))" },
        {
          filter: "drop-shadow(0 0 34px rgba(255,36,54,0.7)) drop-shadow(0 12px 30px rgba(0,0,0,0.55))",
          duration: 0.2,
          ease: "power2.out",
        },
        HIT,
      );

      // hazard stripes light up + slow drift
      tl.to("#hazard", { opacity: 1, duration: 0.16 }, HIT);
      tl.fromTo("#hazard", { backgroundPositionX: "0px" }, { backgroundPositionX: "184px", duration: 2.5, ease: "none" }, HIT);

      // white-hot impact flash
      tl.to("#flash", { opacity: 1, duration: 0.06, ease: "none" }, HIT);
      tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, HIT + 0.06);

      // impact shake on the whole stage
      tl.to("#stage", { x: -10, duration: 0.05, ease: "none" }, HIT);
      tl.to("#stage", { x: 8, duration: 0.05, ease: "none" }, HIT + 0.05);
      tl.to("#stage", { x: -4, duration: 0.05, ease: "none" }, HIT + 0.1);
      tl.to("#stage", { x: 0, duration: 0.08, ease: "power2.out" }, HIT + 0.15);

      // ALERT tag snaps on
      tl.fromTo(
        "#alertTag",
        { opacity: 0, scale: 1.3, y: -8 },
        { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "back.out(2.6)" },
        HIT + 0.04,
      );
      // two blinks
      tl.to("#alertTag", { opacity: 0.35, duration: 0.18, ease: "power1.inOut", overwrite: "auto" }, HIT + 0.7);
      tl.to("#alertTag", { opacity: 1, duration: 0.18, ease: "power1.inOut", overwrite: "auto" }, HIT + 0.9);
      tl.to("#alertTag", { opacity: 0.35, duration: 0.18, ease: "power1.inOut", overwrite: "auto" }, HIT + 1.2);
      tl.to("#alertTag", { opacity: 1, duration: 0.18, ease: "power1.inOut", overwrite: "auto" }, HIT + 1.4);

      // the exposure readout goes lit-red under the alert (seek-safe: color only)
      tl.to("#readout", { color: "#ff7d88", duration: 0.2 }, HIT + 0.02);

      // emissive "breathing" — finite pulses across the sustained window
      tl.to(
        "#amountGlow",
        { opacity: 0.55, duration: 0.42, ease: "sine.inOut", repeat: 4, yoyo: true },
        HIT + 0.3,
      );

      // scanline sweeps top -> bottom, twice (transform y — sub-pixel smooth)
      tl.fromTo(
        "#scanline",
        { opacity: 0, y: 0 },
        { opacity: 0.9, duration: 0.1 },
        HIT + 0.1,
      );
      tl.to("#scanline", { y: 1080, duration: 1.1, ease: "power1.in" }, HIT + 0.1);
      tl.set("#scanline", { y: 0 }, HIT + 1.25);
      tl.to("#scanline", { y: 1080, duration: 1.1, ease: "power1.in" }, HIT + 1.3);
      tl.to("#scanline", { opacity: 0, duration: 0.3 }, HIT + 2.2);

      // ── lock: wash calms to a steady lit-red hold ────────────────
      tl.to("#wash", { opacity: 0.44, duration: 0.7, ease: "power2.inOut" }, 4.7);
      tl.to("#hazard", { opacity: 0.6, duration: 0.7, ease: "power2.inOut" }, 4.7);
      tl.to("#amountGlow", { opacity: 0.85, duration: 0.6, ease: "power2.out" }, 4.7);
      tl.to("#alertTag", { opacity: 1, duration: 0.3 }, 4.7);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
