<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <title>Path 2 — Night Dunes Parallax</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0a0a0c; /* spec: ground #0A0A0C */
        --sky-top: #040406;
        --sky-mid: #06070a;
        --sky-low: #0a0a0c;
        --rim: 210, 228, 248; /* cool dawn rim light */
        --glow: 150, 178, 210; /* cool horizon glow */
      }

      html,
      body {
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      }

      /* Full-frame plate. Never warped: transform + overlay only. */
      #stage {
        position: relative;
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-mid) 46%,
          #08090c 70%,
          var(--sky-low) 82%,
          var(--ground) 100%
        );
      }

      /*
        Three depth planes, each oversized to 112% width with a -6% left
        inset (≈230px bleed per side). Max parallax shift is -5.5% (211px),
        so the outer 10% margin absorbs all motion and the inner 90% safe
        area is never revealed. Planes translateX only — the base plate is
        never scaled or warped.
      */
      .plane {
        position: absolute;
        top: 0;
        left: -6%;
        width: 112%;
        height: 100%;
        will-change: transform;
      }

      #far {
        z-index: 1;
      }
      #mid {
        z-index: 2;
      }
      #fg {
        z-index: 3;
      }

      .plane svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Heat-haze shimmer band sitting over the far horizon / glow. Only its
         opacity animates (0→0.10→0), so it stays seek-safe and deterministic. */
      #haze {
        position: absolute;
        left: -6%;
        width: 112%;
        top: 1560px;
        height: 320px;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: blur(6px);
        background:
          repeating-linear-gradient(
            90deg,
            rgba(200, 222, 246, 0) 0px,
            rgba(200, 222, 246, 0.14) 34px,
            rgba(200, 222, 246, 0) 74px
          ),
          radial-gradient(
            120% 100% at 46% 62%,
            rgba(190, 214, 240, 0.5) 0%,
            rgba(190, 214, 240, 0.16) 40%,
            rgba(190, 214, 240, 0) 72%
          );
        -webkit-mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 1) 42%,
          rgba(0, 0, 0, 1) 64%,
          rgba(0, 0, 0, 0) 100%
        );
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 1) 42%,
          rgba(0, 0, 0, 1) 64%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* ---- GRADE PASS (static overlays, top of the stack) ---- */

      /* cool dawn tint, temp -6 */
      #tint {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: soft-light;
        background: linear-gradient(
          180deg,
          rgba(96, 132, 176, 0.16) 0%,
          rgba(104, 138, 178, 0.1) 60%,
          rgba(120, 150, 186, 0.06) 100%
        );
      }

      /* vignette 0.55 */
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background: radial-gradient(
          82% 78% at 50% 52%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.28) 74%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }

      /* 8% grain (static, seeded feTurbulence overlay) */
      #grain {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        opacity: 0.08;
        mix-blend-mode: overlay;
      }
      #grain svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-fps="24"
      data-width="3840"
      data-height="2160"
    >
      <section id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <!-- FAR HORIZON: cool glow, faint stars, distant atmospheric ridge -->
        <div id="far" class="plane" data-layout-allow-overflow>
          <svg viewBox="0 0 4301 2160" preserveAspectRatio="none" data-layout-allow-overflow>
            <defs>
              <radialGradient id="horizonGlow" cx="46%" cy="80%" r="62%">
                <stop offset="0%" stop-color="rgba(174,200,230,0.55)" />
                <stop offset="34%" stop-color="rgba(150,178,210,0.22)" />
                <stop offset="70%" stop-color="rgba(120,150,190,0.05)" />
                <stop offset="100%" stop-color="rgba(120,150,190,0)" />
              </radialGradient>
              <linearGradient id="farRim" x1="0" y1="0" x2="4301" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(150,180,212,0)" />
                <stop offset="0.32" stop-color="rgba(160,190,220,0.18)" />
                <stop offset="0.46" stop-color="rgba(186,210,238,0.42)" />
                <stop offset="0.58" stop-color="rgba(170,198,228,0.3)" />
                <stop offset="0.74" stop-color="rgba(150,180,212,0.12)" />
                <stop offset="1" stop-color="rgba(150,180,212,0)" />
              </linearGradient>
              <filter id="softBlurFar" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="7" />
              </filter>
            </defs>

            <!-- pre-dawn glow low on the horizon -->
            <ellipse cx="1980" cy="1720" rx="1980" ry="440" fill="url(#horizonGlow)" />

            <!-- faint stars (seeded, deterministic — filled at load) -->
            <g id="stars" fill="rgba(210,222,240,1)"></g>

            <!-- distant ridge: low contrast, near the horizon line -->
            <path
              d="M 0 1790 C 360 1762, 760 1740, 1180 1752 S 1980 1706, 2420 1724 S 3220 1712, 3680 1738 S 4180 1758, 4301 1768 L 4301 2160 L 0 2160 Z"
              fill="#07080b"
            />
            <path
              d="M 0 1790 C 360 1762, 760 1740, 1180 1752 S 1980 1706, 2420 1724 S 3220 1712, 3680 1738 S 4180 1758, 4301 1768"
              fill="none"
              stroke="url(#farRim)"
              stroke-width="3"
              filter="url(#softBlurFar)"
            />
          </svg>
        </div>

        <!-- MID LINE: hero dune ridge with bright cool rim light on the crest -->
        <div id="mid" class="plane" data-layout-allow-overflow>
          <svg viewBox="0 0 4301 2160" preserveAspectRatio="none" data-layout-allow-overflow>
            <defs>
              <linearGradient id="midRim" x1="0" y1="0" x2="4301" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(210,228,248,0)" />
                <stop offset="0.26" stop-color="rgba(210,228,248,0.22)" />
                <stop offset="0.42" stop-color="rgba(226,240,255,0.92)" />
                <stop offset="0.52" stop-color="rgba(214,232,252,0.78)" />
                <stop offset="0.66" stop-color="rgba(196,218,244,0.34)" />
                <stop offset="0.84" stop-color="rgba(184,208,236,0.12)" />
                <stop offset="1" stop-color="rgba(184,208,236,0)" />
              </linearGradient>
              <linearGradient id="midBody" x1="0" y1="1660" x2="0" y2="2160" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#0c0d11" />
                <stop offset="55%" stop-color="#08090c" />
                <stop offset="100%" stop-color="#050506" />
              </linearGradient>
              <filter id="rimGlow" x="-20%" y="-40%" width="140%" height="180%">
                <feGaussianBlur stdDeviation="4" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- dune body -->
            <path
              d="M 0 1834 C 320 1808, 700 1748, 1120 1772 S 1560 1704, 1900 1690
                 S 2360 1712, 2720 1700 S 3200 1742, 3560 1720 S 4020 1758, 4301 1790
                 L 4301 2160 L 0 2160 Z"
              fill="url(#midBody)"
            />
            <!-- crest rim light -->
            <path
              d="M 0 1834 C 320 1808, 700 1748, 1120 1772 S 1560 1704, 1900 1690
                 S 2360 1712, 2720 1700 S 3200 1742, 3560 1720 S 4020 1758, 4301 1790"
              fill="none"
              stroke="url(#midRim)"
              stroke-width="4.5"
              stroke-linecap="round"
              filter="url(#rimGlow)"
            />
          </svg>
        </div>

        <!-- FG SAND: dark near ridge and foreground plain, deepest shadow -->
        <div id="fg" class="plane" data-layout-allow-overflow>
          <svg viewBox="0 0 4301 2160" preserveAspectRatio="none" data-layout-allow-overflow>
            <defs>
              <linearGradient id="fgRim" x1="0" y1="0" x2="4301" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(150,176,206,0)" />
                <stop offset="0.34" stop-color="rgba(160,186,214,0.16)" />
                <stop offset="0.5" stop-color="rgba(176,200,226,0.34)" />
                <stop offset="0.68" stop-color="rgba(158,184,214,0.14)" />
                <stop offset="1" stop-color="rgba(150,176,206,0)" />
              </linearGradient>
              <linearGradient id="fgBody" x1="0" y1="1880" x2="0" y2="2160" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#08080a" />
                <stop offset="100%" stop-color="#050506" />
              </linearGradient>
            </defs>

            <path
              d="M 0 1916 C 420 1892, 900 1936, 1420 1904 S 2160 1868, 2700 1902
                 S 3520 1936, 4301 1910 L 4301 2160 L 0 2160 Z"
              fill="url(#fgBody)"
            />
            <path
              d="M 0 1916 C 420 1892, 900 1936, 1420 1904 S 2160 1868, 2700 1902
                 S 3520 1936, 4301 1910"
              fill="none"
              stroke="url(#fgRim)"
              stroke-width="3"
            />
          </svg>
        </div>

        <!-- heat-haze shimmer over far_horizon -->
        <div id="haze" data-layout-allow-overflow></div>

        <!-- grade pass -->
        <div id="tint"></div>
        <div id="vignette"></div>
        <div id="grain">
          <svg xmlns="http://www.w3.org/2000/svg">
            <filter id="grainFilter">
              <feTurbulence
                type="fractalNoise"
                baseFrequency="0.9"
                numOctaves="2"
                stitchTiles="stitch"
                seed="7"
              />
              <feColorMatrix type="saturate" values="0" />
            </filter>
            <rect width="100%" height="100%" filter="url(#grainFilter)" />
          </svg>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Deterministic star field (no Math.random / Date.now). Seeded mulberry32
      // so every render produces the identical scatter.
      (function seedStars() {
        let s = 0x9e3779b9;
        const rnd = () => {
          s |= 0;
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const g = document.getElementById("stars");
        const ns = "http://www.w3.org/2000/svg";
        for (let i = 0; i < 90; i++) {
          const x = rnd() * 4301;
          const y = rnd() * 1500; // keep stars in the upper sky only
          const r = 0.8 + rnd() * 1.8;
          const o = 0.1 + rnd() * 0.45;
          const c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", x.toFixed(1));
          c.setAttribute("cy", y.toFixed(1));
          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("opacity", o.toFixed(3));
          g.appendChild(c);
        }
      })();

      // Frame width drives all parallax percentages.
      const W = 3840;

      // "no default easing" — nothing falls back to GSAP's power1.out.
      const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });

      gsap.set(["#far", "#mid", "#fg"], { x: 0 });
      gsap.set("#haze", { opacity: 0 });

      // Depth parallax (the awe lever): differential translateX over 0–6000ms,
      // sine.inOut. Foreground pulls hardest, far horizon barely drifts.
      // fg_sand -5.5% / mid_line -4.0% / far_horizon -1.2% of frame width.
      // sine.inOut lands with zero velocity, so the frame settles to static
      // by the tail (well before frame 136).
      tl.to("#fg", { x: -0.055 * W, duration: 6, ease: "sine.inOut" }, 0);
      tl.to("#mid", { x: -0.04 * W, duration: 6, ease: "sine.inOut" }, 0);
      tl.to("#far", { x: -0.012 * W, duration: 6, ease: "sine.inOut" }, 0);

      // Heat-haze shimmer over far_horizon: 1000–5000ms, opacity 0→0.10→0.
      tl.to("#haze", { opacity: 0.1, duration: 2, ease: "sine.inOut" }, 1);
      tl.to("#haze", { opacity: 0, duration: 2, ease: "sine.inOut" }, 3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
