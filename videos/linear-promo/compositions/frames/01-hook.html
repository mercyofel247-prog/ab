<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .clip {
      position: absolute;
    }

    .hook-bg {
      inset: 0;
      background:
        radial-gradient(ellipse 62% 50% at 38% 34%, rgba(94, 106, 210, 0.08), rgba(94, 106, 210, 0) 60%),
        #08090a;
    }

    /* Outer = GSAP-controlled layer (scale / opacity / x / y only — never a CSS transform here). */
    .hook-card-outer {
      display: flex;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* Inner = static, CSS-only tilt + visual treatment. GSAP never touches this element. */
    .hook-card-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 14px;
      background: rgba(94, 106, 210, 0.08);
      border: 1.5px solid rgba(94, 106, 210, 0.28);
      box-shadow: none;
      color: #f7f8f8;
      font-weight: 600;
      line-height: 1.25;
      padding: 20px;
    }

    .hook-card-center > .hook-card-inner {
      background: rgba(94, 106, 210, 0.16);
      border: 2px solid rgba(94, 106, 210, 0.46);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .hook-card-sticky > .hook-card-inner,
    .hook-card-spreadsheet > .hook-card-inner,
    .hook-card-toolA > .hook-card-inner,
    .hook-card-toolB > .hook-card-inner {
      font-size: 24px;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
    <!-- full-bleed ground: dark canvas, otherwise empty (Scene 1) -->
    <div class="clip hook-bg" data-start="0" data-duration="9.744" data-track-index="0"></div>

    <!-- Scene 1 (0.0-2.0s): sticky notes, top-left -->
    <div
      id="hook-sticky"
      class="clip hook-card-outer hook-card-sticky"
      data-start="0"
      data-duration="9.744"
      data-track-index="1"
      style="left: 180px; top: 140px; width: 360px; height: 160px;"
    >
      <div class="hook-card-inner" style="transform: rotate(-6deg);">STICKY NOTES</div>
    </div>

    <!-- Scene 2 (2.0-4.2s): spreadsheet, top-right, mirrored -->
    <div
      id="hook-spreadsheet"
      class="clip hook-card-outer hook-card-spreadsheet"
      data-start="2.0"
      data-duration="7.744"
      data-track-index="1"
      style="left: 1420px; top: 120px; width: 340px; height: 170px;"
    >
      <div class="hook-card-inner" style="transform: rotate(4deg);">SPREADSHEET</div>
    </div>

    <!-- Scene 3 (4.2-7.0s): tool A / tool B, lower corners, staggered -->
    <div
      id="hook-toolA"
      class="clip hook-card-outer hook-card-toolA"
      data-start="4.2"
      data-duration="5.544"
      data-track-index="1"
      style="left: 260px; top: 600px; width: 320px; height: 150px;"
    >
      <div class="hook-card-inner" style="transform: rotate(3deg);">TOOL A — TICKETS</div>
    </div>

    <div
      id="hook-toolB"
      class="clip hook-card-outer hook-card-toolB"
      data-start="4.35"
      data-duration="5.394"
      data-track-index="1"
      style="left: 1360px; top: 580px; width: 340px; height: 160px;"
    >
      <div class="hook-card-inner" style="transform: rotate(-4deg);">TOOL B — DOCS</div>
    </div>

    <!-- Scene 4 (7.0-9.744s): the pain-card lands centered; the four markers drift inward -->
    <div
      id="hook-center"
      class="clip hook-card-outer hook-card-center"
      data-start="7.0"
      data-duration="2.744"
      data-track-index="2"
      style="left: 720px; top: 320px; width: 480px; height: 220px;"
    >
      <div class="hook-card-inner" style="transform: rotate(-2deg);">SIX TOOLS<br />THAT DON'T TALK</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["01-hook"] = tl;

    const TOTAL = 9.744;

    const sticky = document.getElementById("hook-sticky");
    const spreadsheet = document.getElementById("hook-spreadsheet");
    const toolA = document.getElementById("hook-toolA");
    const toolB = document.getElementById("hook-toolB");
    const center = document.getElementById("hook-center");

    // Radial-close-in accumulators (Scene 4): each corner marker's inward drift
    // is tweened here and read live by that marker's float loop below, so a
    // single writer (the float loop's onUpdate) ever touches the element's
    // GSAP-managed x/y — never two competing writers on the same transform.
    const driftSticky = { x: 0, y: 0 };
    const driftSpreadsheet = { x: 0, y: 0 };
    const driftToolA = { x: 0, y: 0 };
    const driftToolB = { x: 0, y: 0 };

    // Low-amplitude idle float (sine-wave-loop, onUpdate/phase form) composed
    // with a live drift target. `sign` mirrors the phase across pairs of
    // markers so opposite corners never breathe in lockstep.
    function floatLoop(el, drift, startAt, dur, period, amp, sign) {
      if (dur <= 0) return;
      const cycles = dur / period;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * cycles,
          duration: dur,
          ease: "none",
          onUpdate: () => {
            const t = phase.p / (Math.PI * 2 * cycles);
            const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
            const s = Math.sin(phase.p) * sign * env;
            gsap.set(el, { x: drift.x, y: s * amp + drift.y });
          },
        },
        startAt,
      );
    }

    // Scene 1 (0.0-2.0s): "Sticky notes on the monitor" — sticky-note card
    // settles top-left, rule-of-thirds, background otherwise empty.
    tl.fromTo(
      sticky,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.1,
    );
    floatLoop(sticky, driftSticky, 0.75, TOTAL - 0.75, 3.0, 2.0, 1);

    // Scene 2 (2.0-4.2s): "a spreadsheet nobody fully trusts" — spreadsheet
    // card settles top-right, mirrored float, now asymmetric two-up.
    tl.fromTo(
      spreadsheet,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.1,
    );
    floatLoop(spreadsheet, driftSpreadsheet, 2.75, TOTAL - 2.75, 3.3, 1.8, -1);

    // Scene 3 (4.2-7.0s): "six different tools" — tool A / tool B settle into
    // the lower corners, staggered, four density markers now ring the center.
    tl.fromTo(
      toolA,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      4.2,
    );
    floatLoop(toolA, driftToolA, 4.75, TOTAL - 4.75, 2.6, 1.6, 1);

    tl.fromTo(
      toolB,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      4.35,
    );
    floatLoop(toolB, driftToolB, 4.9, TOTAL - 4.9, 2.9, 1.7, -1);

    // Scene 4 (7.0-9.744s): "none of them talk to each other" — the pain-card
    // lands center, and the four markers drift inward slightly (radial
    // close-in, camera static — the crowd surrounds, it never zooms). Hold
    // the crowded state through the padded tail into the cut.
    tl.fromTo(
      center,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" },
      7.0,
    );

    tl.to(driftSticky, { x: 30, y: 16, duration: 1.4, ease: "power2.out" }, 7.0);
    tl.to(driftSpreadsheet, { x: -30, y: 17, duration: 1.4, ease: "power2.out" }, 7.0);
    tl.to(driftToolA, { x: 27, y: -7, duration: 1.4, ease: "power2.out" }, 7.0);
    tl.to(driftToolB, { x: -29, y: -6, duration: 1.4, ease: "power2.out" }, 7.05);
  </script>
</template>
