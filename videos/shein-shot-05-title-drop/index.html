<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SHEIN — Shot 05 Title Drop</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0b0b0c;
        --type: #ede8dd;
        --ox: #7a160e;
        --ox-hot: #c9401f;
        --ox-deep: #3d0a07;
        --graphite: #3a3a3e;
        --graphite-lo: #232326;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: "Oswald", sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      /* z4 — graphite depth panel behind the hero */
      #panel {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 460px;
        transform: translate(calc(-50% + 34px), calc(-50% - 14px));
        background: linear-gradient(155deg, var(--graphite) 0%, var(--graphite-lo) 100%);
        opacity: 0.55;
        filter: blur(0.5px);
        pointer-events: none;
      }

      /* z2 — oxblood under-glow (hot + cool crossfade layers) */
      .glow {
        position: absolute;
        left: 50%;
        bottom: 300px;
        width: 1780px;
        height: 620px;
        transform: translateX(-50%);
        border-radius: 50%;
        pointer-events: none;
        clip-path: inset(0% 0% 0% 0%);
      }
      #glowHot {
        background: radial-gradient(48% 55% at 50% 100%, rgba(201, 64, 31, 0.85) 0%, rgba(201, 64, 31, 0.34) 45%, rgba(201, 64, 31, 0) 74%);
        filter: blur(18px);
        opacity: 0;
      }
      #glowCool {
        background: radial-gradient(48% 55% at 50% 100%, rgba(122, 22, 14, 0.8) 0%, rgba(122, 22, 14, 0.3) 46%, rgba(122, 22, 14, 0) 74%);
        filter: blur(20px);
        opacity: 0;
        box-shadow: 0 0 220px 90px rgba(122, 22, 14, 0.16);
      }

      /* z3 — contact shadow */
      #contactShadow {
        position: absolute;
        left: 50%;
        bottom: 268px;
        width: 1420px;
        height: 90px;
        transform: translateX(-50%);
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 72%);
        opacity: 0;
        pointer-events: none;
      }

      /* z3 — dust motes */
      #dust {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mote {
        position: absolute;
        left: 50%;
        bottom: 330px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(237, 232, 221, 0.9) 0%, rgba(237, 232, 221, 0) 72%);
        opacity: 0;
        pointer-events: none;
      }

      /* z1 — hero */
      #heroFit {
        position: absolute;
        left: 50%;
        top: 556px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      #heroWrap {
        position: relative;
      }
      #shein {
        position: relative;
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        font-size: 780px;
        line-height: 0.86;
        letter-spacing: -0.006em;
        color: transparent;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 10%),
          repeating-linear-gradient(112deg, #626268 0px, #5a5a60 2px, #37373b 3px, #6a6a70 4.4px, #414146 6px);
        -webkit-background-clip: text;
        background-clip: text;
        white-space: nowrap;
        /* edge chromatic aberration (static, decorative — no animation) */
        filter:
          drop-shadow(1.4px 0 rgba(201, 64, 31, 0.32))
          drop-shadow(-1.4px 0 rgba(90, 190, 200, 0.24));
      }

      /* specular sweep, clipped to the hero's box */
      #specularClip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #specular {
        position: absolute;
        top: -10%;
        left: -30%;
        width: 46%;
        height: 120%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0) 100%);
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* z0 — top line */
      #topLine {
        position: absolute;
        left: 50%;
        top: 232px;
        transform: translate(-50%, -50%);
        color: var(--type);
        font-family: "Oswald", sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.14em;
        opacity: 0;
        white-space: nowrap;
      }

      /* z5 — grain + vignette front */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(64% 64% at 50% 50%, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, 0.62) 100%);
        opacity: 0.18;
        pointer-events: none;
      }
      #grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 6px 6px;
        opacity: 0.4;
        pointer-events: none;
      }

      #breathe {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.4"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div id="breathe" data-layout-allow-overflow>
          <div id="panel"></div>

          <div id="glowHot" class="glow"></div>
          <div id="glowCool" class="glow"></div>

          <div id="contactShadow"></div>
          <div id="dust"></div>

          <div id="heroFit">
            <div id="heroWrap">
              <div id="shein" data-layout-allow-overflow>SHEIN</div>
              <div id="specularClip"><div id="specular" data-layout-allow-overflow></div></div>
            </div>
          </div>

          <div id="topLine">THE MOST EXPENSIVE CHEAP CLOTHES ON EARTH</div>
        </div>

        <div id="vignette"></div>
        <div id="grain"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // ---- deterministic mulberry32 PRNG (no Math.random / Date.now) ----
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(1337);

      // ---- extruded-metal depth: static text-shadow stack (graphite -> oxblood rim) ----
      function buildExtrusion() {
        const steps = 22;
        const layers = [];
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          let color;
          if (i <= steps - 3) {
            // graphite mid -> near-black
            const a = i / (steps - 3);
            const r = Math.round(74 + (15 - 74) * a);
            const g = Math.round(74 + (15 - 74) * a);
            const b = Math.round(78 + (16 - 78) * a);
            color = `rgb(${r},${g},${b})`;
          } else {
            // final layers: oxblood rim
            const a = (i - (steps - 3)) / 3;
            const r = Math.round(61 + (122 - 61) * a);
            const g = Math.round(10 + (22 - 10) * a);
            const b = Math.round(8 + (14 - 8) * a);
            color = `rgb(${r},${g},${b})`;
          }
          const dx = (i * 0.85).toFixed(2);
          const dy = (i * 1.05).toFixed(2);
          layers.push(`${dx}px ${dy}px 0 ${color}`);
        }
        // subtle top-left highlight edge
        layers.push(`-1.4px -1.4px 0 rgba(255,255,255,0.28)`);
        document.querySelector("#shein").style.textShadow = layers.join(", ");
      }
      buildExtrusion();

      // ---- SIZE LOCK: fit "SHEIN" to 84% of frame width, centered, inner 90% safe ----
      (function fitHero() {
        const TARGET_W = 1920 * 0.84;
        const el = document.querySelector("#shein");
        const measured = el.getBoundingClientRect().width;
        const scale = TARGET_W / measured;
        document.querySelector("#heroFit").style.transform = `translate(-50%, -50%) scale(${scale})`;
      })();

      // ---- dust motes: deterministic seeded burst positions ----
      const MOTE_COUNT = 14;
      const dustEl = document.querySelector("#dust");
      const motes = [];
      for (let i = 0; i < MOTE_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "mote";
        const size = 5 + rand() * 9;
        el.style.width = size + "px";
        el.style.height = size + "px";
        dustEl.appendChild(el);
        const angle = rand() * Math.PI - Math.PI / 2 - Math.PI / 2; // upward-biased spread
        const dist = 160 + rand() * 520;
        motes.push({
          el,
          x: Math.cos(angle) * dist,
          y: -Math.abs(Math.sin(angle) * dist) - 40,
          drift: (rand() - 0.5) * 60,
          delay: rand() * 0.08,
        });
      }

      const tl = gsap.timeline({ paused: true });

      // ===== initial state (registered on the timeline so the runtime's =====
      // ===== deterministic frame-seek can replay it from any target time) =====
      tl.set("#breathe", { scale: 1 }, 0);
      tl.set("#topLine", { opacity: 0.4 }, 0);
      tl.set(["#glowHot", "#glowCool"], { clipPath: "inset(100% 0% 0% 0%)" }, 0);
      tl.set("#contactShadow", { opacity: 0 }, 0);
      tl.set("#specular", { xPercent: -120, skewX: -18, opacity: 0 }, 0);
      tl.set("#vignette", { opacity: 0.18 }, 0);
      tl.set("#grain", { opacity: 0.4 }, 0);
      motes.forEach((m) => tl.set(m.el, { x: 0, y: 0, opacity: 0, scale: 0.5 }, 0));

      const T_VACUUM_END = 0.5; // f12
      const T_SLAM_END = 0.65; // f16
      const T_SETTLE_END = 1.4; // f34
      const T_SUSTAIN_END = 3.15; // f76
      const T_END = 3.4; // f82

      // ===== 0-500ms: SILENT VACUUM =====
      tl.to("#breathe", { scale: 1.008, duration: T_VACUUM_END, ease: "sine.inOut" }, 0);

      // ===== 500-650ms: HEAVY SLAM (sync frame 12 @ 0.5s) =====
      // impose: slam down from y:-40 to 0, with impact scale overshoot 1.12 -> 1.00
      // (fromTo renders its "from" state immediately on creation, guaranteeing the
      // parked pre-slam pose survives direct/parallel-worker frame-seeking)
      tl.fromTo(
        "#heroWrap",
        { y: -160, scale: 1.35, transformOrigin: "50% 50%" },
        { y: 0, scale: 1.0, duration: 0.18, ease: "back.out(2.6)" },
        T_VACUUM_END,
      );

      // oxblood under-glow ignition (hot layer flares, cool layer arrives)
      tl.to(["#glowHot", "#glowCool"], { clipPath: "inset(0% 0% 0% 0%)", duration: 0.001 }, T_VACUUM_END);
      tl.to("#glowHot", { opacity: 1, duration: 0.15, ease: "expo.out" }, T_VACUUM_END);
      tl.to("#glowCool", { opacity: 0.9, duration: 0.15, ease: "expo.out" }, T_VACUUM_END);

      // contact shadow snap-in
      tl.to("#contactShadow", { opacity: 0.85, duration: 0.06, ease: "power1.out" }, T_VACUUM_END);

      // dust-puff burst
      motes.forEach((m) => {
        tl.to(
          m.el,
          { opacity: 1, scale: 1, duration: 0.05, ease: "power1.out" },
          T_VACUUM_END + m.delay,
        );
        tl.to(
          m.el,
          { x: m.x, y: m.y, duration: 0.9 + m.delay, ease: "power2.out" },
          T_VACUUM_END + m.delay,
        );
        tl.to(
          m.el,
          { opacity: 0, duration: 0.5, ease: "power1.in" },
          T_VACUUM_END + 0.55,
        );
      });

      // vignette pulse + grain kick (reactive, not the focal event)
      tl.to("#vignette", { opacity: 0.3, duration: 0.08, ease: "power1.out" }, T_VACUUM_END);
      tl.to("#vignette", { opacity: 0.18, duration: 0.4, ease: "power2.out" }, T_VACUUM_END + 0.1);
      tl.to("#grain", { opacity: 0.62, duration: 0.06, ease: "power1.out" }, T_VACUUM_END);
      tl.to("#grain", { opacity: 0.4, duration: 0.35, ease: "power2.out" }, T_VACUUM_END + 0.08);

      // ===== 650-1400ms: SETTLE =====
      // under-glow cools: hot layer fades out, cool layer remains
      tl.to("#glowHot", { opacity: 0, duration: T_SETTLE_END - T_SLAM_END, ease: "sine.inOut" }, T_SLAM_END);
      // specular travels across the metal caps
      tl.set("#specular", { opacity: 1 }, T_SLAM_END);
      tl.to("#specular", { xPercent: 220, duration: T_SETTLE_END - T_SLAM_END, ease: "power2.out" }, T_SLAM_END);
      tl.to("#specular", { opacity: 0, duration: 0.15, ease: "power1.out" }, T_SETTLE_END - 0.15);

      // ===== 1400-3150ms: SUSTAINED =====
      const sustainDur = T_SUSTAIN_END - T_SETTLE_END;
      tl.to("#breathe", { scale: 1.05, duration: sustainDur, ease: "sine.inOut" }, T_SETTLE_END);
      tl.to(
        "#glowCool",
        { opacity: 0.855, duration: sustainDur / 4, ease: "sine.inOut", yoyo: true, repeat: 3 },
        T_SETTLE_END,
      );
      tl.to(
        "#grain",
        { opacity: 0.46, duration: sustainDur / 6, ease: "sine.inOut", yoyo: true, repeat: 5 },
        T_SETTLE_END,
      );
      // continuous dust drift, deterministic gentle sway
      motes.forEach((m, i) => {
        tl.to(
          m.el,
          {
            x: m.x + m.drift,
            duration: 1.2 + (i % 4) * 0.3,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
          },
          T_SETTLE_END + (i % 5) * 0.1,
        );
      });

      // ===== 3150-3400ms: EXIT — HOLD (no fade) =====
      // nothing animates; caps, oxblood glow, and grain hold live to the cut.

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
