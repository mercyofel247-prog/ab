<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DOF Rack Reveal — –$15,000,000,000</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Track-2 — oxblood theme */
      :root {
        --black: #070405;
        --ox-deep: #3a0a10;
        --ox-lo: #2a070c;
        --ox: #6e1420;
        --ox-hi: #b0323e;
        --ox-face-top: #d4535c;
        --ink: #9c2230;
        --line: #b0323e;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--black);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(120% 100% at 50% 50%, var(--ox-deep) 0%, var(--ox-lo) 32%, #160407 60%, var(--black) 100%);
      }

      /* faint ledger ruling — sells "on the page / on paper" */
      .rules {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(176, 50, 62, 0) 0px,
          rgba(176, 50, 62, 0) 71px,
          rgba(176, 50, 62, 0.05) 72px
        );
        pointer-events: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
        background-size: 72px 72px;
        opacity: 0.4;
        pointer-events: none;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(78% 72% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.74) 100%);
        pointer-events: none;
      }

      /* ---- the descending oxblood line ---- */
      /* Drawn downward with a transform (scaleY from the top origin) — the
         stroke-dashoffset "drawing" look done transform-safe, so the renderer
         captures every frame and no width/height is animated. */
      #line {
        position: absolute;
        left: 50%;
        top: 210px;
        width: 3px;
        height: 336px;
        margin-left: -1.5px;
        transform-origin: 50% 0%;
        border-radius: 2px;
        background: linear-gradient(
          to bottom,
          rgba(176, 50, 62, 0) 0%,
          var(--line) 14%,
          var(--ox-hi) 100%
        );
        box-shadow: 0 0 10px rgba(176, 50, 62, 0.5);
        will-change: transform, filter;
      }

      /* the drawing tip that rides the growing end of the line */
      #tip {
        position: absolute;
        left: 50%;
        top: 210px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        margin-top: -6px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #efc9cc 0%, var(--ox-hi) 45%, rgba(176, 50, 62, 0) 100%);
        box-shadow: 0 0 16px rgba(224, 120, 110, 0.8);
        will-change: transform, opacity;
      }

      /* landing node where the line meets the numeral */
      #node {
        position: absolute;
        left: 50%;
        top: 546px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        margin-top: -10px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #f6dcdf 0%, var(--ox-hi) 40%, rgba(176, 50, 62, 0) 72%);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ---- the numeral sitting at the low endpoint, on paper ---- */
      #numwrap {
        position: absolute;
        left: 50%;
        top: 606px;
        transform: translate(-50%, -50%);
        will-change: transform, filter;
      }

      #num {
        font-size: 118px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.008em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        /* oxblood printed-ink face — matte, reads as pressed onto the page */
        background: linear-gradient(
          178deg,
          var(--ox-face-top) 0%,
          var(--ox-hi) 26%,
          var(--ox) 54%,
          #56101a 74%,
          var(--ox) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        text-shadow:
          1px 1px 0 #4f111a,
          2px 2px 0 #3e0d15,
          3px 4px 10px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.5"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="rules"></div>
        <div class="grain"></div>

        <div id="node"></div>
        <div id="line"></div>
        <div id="tip"></div>

        <div id="numwrap" data-layout-allow-overflow>
          <div id="num" data-layout-allow-occlusion>–$15,000,000,000</div>
        </div>

        <div class="vignette"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // ---------- timing (seconds) ----------
      const LINE_LEN = 336; // px the tip travels as the line draws down
      const LINE_DUR = 1.0; // ~1s, named ease-in (power2.in) — the line "falls"
      const LAND_T = LINE_DUR; // focus-pull is synced to the landing

      // ---------- deterministic focus driver ----------
      const numEl = document.querySelector("#num");
      const lineEl = document.querySelector("#line");
      const foc = { b: 8 }; // numeral starts 8px out of focus
      const applyFoc = () => (numEl.style.filter = "blur(" + foc.b.toFixed(2) + "px)");
      applyFoc();
      const lfoc = { b: 0 }; // line is the sharp plane, softens as focus transfers
      const applyLineFoc = () => (lineEl.style.filter = "blur(" + lfoc.b.toFixed(2) + "px)");
      applyLineFoc();

      const tl = gsap.timeline({ paused: true });

      // ---------- initial state ----------
      gsap.set("#line", { scaleY: 0 });
      gsap.set("#tip", { y: 0, opacity: 0 });
      gsap.set("#node", { opacity: 0, scale: 0.4 });
      gsap.set("#numwrap", { scale: 1, transformOrigin: "50% 50%" });

      // ===================================================================
      // (1) THE LINE DRAWS DOWNWARD — scaleY 0→1 from the top on ease-in,
      //     with the drawing tip riding the growing end.
      // ===================================================================
      tl.to("#line", { scaleY: 1, duration: LINE_DUR, ease: "power2.in" }, 0);
      tl.to("#tip", { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
      tl.to("#tip", { y: LINE_LEN, duration: LINE_DUR, ease: "power2.in" }, 0);
      // tip arrives and hands off to the landing node
      tl.to("#tip", { opacity: 0, duration: 0.14, ease: "power1.out" }, LAND_T - 0.02);

      // ===================================================================
      // (2) LANDING — the line meets the numeral: node bloom marks contact.
      // ===================================================================
      tl.to("#node", { opacity: 1, scale: 1.15, duration: 0.1, ease: "power2.out" }, LAND_T);
      tl.to("#node", { opacity: 0, scale: 1.4, duration: 0.5, ease: "power2.out" }, LAND_T + 0.1);

      // ===================================================================
      // (3) DOF RACK RESOLVE — numeral racks to razor-sharp on power2.out,
      //     synced to the landing; the line softens as focus transfers to it.
      // ===================================================================
      tl.to(foc, { b: 0, duration: 0.45, ease: "power2.out", onUpdate: applyFoc }, LAND_T);
      tl.to(lfoc, { b: 2.4, duration: 0.4, ease: "power2.out", onUpdate: applyLineFoc }, LAND_T + 0.02);

      // ---------- 3% settle push on the resolve ----------
      tl.to("#numwrap", { scale: 1.03, duration: 0.12, ease: "power2.out" }, LAND_T);
      tl.to("#numwrap", { scale: 1.0, duration: 0.5, ease: "power2.out" }, LAND_T + 0.12);

      // hold on the sharp, discovered numeral to the end — nothing else moves.

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
