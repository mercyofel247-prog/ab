<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Empire — Cinematic Title Sequence</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Cinzel";
        src: url("assets/fonts/Cinzel-Variable.ttf") format("truetype-variations");
        font-weight: 400 900;
        font-style: normal;
      }

      :root {
        --near-black: #0a0a0c;
        --warm-black: #12100c;
        --gold-hi: #f5dfa0;
        --gold: #d4af37;
        --gold-deep: #8b6914;
        --gold-soft: #b8934a;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--near-black);
      }

      body {
        font-family: "Cinzel", serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--near-black);
      }

      /* dark, moody backdrop — fades in from black at the open, then drifts
         in a slow, near-imperceptible parallax push through the whole shot */
      #bg {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        background: radial-gradient(120% 90% at 50% 38%, var(--warm-black) 0%, #0d0b09 45%, var(--near-black) 100%);
      }

      /* floating embers/dust — cheap parallax depth cue drifting upward
         through the negative space, independent of the title's own motion */
      #particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        background: radial-gradient(circle, rgba(245, 223, 160, 0.95) 0%, rgba(212, 175, 55, 0.55) 45%, rgba(212, 175, 55, 0) 75%);
        will-change: transform, opacity;
      }

      /* light leaks — warm streaks entering from the frame edges, screen-blended */
      .leak {
        position: absolute;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #leak1 {
        left: -320px;
        top: -260px;
        width: 1500px;
        height: 820px;
        transform: rotate(-22deg);
        background: radial-gradient(
          ellipse 50% 50% at 30% 40%,
          rgba(255, 205, 130, 0.95) 0%,
          rgba(255, 170, 90, 0.5) 35%,
          rgba(255, 170, 90, 0) 68%
        );
      }
      #leak2 {
        right: -280px;
        bottom: -300px;
        width: 1300px;
        height: 760px;
        transform: rotate(16deg);
        background: radial-gradient(
          ellipse 50% 50% at 65% 55%,
          rgba(255, 140, 80, 0.9) 0%,
          rgba(212, 120, 60, 0.4) 38%,
          rgba(212, 120, 60, 0) 70%
        );
      }

      #grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
        background-size: 68px 68px;
        opacity: 0.5;
        pointer-events: none;
      }

      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(72% 68% at 50% 48%, rgba(0, 0, 0, 0) 34%, rgba(0, 0, 0, 0.82) 100%);
        pointer-events: none;
      }

      #scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #titleWrap {
        position: relative;
        display: grid;
        place-items: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity, filter;
      }

      /* shared type settings for the gold face AND its shimmer overlay, so
         the shine sweep hugs the exact same glyph shapes */
      .hero-type {
        grid-area: 1 / 1;
        font-family: "Cinzel", serif;
        font-weight: 800;
        font-size: 168px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        text-align: center;
        padding-right: 0.14em; /* compensate trailing letter-spacing so centering reads true */
      }

      #title {
        background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 45%, var(--gold-deep) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(1px 1px 0 #8b6914) drop-shadow(2px 2px 0 #6b4f10) drop-shadow(3px 4px 10px rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 22px rgba(212, 175, 55, 0.4)) drop-shadow(0 0 48px rgba(212, 175, 55, 0.2));
      }

      /* a single bright band that sweeps once across the letterforms once
         the title has settled — a "catching the light" polish beat, real
         text underneath the whole time, never an image */
      #shine {
        z-index: 2;
        background: linear-gradient(100deg, transparent 42%, rgba(255, 255, 255, 0.95) 50%, transparent 58%);
        background-size: 320% 100%;
        background-position: -160% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      #rule {
        margin-top: 34px;
        width: 340px;
        height: 3px;
        transform-origin: 50% 50%;
        background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-hi) 50%, var(--gold) 80%, transparent);
      }

      #tagline {
        margin-top: 24px;
        font-family: "Cinzel", serif;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold-soft);
        white-space: nowrap;
      }

      /* fade-to-black outro */
      #blackout {
        position: absolute;
        inset: 0;
        background: #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div id="bg" data-layout-allow-overflow></div>
        <div id="leak1" class="leak" data-layout-allow-overflow></div>
        <div id="leak2" class="leak" data-layout-allow-overflow></div>
        <div id="particles" data-layout-allow-overflow data-layout-ignore></div>

        <div id="scene">
          <div id="stack">
            <div id="titleWrap">
              <div id="title" class="hero-type" data-layout-allow-overflow data-layout-allow-occlusion>EMPIRE</div>
              <div id="shine" class="hero-type" data-layout-allow-overflow data-layout-ignore>EMPIRE</div>
            </div>
            <div id="rule"></div>
            <div id="tagline" data-layout-allow-occlusion>A Dynasty Built on Ruin</div>
          </div>
        </div>

        <div id="grain" data-layout-allow-occlusion></div>
        <div id="vignette" data-layout-allow-occlusion></div>
        <div id="blackout" data-layout-allow-occlusion></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Deterministic: no Math.random()/Date.now() anywhere — every value
      // below is a fixed constant (including every particle's placement/
      // speed, derived from its index), so the render is identical every run.

      const tl = gsap.timeline({ paused: true });

      gsap.set("#bg", { opacity: 0, scale: 1 });
      gsap.set(["#leak1", "#leak2"], { opacity: 0, x: 0, y: 0 });
      gsap.set("#titleWrap", { opacity: 0, scale: 0.72, filter: "blur(16px)" });
      gsap.set("#shine", { backgroundPosition: "-160% 0" });
      gsap.set("#rule", { scaleX: 0 });
      gsap.set("#tagline", { opacity: 0 });
      gsap.set("#blackout", { opacity: 0 });

      // (1) the world fades in out of black, then drifts in a slow parallax
      // push through the whole shot (independent of the title's own zoom)
      tl.to("#bg", { opacity: 1, duration: 0.7, ease: "power1.out" }, 0);
      tl.to("#bg", { scale: 1.06, duration: 15, ease: "none" }, 0);

      // (2) light leaks sweep in across the dark backdrop, drifting slowly
      // in opposite directions for a sense of depth
      tl.to("#leak1", { opacity: 0.55, duration: 1.9, ease: "power2.out" }, 0.3);
      tl.to("#leak2", { opacity: 0.4, duration: 2.0, ease: "power2.out" }, 0.6);
      tl.to("#leak1", { x: 55, y: -40, duration: 15, ease: "none" }, 0);
      tl.to("#leak2", { x: -45, y: 35, duration: 15, ease: "none" }, 0);

      // (3) floating embers drifting upward through the negative space --
      // deterministic placement/speed/opacity per index (golden-ratio
      // spread for even, non-repeating-looking horizontal placement)
      const PARTICLE_COUNT = 16;
      const GOLDEN_PCT = 61.803398875; // golden-ratio conjugate * 100
      const particlesEl = document.querySelector("#particles");
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const size = 4 + (i % 4) * 2; // 4 / 6 / 8 / 10 px
        const xPct = (i * GOLDEN_PCT) % 100;
        const startBottomPct = 6 + (i % 5) * 16; // staggered starting heights
        const duration = 10 + (i % 6) * 1.4; // 10 - 17.5s drift speeds
        const delay = (i * 0.37) % 4.2; // staggered starts across the open
        const peakOpacity = 0.22 + (i % 3) * 0.1;

        const el = document.createElement("div");
        el.className = "particle";
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${xPct}%`;
        el.style.bottom = `${startBottomPct}%`;
        particlesEl.appendChild(el);

        gsap.set(el, { y: 0, opacity: 0 });
        tl.to(el, { opacity: peakOpacity, duration: duration * 0.15, ease: "sine.out" }, delay);
        tl.to(el, { y: -1300, duration, ease: "none" }, delay);
        tl.to(el, { opacity: 0, duration: duration * 0.25, ease: "sine.in" }, delay + duration * 0.75);
      }

      // (4) a focus pull as the title arrives -- starts soft, sharpens into
      // focus well before the push finishes settling
      tl.to("#titleWrap", { filter: "blur(0px)", duration: 3.4, ease: "power2.out" }, 0.9);

      // (5) the dramatic, decelerating zoom-in on the title
      tl.to("#titleWrap", { opacity: 1, scale: 1, duration: 7.1, ease: "power3.out" }, 0.9);

      // (6) a thin gold rule draws in as the title settles
      tl.to("#rule", { scaleX: 1, duration: 1.1, ease: "power2.out" }, 7.0);

      // (7) a single bright shine sweeps across the gold letters once
      // settled -- the "catching the light" polish beat
      tl.to("#shine", { backgroundPosition: "160% 0", duration: 1.2, ease: "power2.inOut" }, 7.6);

      // (8) the tagline fades in beneath the rule for a two-tier reveal
      tl.to("#tagline", { opacity: 0.85, duration: 1.2, ease: "power2.out" }, 8.3);

      // (9) the leaks breathe gently through the hold (fixed, finite oscillation)
      tl.to("#leak1", { opacity: 0.32, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.5);
      tl.to("#leak2", { opacity: 0.22, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.0);

      // (10) fade to black outro — ends fully black exactly at the composition's end (15.0s)
      tl.to("#blackout", { opacity: 1, duration: 4.0, ease: "power1.in" }, 11.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
