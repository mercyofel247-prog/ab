<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tencent — $500B+</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-0: #05060a;
        --bg-1: #14171d;
        --bg-2: #23272f;
        --steel-hi: #f2f4f7;
        --steel-mid: #a8afb9;
        --steel-lo: #454a54;
        --jade: #3ddc97;
        --jade-dim: rgba(61, 220, 151, 0.35);
        --ink-dim: #8f96a1;
        --bar-rival-1: #6b7684;
        --bar-rival-2: #545e6b;
        --bar-rival-3: #3f4854;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-0);
      }

      body {
        font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 34%, var(--bg-2) 0%, var(--bg-1) 46%, var(--bg-0) 100%);
      }

      /* brushed-metal streaks */
      .brushed {
        position: absolute;
        inset: -10% -10%;
        background: repeating-linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.05) 0px,
          rgba(255, 255, 255, 0.05) 1px,
          rgba(255, 255, 255, 0) 3px,
          rgba(255, 255, 255, 0) 7px,
          rgba(255, 255, 255, 0.03) 8px,
          rgba(255, 255, 255, 0) 10px
        );
        mix-blend-mode: overlay;
        opacity: 0.5;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.5;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(75% 68% at 50% 44%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.6) 100%);
      }

      /* ── hero number ── */
      .hero-group {
        position: absolute;
        top: 96px;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 5;
      }

      .amount {
        display: flex;
        align-items: flex-start;
        gap: 4px;
      }

      .amount-figure {
        font-size: 168px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        background: linear-gradient(
          180deg,
          var(--steel-hi) 0%,
          var(--steel-mid) 42%,
          var(--steel-lo) 54%,
          var(--steel-hi) 62%,
          var(--steel-mid) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.55));
      }

      .amount-plus {
        font-size: 84px;
        font-weight: 800;
        color: var(--jade);
        line-height: 0.9;
        margin-top: 10px;
        opacity: 0;
        filter: drop-shadow(0 0 18px rgba(61, 220, 151, 0.65));
      }

      .subtitle {
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink-dim);
        opacity: 0;
      }

      .amount-flash {
        position: absolute;
        top: -60px;
        left: 50%;
        width: 900px;
        height: 420px;
        transform: translateX(-50%);
        background: radial-gradient(50% 50% at 50% 40%, rgba(200, 255, 230, 0.4) 0%, rgba(200, 255, 230, 0) 70%);
        opacity: 0;
        pointer-events: none;
        z-index: 4;
      }

      /* ── logo badge ── */
      .logo-badge {
        position: absolute;
        top: 84px;
        right: 148px;
        width: 152px;
        height: 152px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 60% at 40% 32%, var(--bg-2) 0%, var(--bg-0) 100%);
        border: 2px solid var(--jade-dim);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 14px 30px rgba(0, 0, 0, 0.5);
        z-index: 6;
      }

      .logo-badge svg {
        width: 76px;
        height: 76px;
        overflow: visible;
      }

      .logo-glow {
        position: absolute;
        top: 84px;
        right: 148px;
        width: 152px;
        height: 152px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(61, 220, 151, 0.55) 0%, rgba(61, 220, 151, 0) 70%);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      /* ── callout ── */
      .callout {
        position: absolute;
        top: 452px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 48px;
        font-weight: 800;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--steel-hi);
        white-space: nowrap;
        opacity: 0;
        z-index: 5;
      }

      .callout::after {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: -14px;
        height: 4px;
        background: linear-gradient(90deg, rgba(61, 220, 151, 0) 0%, var(--jade) 50%, rgba(61, 220, 151, 0) 100%);
      }

      /* ── comparison bars ── */
      .bars {
        position: absolute;
        left: 50%;
        bottom: 128px;
        transform: translateX(-50%);
        width: 940px;
        height: 340px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        z-index: 5;
      }

      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 200px;
        height: 100%;
        opacity: 0;
      }

      .bar-value {
        font-size: 22px;
        font-weight: 700;
        color: var(--ink-dim);
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
      }

      .bar-col.hero .bar-value {
        color: var(--jade);
      }

      .bar-rect {
        width: 132px;
        border-radius: 10px 10px 0 0;
      }

      .bar-col.hero .bar-rect {
        background: linear-gradient(180deg, var(--jade) 0%, #22b578 100%);
        box-shadow: 0 0 26px rgba(61, 220, 151, 0.45);
      }

      .bar-col:not(.hero) .bar-rect {
        background: linear-gradient(180deg, var(--bar-rival-1) 0%, var(--bar-rival-3) 100%);
      }

      .bar-label {
        margin-top: 14px;
        font-size: 24px;
        font-weight: 600;
        color: var(--ink-dim);
      }

      .bar-col.hero .bar-label {
        color: var(--steel-hi);
      }

      /* ── full-screen impact flash ── */
      .impact-flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(65% 60% at 50% 42%, rgba(210, 255, 235, 0.55) 0%, rgba(210, 255, 235, 0) 72%);
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div class="brushed" data-layout-allow-overflow></div>
        <div class="grid"></div>
        <div class="vignette"></div>

        <div id="heroGroup" class="hero-group">
          <div class="amount">
            <span id="amountFigure" class="amount-figure">$0B</span>
            <span id="amountPlus" class="amount-plus">+</span>
          </div>
          <div id="subtitle" class="subtitle">Tencent's market cap</div>
        </div>
        <div id="amountFlash" class="amount-flash"></div>

        <div id="logoGlow" class="logo-glow"></div>
        <div id="logoBadge" class="logo-badge">
          <svg viewBox="0 0 64 64" fill="none">
            <path
              d="M32 8C17.6 8 6 17.2 6 28.6c0 6.5 3.8 12.3 9.7 16.1-.4 2.6-1.6 6.4-3.5 9.7 3.9-1 8.5-3.1 11.4-5 2.7.7 5.5 1.1 8.4 1.1 14.4 0 26-9.2 26-20.6C58 17.2 46.4 8 32 8Z"
              fill="none"
              stroke="var(--jade)"
              stroke-width="3.4"
              stroke-linejoin="round"
            />
            <circle cx="23" cy="28" r="3.4" fill="var(--jade)" />
            <circle cx="32" cy="28" r="3.4" fill="var(--jade)" />
            <circle cx="41" cy="28" r="3.4" fill="var(--jade)" />
          </svg>
        </div>

        <div id="callout" class="callout">Bigger than all of them</div>

        <div class="bars">
          <div id="barTencent" class="bar-col hero">
            <div class="bar-value">$500B+</div>
            <div class="bar-rect" style="height: 300px"></div>
            <div class="bar-label">Tencent</div>
          </div>
          <div id="barFacebook" class="bar-col">
            <div class="bar-value">$260B</div>
            <div class="bar-rect" style="height: 195px"></div>
            <div class="bar-label">Facebook</div>
          </div>
          <div id="barMastercard" class="bar-col">
            <div class="bar-value">$210B</div>
            <div class="bar-rect" style="height: 158px"></div>
            <div class="bar-label">Mastercard</div>
          </div>
          <div id="barSamsung" class="bar-col">
            <div class="bar-value">$180B</div>
            <div class="bar-rect" style="height: 132px"></div>
            <div class="bar-label">Samsung</div>
          </div>
        </div>

        <div id="impactFlash" class="impact-flash"></div>
      </section>

      <audio
        id="impact"
        data-start="1.3"
        data-duration="8.7"
        data-track-index="2"
        src="assets/impact.wav"
        data-volume="0.9"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const figureEl = document.querySelector("#amountFigure");
      const TARGET = 500;

      function renderCount(v) {
        const bounded = Math.max(0, Math.min(TARGET, v));
        figureEl.textContent = "$" + Math.round(bounded) + "B";
      }

      renderCount(0);

      const count = { v: 0 };

      gsap.set("#heroGroup", { xPercent: -50 });
      gsap.set(["#heroGroup", "#subtitle", "#amountPlus"], { opacity: 0 });
      gsap.set("#heroGroup", { y: 16, scale: 0.97 });
      gsap.set("#logoBadge", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#callout", { y: 18, opacity: 0 });
      gsap.set(".bar-col", { y: 46, opacity: 0 });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      // 0.1s — hero number fades/settles in
      tl.to("#heroGroup", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power2.out" }, 0.1);

      // 0.3s -> 3.1s — deterministic count-up 0 -> 500 (proxy tween, seek-safe)
      tl.to(
        count,
        {
          v: TARGET,
          duration: 2.8,
          ease: "power1.out",
          onUpdate: () => renderCount(count.v),
          onComplete: () => renderCount(TARGET),
        },
        0.3,
      );

      // landing punch on the beat — scale pop + "+" pop-in + local flash
      tl.to("#amountFigure", { scale: 1.05, duration: 0.14, ease: "back.out(2.6)" }, 3.05);
      tl.to("#amountFigure", { scale: 1, duration: 0.26, ease: "power2.out" }, 3.19);
      tl.fromTo("#amountPlus", { opacity: 0, scale: 0.5, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(3)" }, 3.08);
      tl.to("#amountFlash", { opacity: 1, duration: 0.08, ease: "none" }, 3.05);
      tl.to("#amountFlash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 3.13);

      // subtitle fades up beneath, after the number lands
      tl.fromTo("#subtitle", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.3);

      // 4.0s — logo mark scales in with a light sting
      tl.fromTo(
        "#logoBadge",
        { scale: 0, opacity: 0, rotate: -12 },
        { scale: 1, opacity: 1, rotate: 0, duration: 0.55, ease: "back.out(2.2)" },
        4.0,
      );
      tl.to("#logoGlow", { opacity: 1, duration: 0.1, ease: "none" }, 4.0);
      tl.to("#logoGlow", { opacity: 0, duration: 0.7, ease: "power2.out" }, 4.1);

      // 6.0s — three comparison bars slide in beside the Tencent bar, staggered
      tl.fromTo("#barTencent", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.0);
      tl.fromTo("#barFacebook", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.15);
      tl.fromTo("#barMastercard", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.3);
      tl.fromTo("#barSamsung", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.45);

      // 6.7s — bold callout punches in
      tl.fromTo(
        "#callout",
        { opacity: 0, y: 18, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.4)" },
        6.7,
      );

      // 9.5s — final logo lockup: punch + full-screen flash + micro shake, synced to the audio impact
      tl.to("#logoBadge", { scale: 1.22, duration: 0.12, ease: "back.out(2.8)" }, 9.5);
      tl.to("#logoBadge", { scale: 1.06, duration: 0.28, ease: "power2.out" }, 9.62);
      tl.to("#logoGlow", { opacity: 0.85, duration: 0.08, ease: "none" }, 9.5);
      tl.to("#logoGlow", { opacity: 0, duration: 0.4, ease: "power3.out" }, 9.58);
      tl.to("#impactFlash", { opacity: 0.55, duration: 0.08, ease: "none" }, 9.5);
      tl.to("#impactFlash", { opacity: 0, duration: 0.38, ease: "power3.out" }, 9.58);
      tl.to("#stage", { x: -6, duration: 0.05, ease: "none", overwrite: "auto" }, 9.5);
      tl.to("#stage", { x: 5, duration: 0.05, ease: "none", overwrite: "auto" }, 9.55);
      tl.to("#stage", { x: -3, duration: 0.05, ease: "none", overwrite: "auto" }, 9.6);
      tl.to("#stage", { x: 0, duration: 0.08, ease: "none", overwrite: "auto" }, 9.65);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
