<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Number Beat — $500,000,000,000</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0a0a0c;
        --alert: #d62e1f;
        --steel-hi: #f6f9fc;
        --steel-cool: #cdd6e0;
        --steel-mid: #9aa5b2;
        --steel-lo: #363b45;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: Inter, "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      /* everything that shares the subtle push-in lives in #world */
      #world {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }

      /* ---------- z1 : fine dust ---------- */
      .dust {
        position: absolute;
        inset: -8%;
        pointer-events: none;
        z-index: 1;
      }
      .dust .mote {
        position: absolute;
        border-radius: 50%;
        background: rgba(226, 236, 248, 0.9);
      }

      /* ---------- z2 : red emissive underglow (blurred div behind numeral) ---------- */
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 560px;
        margin-left: -750px;
        margin-top: -280px;
        background: radial-gradient(
          58% 58% at 50% 50%,
          rgba(214, 46, 31, 0.9) 0%,
          rgba(214, 46, 31, 0.42) 40%,
          rgba(150, 22, 15, 0.14) 66%,
          rgba(10, 10, 12, 0) 82%
        );
        filter: blur(56px);
        opacity: 0.92;
        z-index: 2;
        pointer-events: none;
      }

      /* ---------- z3 : the hero numeral ---------- */
      .hero {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .numeral-wrap {
        position: relative;
        max-width: 90%;
        transform-origin: 50% 50%;
      }

      #numeral {
        font-size: 128px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.006em;
        white-space: nowrap;
        /* tabular / monospaced figures so the width never jumps */
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
        /* layer 1 (top): specular highlight band, parked off-left, swept by JS.
           layer 2: fine brushed-metal micro-streaks.
           layer 3 (base): cool vertical steel gradient. All clipped to the glyphs —
           one numeral, no plate, no duplicate copy. */
        background-image: linear-gradient(
            104deg,
            rgba(255, 255, 255, 0) 40%,
            rgba(255, 255, 255, 0.95) 50%,
            rgba(255, 255, 255, 0) 60%
          ),
          repeating-linear-gradient(
            91deg,
            rgba(255, 255, 255, 0.08) 0px,
            rgba(255, 255, 255, 0.08) 1px,
            rgba(0, 0, 0, 0.06) 2px,
            rgba(0, 0, 0, 0) 4px
          ),
          linear-gradient(
            179deg,
            var(--steel-hi) 0%,
            var(--steel-cool) 32%,
            var(--steel-mid) 49%,
            var(--steel-lo) 56%,
            var(--steel-cool) 70%,
            var(--steel-hi) 86%,
            var(--steel-mid) 100%
          );
        background-repeat: no-repeat, repeat, no-repeat;
        background-size: 440px 100%, auto, 100% 100%;
        background-position: -560px 0, 0 0, 0 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* layered bevel (top light / bottom dark) + depth drop, all on the glyph
           pixels so it survives the gradient clip; red bloom rides underneath. */
        filter: drop-shadow(0 -2px 0 rgba(255, 255, 255, 0.4))
          drop-shadow(0 2px 1px rgba(0, 0, 0, 0.55))
          drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 30px rgba(214, 46, 31, 0.26));
      }

      /* ---------- z3 top : vignette ---------- */
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: radial-gradient(
          80% 80% at 50% 48%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.55) 84%,
          rgba(0, 0, 0, 0.82) 100%
        );
      }

      /* ---------- grade : 8% grain (fixed, above the push-in) ---------- */
      #grain {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.08;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="world" data-layout-allow-overflow>
          <!-- z1 dust -->
          <div id="dustFar" class="dust" data-layout-allow-overflow></div>
          <div id="dustNear" class="dust" data-layout-allow-overflow></div>

          <!-- z2 red underglow -->
          <div id="glow" data-layout-allow-overflow></div>

          <!-- z3 hero numeral -->
          <div class="hero">
            <div class="numeral-wrap">
              <div id="numeral" data-layout-allow-occlusion>$500,000,000,000</div>
            </div>
          </div>

          <!-- z3 vignette -->
          <div id="vignette"></div>
        </div>

        <!-- grade grain, fixed on top -->
        <div id="grain"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---- deterministic dust field (seeded, no Math.random) ---- */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function seedDust(el, count, seed, sizeMin, sizeMax, alphaMax) {
        const rnd = mulberry32(seed);
        let html = "";
        for (let i = 0; i < count; i++) {
          const x = (rnd() * 100).toFixed(3);
          const y = (rnd() * 100).toFixed(3);
          const s = (sizeMin + rnd() * (sizeMax - sizeMin)).toFixed(2);
          const a = (0.12 + rnd() * (alphaMax - 0.12)).toFixed(3);
          html +=
            "<span class='mote' style='left:" +
            x +
            "%;top:" +
            y +
            "%;width:" +
            s +
            "px;height:" +
            s +
            "px;opacity:" +
            a +
            "'></span>";
        }
        el.innerHTML = html;
      }

      seedDust(document.querySelector("#dustFar"), 140, 5000045, 1.1, 2.4, 0.45);
      seedDust(document.querySelector("#dustNear"), 84, 918273, 1.9, 3.9, 0.8);

      /* ---- specular sweep: move the top background band across the glyphs ---- */
      const numeralEl = document.querySelector("#numeral");
      const spec = { x: -560 };
      function applySpec() {
        numeralEl.style.backgroundPosition = spec.x.toFixed(1) + "px 0px, 0px 0px, 0px 0px";
      }
      applySpec();

      /* ---- master timeline (no default ease; every tween eased explicitly) ---- */
      const tl = gsap.timeline({ paused: true });

      gsap.set(".numeral-wrap", { scale: 1.04 });
      gsap.set("#world", { scale: 1.0 });

      // 0–500ms : numeral settles 1.04 → 1.00 (overshoot-and-settle)
      tl.to(".numeral-wrap", { scale: 1.0, duration: 0.5, ease: "power4.out" }, 0);

      // 300–700ms : specular highlight sweeps L→R once
      tl.to(
        spec,
        { x: 1480, duration: 0.4, ease: "sine.inOut", onUpdate: applySpec },
        0.3,
      );

      // 500–1500ms : subtle true kinetic push-in on the whole stage (1.00 → 1.03)
      tl.to("#world", { scale: 1.03, duration: 1.0, ease: "sine.inOut" }, 0.5);

      // 0–4000ms : dust drifts continuously with ~1.6× parallax (only motion in the hold)
      tl.to("#dustFar", { xPercent: 2.0, yPercent: -1.3, duration: 4, ease: "none" }, 0);
      tl.to("#dustNear", { xPercent: -3.2, yPercent: 2.1, duration: 4, ease: "none" }, 0);

      // length lock = 4.0s (96 frames @ 24fps); hold 1500–4000ms static except dust
      tl.to({}, { duration: 4, ease: "none" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
