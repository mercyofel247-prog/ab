<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SEIZED — In 48 Hours (oxblood collapse, shot 2)</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Track 2 "oxblood collapse" */
        --ground: #0b0b0c;
        --oxblood: #7a160e;
        --ash: #3a3a3e;
        --bone: #ede8dd;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        /* resolves to the renderer's bundled Inter; extra-condensed look comes
           from a static scaleX squeeze on #hero-fit (never animated) */
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      /* the "camera" — push-in + contact shake live here */
      #world {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #bg {
        position: absolute;
        inset: -4%;
        background: radial-gradient(70% 60% at 50% 48%, #131114 0%, #0d0c0e 46%, #090809 74%, var(--ground) 100%);
      }

      /* faint oxblood breath, off-centre — never a symmetric glow */
      #haze {
        position: absolute;
        inset: -10%;
        background: radial-gradient(46% 40% at 70% 32%, rgba(122, 22, 14, 0.16) 0%, rgba(122, 22, 14, 0) 70%);
        mix-blend-mode: screen;
        opacity: 0.75;
      }

      #dust {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .d {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        will-change: transform, opacity;
      }

      #puff {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(122, 22, 14, 0.32) 0%, rgba(122, 22, 14, 0.1) 40%, rgba(122, 22, 14, 0) 70%);
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }

      #scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        perspective: 1600px;
        perspective-origin: 50% 47%;
      }

      #hero-scale {
        position: relative;
        will-change: transform, filter;
        transform-origin: 50% 50%;
      }

      #hero-fit {
        position: relative;
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #hero {
        position: relative;
        z-index: 2;
        font-weight: 900;
        font-size: 300px;
        line-height: 0.9;
        letter-spacing: -0.02em;
        white-space: nowrap;
        text-transform: uppercase;
        /* warm-bone metallic face, hard key upper-left */
        background: linear-gradient(132deg, #fdfaf3 0%, #ede8dd 26%, #d7d1c3 60%, #c2bbab 82%, #b3ab9a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        /* hard key upper-left + real extruded depth down-right + contact shadow */
        text-shadow:
          -1px -1px 0 rgba(255, 251, 242, 0.45),
          1px 1px 0 #34343a,
          2px 2px 0 #2f2f34,
          3px 3px 0 #2a2a2f,
          4px 4px 0 #252529,
          5px 5px 0 #202024,
          6px 6px 0 #1b1b1f,
          7px 7px 0 #171719,
          8px 8px 0 #121214,
          9px 9px 0 #0e0e10,
          10px 11px 24px rgba(0, 0, 0, 0.62),
          14px 20px 40px rgba(0, 0, 0, 0.5);
      }

      /* the oxblood STAMP-STROKE — a single hard strike behind the word, wiped
         across on the sync frame (scaleX from a left origin). One bar, one accent. */
      #stamp-bar {
        position: absolute;
        left: -1%;
        z-index: 1;
        background: linear-gradient(90deg, #5a0f08 0%, #7a160e 12%, #9a281c 50%, #7a160e 88%, #5a0f08 100%);
        box-shadow: 0 0 22px rgba(122, 22, 14, 0.75), 0 0 6px rgba(122, 22, 14, 0.9);
        transform-origin: 0% 50%;
        will-change: transform, opacity;
      }

      #sub-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 78%;
        text-align: center;
        pointer-events: none;
      }

      #subtitle {
        display: inline-block;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #7d7d84; /* machined ash-graphite, lifted just enough to stay legible */
        text-transform: uppercase;
        font-variant-caps: small-caps;
        will-change: transform, opacity;
      }
      #subtitle .w {
        display: inline-block;
        will-change: transform, opacity;
      }

      /* ---------- grade overlays ---------- */
      #grain {
        position: absolute;
        inset: -3%;
        opacity: 0.08;
        mix-blend-mode: overlay;
        pointer-events: none;
        will-change: transform;
        background-repeat: repeat;
        background-size: 256px 256px;
      }

      #ca {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.5;
        background:
          radial-gradient(130% 130% at 0% 0%, rgba(255, 40, 40, 0.06) 0%, rgba(255, 40, 40, 0) 38%),
          radial-gradient(130% 130% at 100% 100%, rgba(40, 200, 255, 0.06) 0%, rgba(40, 200, 255, 0) 38%);
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(78% 74% at 50% 47%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.78) 100%);
      }

      .lb {
        position: absolute;
        left: -2%;
        right: -2%;
        height: 132px;
        background: #000;
        pointer-events: none;
        z-index: 5;
      }
      #lb-top {
        top: 0;
      }
      #lb-bottom {
        bottom: 0;
      }

      #fade {
        position: absolute;
        inset: 0;
        background: var(--ground);
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.5"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <div id="world">
          <div id="bg"></div>
          <div id="haze" data-layout-allow-overflow></div>
          <div id="dust" data-layout-allow-overflow></div>

          <!-- heavy dark vignette darkens the field but sits UNDER the word -->
          <div id="vignette"></div>

          <div id="scene">
            <div id="hero-scale" data-layout-allow-overflow>
              <div id="hero-fit" data-layout-allow-overflow>
                <div id="stamp-bar"></div>
                <div id="hero">SEIZED</div>
              </div>
            </div>
          </div>

          <div id="sub-wrap">
            <div id="subtitle">In 48 Hours</div>
          </div>

          <div id="puff"></div>
        </div>

        <div id="grain"></div>
        <div id="ca"></div>
        <div id="lb-top" class="lb"></div>
        <div id="lb-bottom" class="lb"></div>
        <div id="fade"></div>
      </section>

      <audio
        id="boom"
        data-start="0"
        data-duration="4.5"
        data-track-index="2"
        src="assets/boom.wav"
        data-volume="0.95"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---------- deterministic RNG (mulberry32) — no Math.random / Date.now ---------- */
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const FPS = 24;
      const F = (f) => f / FPS; // frame -> seconds

      const stage = document.querySelector("#stage");
      const hero = document.querySelector("#hero");
      const heroFit = document.querySelector("#hero-fit");
      const stampBar = document.querySelector("#stamp-bar");
      const dustEl = document.querySelector("#dust");

      // Build only AFTER the substituted web font is loaded, so the width
      // measurement is taken against the real font (otherwise the word overflows).
      document.fonts.ready.then(function () {
        /* ---------- fit the word to 82% of frame width ---------- */
        const TARGET_W = 1920 * 0.82; // 1574.4px — the loudest word in the film
        const CONDENSE = 0.7; // static horizontal squeeze -> heavy extra-condensed face
        const natW = hero.getBoundingClientRect().width || 1;
        const FIT = TARGET_W / (natW * CONDENSE);
        heroFit.style.transform = "scale(" + FIT + ") scaleX(" + CONDENSE + ")";

        // Frame-centre the word (its natural box is wider than the frame, so grid
        // centring of the overflow leaves it off-centre).
        const CENTER_X = 960;
        {
          const sr0 = stage.getBoundingClientRect();
          const h0 = hero.getBoundingClientRect();
          const curCenter = h0.left - sr0.left + h0.width / 2;
          gsap.set("#hero-scale", { x: CENTER_X - curCenter });
        }

        // Size + place the stamp-stroke in #hero-fit's LOCAL space (before its
        // transform) so the fit/condense scale carries it in perfect register with
        // the glyphs. It grazes the lower third and sits behind the word.
        const hw = hero.offsetWidth;
        const hh = hero.offsetHeight;
        stampBar.style.width = hw * 1.02 + "px";
        stampBar.style.height = hh * 0.11 + "px";
        stampBar.style.top = hh * 0.62 + "px";

        /* ---------- split the subtitle into words for a staggered rise ---------- */
        const subEl = document.querySelector("#subtitle");
        const subWords = subEl.textContent.trim().split(/\s+/);
        subEl.innerHTML = subWords
          .map((w, i) => '<span class="w">' + w + (i < subWords.length - 1 ? "&nbsp;" : "") + "</span>")
          .join("");
        const wordEls = subEl.querySelectorAll(".w");

        /* ---------- moving 35mm-style grain (seeded noise tile) ---------- */
        (function buildGrain() {
          const size = 128;
          const c = document.createElement("canvas");
          c.width = c.height = size;
          const x = c.getContext("2d");
          const im = x.createImageData(size, size);
          const r = mulberry32(0x6a11a5);
          for (let i = 0; i < size * size; i++) {
            const v = (r() * 255) | 0;
            im.data[i * 4] = v;
            im.data[i * 4 + 1] = v;
            im.data[i * 4 + 2] = v;
            im.data[i * 4 + 3] = 255;
          }
          x.putImageData(im, 0, 0);
          document.querySelector("#grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
        })();

        /* ---------- ambient oxblood dust (continuous lateral drift, seeded) ---------- */
        const drng = mulberry32(0xd05702);
        const dust = [];
        const DUST_N = 46;
        for (let i = 0; i < DUST_N; i++) {
          const x0 = drng() * 1920;
          const y0 = 120 + drng() * 840;
          const size = 1.5 + drng() * 3;
          const el = document.createElement("div");
          el.className = "d";
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.background = drng() < 0.5 ? "rgba(122,22,14,0.55)" : "rgba(200,190,170,0.4)";
          dustEl.appendChild(el);
          dust.push({ el, x0, y0, drift: (drng() < 0.5 ? -1 : 1) * (60 + drng() * 120), yamp: 8 + drng() * 22, ph: drng() });
        }

        /* ================= TIMELINE ================= */
        const tl = gsap.timeline({ paused: true });

        // ---- initial states ----
        gsap.set("#world", { scale: 1.0, x: 0, y: 0 });
        gsap.set("#hero-scale", { scale: 1.75 }); // crash-zoom starts oversize (keeps centring x)
        gsap.set(hero, { opacity: 0.3 });
        gsap.set("#stamp-bar", { scaleX: 0, opacity: 0 });
        gsap.set("#puff", { opacity: 0, scale: 0.6 });
        gsap.set(wordEls, { opacity: 0, y: 6 });
        dust.forEach((d) => gsap.set(d.el, { x: d.x0, y: d.y0, opacity: 0.0 }));

        // rack-focus blur + deep-oxblood emissive rim baked onto the real word.
        // The rim is a directional glow up-right => rims ONLY the top-right edge.
        const focus = { blur: 14 }; // crash-zoom resolves focus 14px -> 0 as it lands
        const rim = { a: 0 }; // oxblood rim strength: 0 -> bloom -> breath
        const applyFilter = () => {
          const a = rim.a;
          hero.style.filter =
            "blur(" + focus.blur.toFixed(3) + "px) " +
            "drop-shadow(7px -7px 10px rgba(122,22,14," + (a * 0.85).toFixed(3) + ")) " +
            "drop-shadow(3px -3px 4px rgba(122,22,14," + a.toFixed(3) + "))";
        };
        applyFilter();

        /* ---- 0–1500ms (f0–36): CRASH-ZOOM APPROACH ----
           the word rushes in from oversize + blur, decelerating hard, timed to
           arrive at exactly scale 1.0 and razor-sharp ON f36. ONE inward move. */
        tl.to("#hero-scale", { scale: 1.0, duration: F(36), ease: "expo.out" }, 0);
        tl.to(focus, { blur: 0, duration: F(36), ease: "expo.out", onUpdate: applyFilter }, 0);
        tl.to(hero, { opacity: 1, duration: F(12), ease: "power2.out" }, 0);
        // ambient dust drifts in and lives to the end
        tl.to(dust.map((d) => d.el), { opacity: 1, duration: 0.8, ease: "sine.out" }, 0);

        /* ---- 1500–1750ms (f36–42): SLAM / STAMP — the sync frame (BOOM on f36) ----
           five things move: overshoot, stamp wipe, rim bloom, contact shake, puff. */
        const T_IMPACT = F(36); // 1.500s
        // 1) 80ms slam recoil: back.out overshoot 1.00 -> 1.05 -> 1.00
        tl.to("#hero-scale", { scale: 1.05, duration: 0.04, ease: "back.out(3)" }, T_IMPACT);
        tl.to("#hero-scale", { scale: 1.0, duration: 0.18, ease: "power2.out" }, T_IMPACT + 0.04);
        // 2) the oxblood STAMP-STROKE wipes across left->right (one bar, one edge)
        tl.set("#stamp-bar", { opacity: 1 }, T_IMPACT);
        tl.to("#stamp-bar", { scaleX: 1, duration: 0.22, ease: "expo.out" }, T_IMPACT);
        // 3) oxblood rim blooms 0 -> full on expo.out
        tl.to(rim, { a: 0.9, duration: 0.25, ease: "expo.out", onUpdate: applyFilter }, T_IMPACT);
        // 4) 6px contact camera-shake on #world, damping out over 250ms
        const shake = [
          [6, -4],
          [-5, 5],
          [4.2, -3.4],
          [-3, 2.4],
          [2, -1.6],
          [-1.1, 0.9],
          [0, 0],
        ];
        let st = T_IMPACT;
        const sd = 0.25 / shake.length;
        shake.forEach((s) => {
          tl.to("#world", { x: s[0], y: s[1], duration: sd, ease: "power1.inOut" }, st);
          st += sd;
        });
        // 5) dust-puff kicks outward on power2.out
        tl.to("#puff", { opacity: 0.55, scale: 1.4, duration: 0.14, ease: "power2.out" }, T_IMPACT);
        tl.to("#puff", { opacity: 0, duration: 0.4, ease: "power2.out" }, T_IMPACT + 0.12);

        /* ---- 1750–2400ms (f42–58): the stamp settles; kicker rises ---- */
        tl.to(wordEls, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 }, F(42));

        /* ---- 2400–4300ms (f58–103): SUSTAINED MOTION — never stops ---- */
        // slow push-in 1.00 -> 1.05 on sine.inOut
        tl.to("#world", { scale: 1.05, duration: F(103) - F(58), ease: "sine.inOut" }, F(58));
        // rim + stamp do one slow opacity breath 0.85 -> 0.70 -> 0.85
        const breathHalf = (F(103) - F(58)) / 2;
        tl.to(rim, { a: 0.7, duration: breathHalf, ease: "sine.inOut", onUpdate: applyFilter }, F(58));
        tl.to(rim, { a: 0.85, duration: breathHalf, ease: "sine.inOut", onUpdate: applyFilter }, F(58) + breathHalf);
        tl.to("#stamp-bar", { opacity: 0.72, duration: breathHalf, ease: "sine.inOut" }, F(58));
        tl.to("#stamp-bar", { opacity: 0.9, duration: breathHalf, ease: "sine.inOut" }, F(58) + breathHalf);

        /* ---- ambient dust: continuous lateral drift across the WHOLE clip ---- */
        dust.forEach((d) => {
          tl.to(
            d.el,
            {
              x: d.x0 + d.drift,
              y: d.y0 - d.yamp,
              duration: 4.5,
              ease: "sine.inOut",
              onUpdate: function () {
                const pr = this.progress();
                const yy = d.y0 - d.yamp * Math.sin((pr + d.ph) * Math.PI * 2);
                d.el.style.transform = "translate(" + (d.x0 + d.drift * pr) + "px," + yy + "px)";
              },
            },
            0,
          );
        });

        /* ---- moving film grain: re-jitter every ~2 frames (single proxy tween) ---- */
        const grng = mulberry32(0x9a1a11);
        const GSTEPS = 54;
        const grainOffs = [];
        for (let i = 0; i < GSTEPS; i++) grainOffs.push([(grng() - 0.5) * 12, (grng() - 0.5) * 12]);
        const grainEl = document.querySelector("#grain");
        const grainProxy = { t: 0 };
        tl.to(
          grainProxy,
          {
            t: 1,
            duration: 4.5,
            ease: "none",
            onUpdate: function () {
              const idx = Math.min(GSTEPS - 1, Math.floor(this.progress() * GSTEPS));
              grainEl.style.transform = "translate(" + grainOffs[idx][0] + "px," + grainOffs[idx][1] + "px)";
            },
          },
          0,
        );

        /* ---- 4300–4500ms (f103–108): EXIT — fast fall-off toward the ground colour ---- */
        tl.to("#fade", { opacity: 0.92, duration: F(108) - F(104), ease: "power2.in" }, F(104));

        // pin the timeline to exactly 108 frames
        tl.set({}, {}, F(108));

        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
