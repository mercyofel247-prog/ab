<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Valuation — $4.5B (3D metal hero)</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/three.bundle.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b0c;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b0c;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <canvas id="gl" width="1920" height="1080"></canvas>
      </section>
    </div>

    <!-- Hero typeface: LiberationSans-Bold subset ($4.5B), parsed synchronously
         so there is no runtime network fetch. Generated by tools/build-font.mjs. -->
    <script id="heroFont" type="application/json">
{"glyphs":{"4":{"ha":1139,"x_min":31,"x_max":1128,"o":"m 1128 287 l 940 287 l 940 0 l 672 0 l 672 287 l 31 287 l 31 498 l 626 1409 l 940 1409 l 940 496 l 1128 496 l 1128 287 m 672 496 l 672 957 q 676 1074 672 1011 q 681 1155 679 1137 l 681 1155 q 587 993 655 1099 l 587 993 l 260 496 l 672 496"},"5":{"ha":1139,"x_min":63,"x_max":1082,"o":"m 1082 469 l 1082 469 q 943 113 1082 245 q 560 -20 803 -20 l 560 -20 q 221 76 348 -20 q 63 352 93 171 l 63 352 l 344 375 q 422 244 366 285 q 563 203 478 203 l 563 203 q 731 270 668 203 q 793 463 793 337 l 793 463 q 734 641 793 574 q 569 707 675 707 l 569 707 q 378 616 452 707 l 378 616 l 104 616 l 153 1409 l 1000 1409 l 1000 1200 l 408 1200 l 385 844 q 640 934 487 934 l 640 934 q 962 809 841 934 q 1082 469 1082 684"},"$":{"ha":1139,"x_min":27,"x_max":1110,"o":"m 1110 412 l 1110 412 q 989 132 1110 231 q 629 23 867 32 l 629 23 l 629 -152 l 520 -152 l 520 20 q 185 122 305 28 q 27 408 65 215 l 27 408 l 283 455 q 359 290 302 342 q 520 227 415 237 l 520 227 l 520 618 q 505 623 517 620 q 489 625 493 625 l 489 625 q 245 713 327 662 q 117 841 162 763 q 72 1030 72 918 l 72 1030 q 187 1287 72 1196 q 520 1386 301 1378 l 520 1386 l 520 1520 l 629 1520 l 629 1386 q 848 1345 760 1381 q 989 1238 935 1308 q 1075 1036 1042 1167 l 1075 1036 l 811 997 q 753 1132 796 1084 q 629 1190 709 1179 l 629 1190 l 629 838 l 640 836 q 817 788 669 836 q 1037 647 964 740 q 1110 412 1110 553 m 520 862 l 520 1194 q 334 1034 334 1180 l 334 1034 q 350 961 334 990 q 395 913 365 932 q 520 862 424 894 l 520 862 m 850 408 l 850 408 q 832 490 850 458 q 780 541 814 521 q 629 594 745 561 l 629 594 l 629 227 q 850 408 850 242"},".":{"ha":569,"x_min":139,"x_max":428,"o":"m 428 0 l 139 0 l 139 305 l 428 305 l 428 0"},"B":{"ha":1479,"x_min":137,"x_max":1386,"o":"m 1386 402 l 1386 402 q 1242 105 1386 210 q 842 0 1098 0 l 842 0 l 137 0 l 137 1409 l 782 1409 q 1173 1320 1040 1409 q 1305 1055 1305 1230 l 1305 1055 q 1239 853 1305 935 q 1036 741 1172 770 l 1036 741 q 1297 634 1207 721 q 1386 402 1386 546 m 1008 1015 l 1008 1015 q 948 1150 1008 1110 q 768 1190 887 1190 l 768 1190 l 432 1190 l 432 841 l 770 841 q 952 885 895 841 q 1008 1015 1008 928 m 1090 425 l 1090 425 q 806 623 1090 623 l 806 623 l 432 623 l 432 219 l 817 219 q 1025 271 959 219 q 1090 425 1090 322"}},"familyName":"LiberationSans-Bold (subset)","ascender":1854,"descender":-434,"underlinePosition":-217,"underlineThickness":150,"boundingBox":{"yMin":-434,"xMin":0,"yMax":1854,"xMax":2048},"resolution":2048,"original_font_information":{"format":0,"fontFamily":"subset for HyperFrames hero"},"cssFontWeight":"bold","cssFontStyle":"normal"}
    </script>

    <script>
      window.__timelines = window.__timelines || {};

      const THREE = window.THREE;
      const { FontLoader, TextGeometry } = window.HF3D;

      // --- palette (Track-2 oxblood) ---------------------------------------
      const GROUND = 0x0b0b0c;
      const GROUND_HI = 0x141416;
      const BONE = 0xede8dd;
      const OXBLOOD = 0x7a160e;
      const GRAPHITE = 0x3a3a3e;

      const W = 1920,
        H = 1080,
        FPS = 30;
      const f = (n) => n / FPS; // frame → seconds

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true, // so headless screenshots capture the buffer
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(GROUND, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; // filmic, protected highlights
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(GROUND);
      scene.fog = new THREE.Fog(GROUND, 14, 30); // shallow-DoF-ish depth falloff

      // Procedural graphite studio environment so the dark metal reflects a soft
      // cool sheen (machined look) instead of reading pure black. Crushed still.
      function makeEnv() {
        const c = document.createElement("canvas");
        c.width = 1024;
        c.height = 512;
        const x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0.0, "#3a3f47");
        g.addColorStop(0.35, "#20232a");
        g.addColorStop(1.0, "#0b0b0c");
        x.fillStyle = g;
        x.fillRect(0, 0, 1024, 512);
        const rg = x.createRadialGradient(360, 150, 10, 360, 150, 280); // key softbox
        rg.addColorStop(0, "rgba(223,228,234,0.6)");
        rg.addColorStop(1, "rgba(223,228,234,0)");
        x.fillStyle = rg;
        x.fillRect(0, 0, 1024, 512);
        const t = new THREE.CanvasTexture(c);
        t.mapping = THREE.EquirectangularReflectionMapping;
        t.colorSpace = THREE.SRGBColorSpace;
        const p = new THREE.PMREMGenerator(renderer);
        p.compileEquirectangularShader();
        const rt = p.fromEquirectangular(t);
        t.dispose();
        p.dispose();
        return rt.texture;
      }
      scene.environment = makeEnv();

      // 40mm full-frame feel — tight, low distortion. fov is vertical.
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
      camera.position.set(0, 0, 14);
      camera.lookAt(0, 0, 0); // set orientation ONCE; truck-only afterwards for parallax

      // Visible world width at z=0 — the camera-x drift is expressed as a % of it.
      const worldW = 2 * Math.tan(THREE.MathUtils.degToRad(30 / 2)) * 14 * (W / H);

      // === Plane Z2 (back): graphite depth panels ==========================
      const planeZ2 = new THREE.Group();
      planeZ2.position.z = -6;
      const panelMat = new THREE.MeshStandardMaterial({
        color: GRAPHITE,
        metalness: 0.4,
        roughness: 0.55,
        envMapIntensity: 0.5,
      });
      const panelSpecs = [
        [-6.4, 0.4, 0.6, 11],
        [-3.1, -0.8, 0.5, 9],
        [3.0, 0.6, 0.55, 10],
        [6.2, -0.3, 0.7, 12],
        [1.0, 1.2, 0.4, 7],
      ];
      panelSpecs.forEach(([x, y, w, h]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.4), panelMat);
        m.position.set(x, y, (x % 2) * -0.8);
        planeZ2.add(m);
      });
      scene.add(planeZ2);

      // === Plane Z1 (mid): label, drawn to a canvas texture (bone, unlit) ===
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 1024;
      labelCanvas.height = 200;
      const lctx = labelCanvas.getContext("2d");
      lctx.clearRect(0, 0, 1024, 200);
      lctx.fillStyle = "#EDE8DD";
      lctx.font = '600 74px "Liberation Sans", Arial, sans-serif';
      lctx.textAlign = "center";
      lctx.textBaseline = "middle";
      if ("letterSpacing" in lctx) lctx.letterSpacing = "22px";
      lctx.fillText("PAPER NET WORTH", 512 + 11, 108);
      const labelTex = new THREE.CanvasTexture(labelCanvas);
      labelTex.colorSpace = THREE.SRGBColorSpace;
      labelTex.anisotropy = 4;
      const labelMat = new THREE.MeshBasicMaterial({
        map: labelTex,
        transparent: true,
        depthWrite: false,
      });
      const planeZ1 = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 1.8), labelMat);
      planeZ1.position.set(0, -3.05, -2);
      scene.add(planeZ1);

      // === Plane Z0 (front): the single extruded $4.5B hero mesh ============
      const font = new FontLoader().parse(JSON.parse(document.getElementById("heroFont").textContent));
      const textGeo = new TextGeometry("$4.5B", {
        font,
        size: 3.0,
        depth: 0.9,
        curveSegments: 10,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.07,
        bevelSegments: 4,
      });
      textGeo.computeBoundingBox();
      const bb = textGeo.boundingBox;
      // Centre the ONE instance (no duplication) — translate geometry to origin.
      textGeo.translate(
        -0.5 * (bb.max.x + bb.min.x),
        -0.5 * (bb.max.y + bb.min.y),
        -0.5 * (bb.max.z + bb.min.z),
      );
      const heroMat = new THREE.MeshStandardMaterial({
        color: 0x2a2a30, // dark machined graphite
        metalness: 0.6,
        roughness: 0.34,
        envMapIntensity: 0.85,
      });

      // Oxblood accent injected as a Fresnel TOP-EDGE glow that sweeps across —
      // edge-only by construction (never a flat surface fill), on the ONE mesh.
      const rimU = {
        uRimColor: { value: new THREE.Color().setHex(OXBLOOD, THREE.SRGBColorSpace) },
        uRimPower: { value: 1.8 },
        uRimStrength: { value: 0 }, // driven by rim.energy
        uSweepX: { value: -6.8 }, // driven by rim.x
        uSweepWidth: { value: 3.4 },
        uRimGain: { value: 3.4 }, // lifts dark-linear oxblood into a vivid edge
      };
      heroMat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, rimU);
        shader.vertexShader = shader.vertexShader
          .replace(
            "#include <common>",
            "#include <common>\nvarying vec3 vWNR;\nvarying vec3 vWPR;",
          )
          .replace(
            "#include <beginnormal_vertex>",
            "#include <beginnormal_vertex>\n vWNR = normalize(mat3(modelMatrix) * objectNormal);",
          )
          .replace(
            "#include <begin_vertex>",
            "#include <begin_vertex>\n vWPR = (modelMatrix * vec4(transformed, 1.0)).xyz;",
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            "#include <common>",
            "#include <common>\nvarying vec3 vWNR;\nvarying vec3 vWPR;\nuniform vec3 uRimColor;\nuniform float uRimPower;\nuniform float uRimStrength;\nuniform float uSweepX;\nuniform float uSweepWidth;\nuniform float uRimGain;",
          )
          .replace(
            "#include <dithering_fragment>",
            "float _fres = pow(1.0 - clamp(dot(normalize(vWNR), normalize(cameraPosition - vWPR)), 0.0, 1.0), uRimPower);\n float _top = smoothstep(-0.05, 0.45, vWNR.y);\n float _sweep = 1.0 - smoothstep(0.0, uSweepWidth, abs(vWPR.x - uSweepX));\n gl_FragColor.rgb += uRimColor * (_fres * _top * _sweep * uRimStrength * uRimGain);\n#include <dithering_fragment>",
          );
      };
      const hero = new THREE.Mesh(textGeo, heroMat);
      const heroGroup = new THREE.Group(); // uniform transforms only — never warp
      heroGroup.add(hero);
      heroGroup.position.z = 0;
      scene.add(heroGroup);

      // Soft contact shadow under the numeral (radial sprite on a flat plane).
      const shadowCanvas = document.createElement("canvas");
      shadowCanvas.width = shadowCanvas.height = 512;
      const sctx = shadowCanvas.getContext("2d");
      const grad = sctx.createRadialGradient(256, 256, 20, 256, 256, 250);
      grad.addColorStop(0, "rgba(0,0,0,0.72)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, 512, 512);
      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(11, 4.2),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2.15;
      shadow.position.set(0, -2.15, 0.4);
      scene.add(shadow);

      // === Lighting: cool base + single warm studio key + sweeping rim ======
      scene.add(new THREE.AmbientLight(0x223034, 0.5)); // cool desaturated fill (~4300K)

      // THE single studio key light — cool bone, upper-left front.
      const key = new THREE.DirectionalLight(0xdfe4ea, 2.8);
      key.position.set(-6, 7, 8);
      scene.add(key);

      // Cool fill from the right so the form reads dimensional (low, no flat wash).
      const fill = new THREE.DirectionalLight(0x9fb0be, 0.6);
      fill.position.set(7, 1, 5);
      scene.add(fill);

      // Cold graphite secondary sheen from behind, low.
      const rimBack = new THREE.DirectionalLight(GRAPHITE, 0.9);
      rimBack.position.set(5, -2, -6);
      scene.add(rimBack);

      // --- animated proxies -------------------------------------------------
      const cam = { x: 0 };
      const rim = { x: -6.5, energy: 0 }; // sweep position + intensity
      const seat = { s: 1.035 }; // landing settle (uniform scale — not a warp)

      function apply() {
        camera.position.x = cam.x; // truck only; orientation unchanged → parallax
        rimU.uSweepX.value = rim.x; // oxblood top-edge glow sweep position
        rimU.uRimStrength.value = rim.energy; // and its intensity
        heroGroup.scale.setScalar(seat.s);
        renderer.render(scene, camera);
      }
      apply(); // frame 0

      // === TIMELINE — every ease is explicit (no default easing) ============
      const tl = gsap.timeline({ paused: true, onUpdate: apply });

      // Camera x drift -3% of world width, f0–f72, expo.out.
      tl.to(cam, { x: -0.03 * worldW, duration: f(72), ease: "expo.out" }, f(0));

      // Landing settle [LAND:billion] — uniform scale seats, f0–f24, expo.out.
      tl.to(seat, { s: 1.0, duration: f(24), ease: "expo.out" }, f(0));

      // Specular oxblood rim sweeps top edges, f10–f50.
      tl.fromTo(
        rim,
        { x: -6.8 },
        { x: 6.8, duration: f(40), ease: "sine.inOut" },
        f(10),
      );
      tl.fromTo(rim, { energy: 0 }, { energy: 1, duration: f(20), ease: "expo.out" }, f(10));
      tl.to(rim, { energy: 0, duration: f(20), ease: "power3.in" }, f(30));

      window.__timelines["main"] = tl;
    </script>
