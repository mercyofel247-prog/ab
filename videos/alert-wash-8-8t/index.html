<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Alert Wash — $8.8 TRILLION</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0a0a0c;
        --alert: #d62e1f;
        --steel-hi: #fbfcfe;
        --steel-mid: #aeb4bd;
        --steel-lo: #3c4048;
        --steel-shadow: #16181d;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: Inter, "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      /* ---------- z1 : fine dust ---------- */
      .dust {
        position: absolute;
        inset: -6%;
        pointer-events: none;
        z-index: 1;
      }
      .dust .mote {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 244, 240, 0.9);
      }

      /* ---------- z2 : red flood layer ---------- */
      #flood {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2600px;
        height: 2600px;
        margin-left: -1300px;
        margin-top: -1300px;
        transform-origin: 50% 50%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(214, 46, 31, 0.95) 0%,
          rgba(214, 46, 31, 0.72) 22%,
          rgba(196, 34, 24, 0.4) 42%,
          rgba(150, 20, 14, 0.12) 62%,
          rgba(10, 10, 12, 0) 78%
        );
        filter: blur(6px);
        opacity: 0;
        z-index: 2;
        pointer-events: none;
      }

      /* red bloom core that locks behind the numeral */
      #coreGlow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 720px;
        margin-left: -750px;
        margin-top: -360px;
        background: radial-gradient(
          60% 60% at 50% 50%,
          rgba(255, 78, 58, 0.55) 0%,
          rgba(214, 46, 31, 0.22) 45%,
          rgba(214, 46, 31, 0) 72%
        );
        mix-blend-mode: screen;
        opacity: 0;
        z-index: 2;
        pointer-events: none;
      }

      /* ---------- z3 : the hero numeral ---------- */
      .hero {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .numeral-wrap {
        position: relative;
        max-width: 90%;
      }

      #numeral {
        font-size: 168px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.005em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
        /* layer 1 (top): specular highlight band, parked off-left, swept by JS.
           layer 2: fine brushed-metal micro-streaks.
           layer 3 (base): vertical steel gradient. All clipped to the glyphs —
           one numeral, no plate, no duplicate copy. */
        background-image: linear-gradient(
            104deg,
            rgba(255, 255, 255, 0) 40%,
            rgba(255, 255, 255, 0.92) 50%,
            rgba(255, 255, 255, 0) 60%
          ),
          repeating-linear-gradient(
            91deg,
            rgba(255, 255, 255, 0.09) 0px,
            rgba(255, 255, 255, 0.09) 1px,
            rgba(0, 0, 0, 0.06) 2px,
            rgba(0, 0, 0, 0) 4px
          ),
          linear-gradient(
            178deg,
            var(--steel-hi) 0%,
            #d7dce3 30%,
            var(--steel-mid) 47%,
            var(--steel-lo) 55%,
            #c8ccd3 66%,
            var(--steel-hi) 82%,
            var(--steel-mid) 100%
          );
        background-repeat: no-repeat, repeat, no-repeat;
        background-size: 520px 100%, auto, 100% 100%;
        background-position: -680px 0, 0 0, 0 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* base depth + locked red bloom; chromatic split is layered on top via JS */
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 34px rgba(214, 46, 31, 0.28));
      }

      /* ---------- z4 : vignette + grain grade ---------- */
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: radial-gradient(
          78% 78% at 50% 48%,
          rgba(0, 0, 0, 0) 42%,
          rgba(0, 0, 0, 0.5) 82%,
          rgba(0, 0, 0, 0.82) 100%
        );
      }

      #grain {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.08;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <!-- z1 dust -->
        <div id="dustFar" class="dust" data-layout-allow-overflow></div>
        <div id="dustNear" class="dust" data-layout-allow-overflow></div>

        <!-- z2 red flood -->
        <div id="flood" data-layout-allow-overflow></div>
        <div id="coreGlow" data-layout-allow-overflow></div>

        <!-- z3 hero numeral -->
        <div class="hero">
          <div class="numeral-wrap">
            <div id="numeral" data-layout-allow-occlusion>$8.8&nbsp;TRILLION</div>
          </div>
        </div>

        <!-- z4 grade -->
        <div id="vignette"></div>
        <div id="grain"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---- deterministic dust field (seeded, no Math.random) ---- */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function seedDust(el, count, seed, sizeMin, sizeMax, alphaMax) {
        const rnd = mulberry32(seed);
        let html = "";
        for (let i = 0; i < count; i++) {
          const x = (rnd() * 100).toFixed(3);
          const y = (rnd() * 100).toFixed(3);
          const s = (sizeMin + rnd() * (sizeMax - sizeMin)).toFixed(2);
          const a = (0.15 + rnd() * (alphaMax - 0.15)).toFixed(3);
          html +=
            "<span class='mote' style='left:" +
            x +
            "%;top:" +
            y +
            "%;width:" +
            s +
            "px;height:" +
            s +
            "px;opacity:" +
            a +
            "'></span>";
        }
        el.innerHTML = html;
      }

      seedDust(document.querySelector("#dustFar"), 150, 20260816, 1.2, 2.6, 0.5);
      seedDust(document.querySelector("#dustNear"), 90, 71177, 2.0, 4.2, 0.8);

      /* ---- chromatic-split shimmer driver (GSAP-only, no CSS transition) ---- */
      const numeralEl = document.querySelector("#numeral");
      const BASE_FILTER =
        "drop-shadow(0 8px 20px rgba(0,0,0,0.6)) drop-shadow(0 0 34px rgba(214,46,31,0.28))";
      const chroma = { k: 0 };
      function applyChroma() {
        const k = chroma.k;
        if (k <= 0.0001) {
          numeralEl.style.filter = BASE_FILTER;
          return;
        }
        const dx = (14 * k).toFixed(2);
        numeralEl.style.filter =
          BASE_FILTER +
          " drop-shadow(" +
          -dx +
          "px 0 0 rgba(255,42,42," +
          (0.75 * k).toFixed(3) +
          ")) drop-shadow(" +
          dx +
          "px 0 0 rgba(42,255,255," +
          (0.75 * k).toFixed(3) +
          "))";
      }
      numeralEl.style.filter = BASE_FILTER;

      /* ---- specular sweep: move the top background band across the glyphs ---- */
      const spec = { x: -680 };
      function applySpec() {
        numeralEl.style.backgroundPosition = spec.x.toFixed(1) + "px 0px, 0px 0px, 0px 0px";
      }
      applySpec();

      /* ---- master timeline (no default ease; every tween eased explicitly) ---- */
      const tl = gsap.timeline({ paused: true });

      gsap.set("#flood", { opacity: 0, scale: 0.2 });
      gsap.set("#coreGlow", { opacity: 0, scale: 0.6 });

      // 0–450ms : red flood washes out from behind the numeral (expo.out)
      tl.to("#flood", { opacity: 1, duration: 0.45, ease: "expo.out" }, 0);
      tl.to("#flood", { scale: 1.4, duration: 0.45, ease: "expo.out" }, 0);
      // locked red bloom core settles in over the same window
      tl.to("#coreGlow", { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 0);

      // 300–500ms : specular flare sweeps the metal once (band tracks the glyphs)
      tl.to(
        spec,
        { x: 1560, duration: 0.2, ease: "power2.inOut", onUpdate: applySpec },
        0.3,
      );

      // 320–500ms : one 180ms chromatic-split RGB shimmer (proxy-driven onUpdate)
      tl.to(
        chroma,
        { k: 1, duration: 0.09, ease: "power2.in", onUpdate: applyChroma, overwrite: "auto" },
        0.32,
      );
      tl.to(
        chroma,
        { k: 0, duration: 0.09, ease: "power2.out", onUpdate: applyChroma, overwrite: "auto" },
        0.41,
      );

      // 0–3000ms : z1 dust drifts continuously (only motion during the hard settle)
      tl.to("#dustFar", { xPercent: 1.6, yPercent: -1.1, duration: 3, ease: "none" }, 0);
      tl.to("#dustNear", { xPercent: -2.4, yPercent: 1.8, duration: 3, ease: "none" }, 0);

      // total length lock = 3.0s (72 frames @ 24fps)
      tl.to({}, { duration: 3, ease: "none" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
