<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Oxblood Collapse — –$15,000,000,000 On Paper</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/anton.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0b0b0c; /* near-black ground */
        --ox: #7a160e; /* deep oxblood — the ONE accent */
        --ox-dim: #4d0f0a;
        --ash: #3a3a3e; /* ash-graphite — grid + label */
        --bone: #ede8dd; /* warm-bone type */
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: "Oswald", sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(140% 120% at 46% 30%, #131315 0%, #0d0d0e 40%, var(--ground) 78%);
      }

      /* ---- push-in wrapper (whole scene scales) ---- */
      #pushwrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 62%;
        will-change: transform;
      }

      /* ---- scene (gets the faint downward tracking drift) ---- */
      #scene {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      /* ---- baseline grid (ash-graphite) ---- */
      #grid {
        position: absolute;
        inset: 0;
      }
      #grid line {
        stroke: var(--ash);
        stroke-width: 1;
        opacity: 0.34;
      }
      #grid line.floor {
        stroke: var(--ash);
        stroke-width: 2;
        opacity: 0.62;
      }

      /* ---- the plunging oxblood line chart ---- */
      #chart {
        position: absolute;
        inset: 0;
      }
      #fall {
        fill: none;
        stroke: var(--ox);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 10px rgba(122, 22, 14, 0.55));
      }
      #fallGlow {
        fill: none;
        stroke: var(--ox);
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.22;
        filter: blur(6px);
      }
      #endDot {
        fill: var(--ox);
        filter: drop-shadow(0 0 12px rgba(122, 22, 14, 0.9));
      }

      /* ---- hero block (number + label), anchored at endpoint ---- */
      #hero {
        position: absolute;
        left: 50%;
        top: 660px;
        width: 1728px; /* inner 90% title-safe */
        text-align: center;
        will-change: transform, filter, opacity;
      }

      #label {
        font-family: "Oswald", sans-serif;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        font-variant: small-caps;
        color: var(--ash);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* the number lock-up: rim copy behind, bone face on top */
      #numlock {
        position: relative;
        margin-top: 12px;
        height: 220px;
      }

      .num {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        font-family: "Anton", "Oswald", sans-serif;
        font-weight: 400;
        font-size: 210px;
        line-height: 1;
        letter-spacing: -0.005em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        transform: scaleX(0.86); /* extra-condensed squeeze */
        transform-origin: 50% 50%;
      }

      /* oxblood emissive rim — offset UP-RIGHT so only the top-right edge
         peeks out from behind the bone face (rim on ONE edge only) */
      #numRim {
        color: var(--ox);
        /* directional emissive rim — glow thrown UP-RIGHT only, so the
           oxblood reads as a lit edge on the top-right, never a symmetric halo */
        text-shadow:
          2px -2px 3px rgba(122, 22, 14, 0.95),
          5px -4px 10px rgba(122, 22, 14, 0.55),
          8px -6px 16px rgba(122, 22, 14, 0.3);
        transform: scaleX(0.86) translate(7px, -6px);
        opacity: 0;
        will-change: opacity;
      }

      /* bone face — one hard key light upper-left + down-right extrusion + contact shadow */
      #numFace {
        color: var(--bone);
        text-shadow:
          /* key highlight, upper-left */
          -2px -2px 0 rgba(255, 252, 245, 0.35),
          -1px -1px 0 rgba(255, 252, 245, 0.25),
          /* extruded body, down-right, progressively darker */
          1px 1px 0 #b7b0a4,
          2px 2px 0 #8f887d,
          3px 3px 0 #6d6659,
          4px 4px 0 #514b40,
          5px 6px 0 #3a352c,
          6px 8px 0 #2a271f,
          7px 10px 0 #1d1b15,
          8px 12px 0 #131210,
          /* deep contact shadow on the floor */
          10px 20px 26px rgba(0, 0, 0, 0.72),
          0 30px 40px rgba(0, 0, 0, 0.55);
      }

      /* ---- ambient oxblood dust ---- */
      #dust,
      #puff {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mote {
        position: absolute;
        border-radius: 50%;
        background: var(--ox);
        will-change: transform, opacity;
      }
      .puffp {
        position: absolute;
        border-radius: 50%;
        background: var(--ox);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ---- grade layers ---- */
      #grain {
        position: absolute;
        inset: -4%;
        pointer-events: none;
        opacity: 0.06;
        mix-blend-mode: overlay;
        will-change: transform;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.9) 0.5px, transparent 0.6px),
          radial-gradient(rgba(0, 0, 0, 0.9) 0.5px, transparent 0.6px);
        background-size: 3px 3px, 4px 4px;
        background-position: 0 0, 1px 2px;
      }
      /* subtle edge chromatic aberration */
      #ca {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.5;
        background:
          radial-gradient(120% 100% at 49.4% 50%, rgba(255, 0, 0, 0) 74%, rgba(255, 0, 40, 0.06) 100%),
          radial-gradient(120% 100% at 50.6% 50%, rgba(0, 200, 255, 0) 74%, rgba(0, 160, 255, 0.06) 100%);
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(76% 68% at 50% 52%, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, 0.86) 100%);
      }
      /* 2.35:1 letterbox inside the 16:9 frame */
      .bar {
        position: absolute;
        left: 0;
        width: 1920px;
        height: 132px;
        background: #000;
        pointer-events: none;
        z-index: 40;
      }
      .bar.top {
        top: 0;
      }
      .bar.bot {
        bottom: 0;
      }
      /* clean fall-off into the next shot */
      #fadeout {
        position: absolute;
        inset: 0;
        background: var(--ground);
        opacity: 0;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="pushwrap">
          <div id="scene">
            <!-- baseline grid -->
            <svg id="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" data-layout-allow-overflow>
              <!-- vertical grid -->
              <line x1="160" y1="132" x2="160" y2="948" />
              <line x1="380" y1="132" x2="380" y2="948" />
              <line x1="600" y1="132" x2="600" y2="948" />
              <line x1="820" y1="132" x2="820" y2="948" />
              <line x1="1040" y1="132" x2="1040" y2="948" />
              <line x1="1260" y1="132" x2="1260" y2="948" />
              <line x1="1480" y1="132" x2="1480" y2="948" />
              <line x1="1700" y1="132" x2="1700" y2="948" />
              <!-- horizontal grid -->
              <line x1="120" y1="250" x2="1800" y2="250" />
              <line x1="120" y1="370" x2="1800" y2="370" />
              <line x1="120" y1="490" x2="1800" y2="490" />
              <!-- the floor -->
              <line class="floor" x1="120" y1="588" x2="1800" y2="588" />
            </svg>

            <!-- plunging oxblood line -->
            <svg id="chart" viewBox="0 0 1920 1080" data-layout-allow-overflow>
              <path id="fallGlow" d="M 168 232 L 372 286 L 560 270 L 742 348 L 902 452 L 1030 590 L 1108 700 L 1150 782" />
              <path id="fall" d="M 168 232 L 372 286 L 560 270 L 742 348 L 902 452 L 1030 590 L 1108 700 L 1150 782" />
              <circle id="endDot" cx="1150" cy="782" r="9" />
            </svg>

            <!-- hero lock-up -->
            <div id="hero" data-layout-allow-overflow data-layout-allow-occlusion>
              <div id="label" data-layout-ignore>On Paper</div>
              <div id="numlock" data-layout-allow-overflow data-layout-allow-overlap>
                <div id="numRim" class="num" aria-hidden="true" data-layout-ignore>–$15,000,000,000</div>
                <div id="numFace" class="num">–$15,000,000,000</div>
              </div>
            </div>

            <!-- ambient dust + impact puff -->
            <div id="dust" data-layout-allow-overflow></div>
            <div id="puff" data-layout-allow-overflow></div>
          </div>
        </div>

        <!-- grade -->
        <div id="grain"></div>
        <div id="ca"></div>
        <div class="vignette"></div>
        <div class="bar top"></div>
        <div class="bar bot"></div>
        <div id="fadeout"></div>
      </section>

      <audio
        id="score"
        data-start="0"
        data-duration="4"
        data-track-index="2"
        src="assets/collapse.wav"
        data-volume="0.95"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---------- deterministic RNG (mulberry32) ---------- */
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(0x0b100d);

      /* ---------- ambient dust motes ---------- */
      const dustEl = document.querySelector("#dust");
      const NUM_MOTES = 48;
      const motes = [];
      for (let i = 0; i < NUM_MOTES; i++) {
        const m = document.createElement("div");
        m.className = "mote";
        const size = 2 + rand() * 5;
        const x = rand() * 1920;
        const y = 132 + rand() * 816;
        m.style.width = size + "px";
        m.style.height = size + "px";
        m.style.left = x + "px";
        m.style.top = y + "px";
        m.style.opacity = String(0.12 + rand() * 0.4);
        dustEl.appendChild(m);
        motes.push({
          el: m,
          amp: 14 + rand() * 46, // lateral drift amplitude
          dur: 2.2 + rand() * 2.6, // seconds per half-cycle-ish
          phase: rand() * 2, // seed phase
          rise: 6 + rand() * 22, // vertical breath
          dir: rand() < 0.5 ? -1 : 1,
        });
      }

      /* ---------- impact puff at the endpoint ---------- */
      const puffEl = document.querySelector("#puff");
      const EX = 1150,
        EY = 782;
      const NUM_PUFF = 16;
      const puffs = [];
      for (let i = 0; i < NUM_PUFF; i++) {
        const p = document.createElement("div");
        p.className = "puffp";
        const size = 3 + rand() * 6;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = EX + "px";
        p.style.top = EY + "px";
        puffEl.appendChild(p);
        const ang = rand() * Math.PI * 2;
        const dist = 40 + rand() * 130;
        puffs.push({
          el: p,
          dx: Math.cos(ang) * dist,
          dy: Math.sin(ang) * dist * 0.7 - 20, // biased upward off the floor
        });
      }

      /* ---------- line-draw setup (stroke-dashoffset) ---------- */
      const fall = document.querySelector("#fall");
      const fallGlow = document.querySelector("#fallGlow");
      [fall, fallGlow].forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* ---------- DOF proxy (blur is the mechanism) ---------- */
      const heroEl = document.querySelector("#hero");
      const dof = { v: 10 };
      const applyDof = () => {
        heroEl.style.filter = "blur(" + dof.v.toFixed(3) + "px)";
      };
      applyDof();

      /* ---------- initial states ---------- */
      gsap.set("#hero", { xPercent: -50, opacity: 0.4 });
      gsap.set("#endDot", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set("#label", { opacity: 0, y: 6 });
      gsap.set("#numRim", { opacity: 0 });
      gsap.set("#pushwrap", { scale: 1.0 });
      gsap.set("#scene", { y: 0 });

      /* =====================================================================
         MASTER TIMELINE — 4.0s / 96 frames @ 24fps
         ===================================================================== */
      const tl = gsap.timeline({ paused: true });

      /* ---- 0 – 1.4s  THE FALL (f0–34) ---- */
      // line draws downward, gentle start → accelerating plunge
      tl.to([fall, fallGlow], { strokeDashoffset: 0, duration: 1.4, ease: "power2.in" }, 0);
      // slow stage push-in 1.00 → 1.03
      tl.to("#pushwrap", { scale: 1.03, duration: 1.4, ease: "sine.inOut" }, 0);
      // faint downward tracking drift on the whole scene (2px)
      tl.to("#scene", { y: 2, duration: 1.4, ease: "sine.inOut" }, 0);

      /* ---- 1.4 – 1.65s  LANDING / IMPACT (f34–40) — the sync frame ---- */
      // (1) line contact settle: 5px overshoot down-then-up on back.out
      tl.to("#scene", { y: 7, duration: 0.06, ease: "power2.out" }, 1.4);
      tl.to("#scene", { y: 2, duration: 0.2, ease: "back.out(3)" }, 1.46);
      // endpoint dot pops
      tl.to("#endDot", { scale: 1, duration: 0.12, ease: "back.out(4)" }, 1.4);
      // (2) numeral opacity snaps 0.4 → 1
      tl.to("#hero", { opacity: 1, duration: 0.12, ease: "power2.out" }, 1.4);
      // (3) DOF racks 10px → razor sharp on power2.out
      tl.to(dof, { v: 0, duration: 0.25, ease: "power2.out", onUpdate: applyDof }, 1.4);
      // (4) oxblood rim blooms 0 → full on expo.out
      tl.to("#numRim", { opacity: 1, duration: 0.25, ease: "expo.out" }, 1.4);
      // (5) dust-puff kicks at the endpoint on power2.out
      puffs.forEach((p) => {
        tl.set(p.el, { opacity: 0.9 }, 1.4);
        tl.to(p.el, { x: p.dx, y: p.dy, scale: 0.2, duration: 0.55, ease: "power2.out" }, 1.4);
        tl.to(p.el, { opacity: 0, duration: 0.5, ease: "power2.out" }, 1.5);
      });

      /* ---- 1.65 – 2.3s  "ON PAPER" resolves (f40–55) ---- */
      tl.to("#label", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.65);

      /* ---- 2.3 – 3.8s  SUSTAINED MOTION (f55–91) ---- */
      // push-in continues 1.03 → 1.08
      tl.to("#pushwrap", { scale: 1.08, duration: 1.5, ease: "sine.inOut" }, 2.3);
      // oxblood rim one slow opacity breath 0.85 → 0.70 → 0.85
      tl.to("#numRim", { opacity: 0.7, duration: 0.75, ease: "sine.inOut" }, 2.3);
      tl.to("#numRim", { opacity: 0.85, duration: 0.75, ease: "sine.inOut" }, 3.05);

      /* ---- 3.8 – 4.0s  EXIT (f91–96) ---- */
      // hold locked; fast fall-off toward #0B0B0C on the final 4 frames (f92→96)
      tl.to("#fadeout", { opacity: 0.92, duration: 0.167, ease: "power2.in" }, 3.833);

      /* ---------- CONTINUOUS: ambient dust drift (whole timeline, eased) ----------
         Finite yoyo repeats sized to span the full 4s window (a keeps the
         timeline duration finite so deterministic seeking stays exact).
         Seeded start point + direction spread the phases without a delay,
         so motion is alive from f0. */
      motes.forEach((m) => {
        const reps = Math.ceil(4 / m.dur) + 2;
        const pf = m.phase / 2; // 0..1 seeded phase fraction
        tl.fromTo(
          m.el,
          { x: m.dir * m.amp * (2 * pf - 1), y: -m.rise * pf },
          {
            x: m.dir * m.amp,
            y: -m.rise,
            duration: m.dur,
            ease: "sine.inOut",
            yoyo: true,
            repeat: reps,
          },
          0,
        );
      });

      /* ---------- CONTINUOUS: moving film grain (subtle transform jitter) ---------- */
      tl.to("#grain", { x: 3, y: -2, duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0);
      tl.to("#grain", { rotation: 0.4, duration: 0.19, ease: "sine.inOut", yoyo: true, repeat: 22 }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
