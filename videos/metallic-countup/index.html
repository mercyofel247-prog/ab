<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>$50,000,000,000 — "Gone." Count-Up</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/anton.ttf") format("truetype");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* cool silver brushed-metal ramp — no hue, only luminance */
        --steel-top: #ffffff;
        --steel-hi: #eef1f4;
        --steel-mid: #b9c0c8;
        --steel-lo: #6e767f;
        --steel-shadow: #454b52;
        --red: #ff2a2a;
        --red-dim: #b31212;
      }

      /* standalone cold-open clip — opaque black, not a compositing overlay */
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      .center {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* constant fit-scale so the final numeral fills ~70% of frame width */
      .fit {
        transform: scale(1);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* inline-block: width tracks the number, so glow/label can center under it */
      .stack {
        display: inline-block;
        position: relative;
        text-align: center;
      }

      /* soft red pool of light beneath the whole stack — the "underglow" */
      .underglow {
        position: absolute;
        left: 50%;
        bottom: -70px;
        width: 130%;
        height: 260px;
        transform: translateX(-50%) scale(0.85);
        transform-origin: 50% 50%;
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          var(--red) 0%,
          var(--red-dim) 45%,
          transparent 72%
        );
        filter: blur(40px);
        opacity: 0;
        z-index: 0;
      }

      .amount {
        position: relative;
        z-index: 1;
        display: block;
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 260px;
        line-height: 0.92;
        letter-spacing: 0.005em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-align: center;

        /* brushed-silver faces via vertical luminance gradient + bevel band */
        background: linear-gradient(
          177deg,
          var(--steel-top) 0%,
          var(--steel-hi) 20%,
          var(--steel-mid) 44%,
          var(--steel-lo) 52%,
          var(--steel-hi) 60%,
          var(--steel-mid) 82%,
          var(--steel-shadow) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;

        /* subtle emboss/bevel on the faces + soft grounding shadow for compositing */
        filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.28))
          drop-shadow(0 -1px 0 rgba(0, 0, 0, 0.35)) drop-shadow(0 14px 26px rgba(0, 0, 0, 0.35));
        will-change: transform, filter;
      }

      /* comma separators — same cool metal, a touch dimmer than the digits */
      .amount .comma {
        background: linear-gradient(177deg, #c7ccd2 0%, #9aa1a9 46%, #5c636b 54%, #8b929a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        opacity: 0.72;
      }

      .gone {
        position: relative;
        z-index: 1;
        margin-top: 34px;
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 92px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        color: var(--red);
        text-shadow:
          0 0 24px rgba(255, 42, 42, 0.65),
          0 4px 10px rgba(0, 0, 0, 0.6);
        will-change: transform, opacity, filter;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="center">
          <div class="fit" id="fit">
            <div class="stack" id="stack">
              <div class="underglow" id="underglow" data-layout-allow-overflow></div>
              <div class="amount" id="amount" data-layout-allow-overflow>$0</div>
              <div class="gone" id="gone" data-layout-allow-overflow>Gone.</div>
            </div>
          </div>
        </div>
      </section>

      <audio
        id="countup-audio"
        data-start="0"
        data-duration="3"
        data-track-index="2"
        src="assets/countup-audio.mp3"
        data-volume="0.95"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const amountEl = document.querySelector("#amount");
      const fitEl = document.querySelector("#fit");
      const stackEl = document.querySelector("#stack");
      const underglowEl = document.querySelector("#underglow");
      const goneEl = document.querySelector("#gone");

      const TARGET = 50000000000; // $50,000,000,000
      const TARGET_STR = formatMoney(TARGET);
      const FIT_WIDTH = 1920 * 0.7; // numeral occupies ~70% of frame width

      const DROP_SHADOWS =
        "drop-shadow(0 2px 0 rgba(255, 255, 255, 0.28)) drop-shadow(0 -1px 0 rgba(0, 0, 0, 0.35)) drop-shadow(0 14px 26px rgba(0, 0, 0, 0.35))";

      // Deterministic formatting: group with commas, wrap commas so they render dimmer.
      function formatMoney(n) {
        const grouped = Math.floor(n).toLocaleString("en-US");
        return "$" + grouped.replace(/,/g, '<span class="comma">,</span>');
      }

      function renderCount(v) {
        const bounded = Math.max(0, Math.min(TARGET, v));
        amountEl.innerHTML = formatMoney(bounded);
      }

      function applyBlur(px) {
        amountEl.style.filter = px > 0.05 ? `blur(${px}px) ${DROP_SHADOWS}` : DROP_SHADOWS;
      }

      function applyGoneBlur(px) {
        goneEl.style.filter = px > 0.05 ? `blur(${px}px)` : "";
      }

      // Lock the fit-scale to the FINAL string so the numeral never resizes mid-count.
      function applyFit() {
        const prev = amountEl.innerHTML;
        amountEl.innerHTML = TARGET_STR;
        const natural = stackEl.getBoundingClientRect().width; // #fit is scale(1) here
        amountEl.innerHTML = prev;
        if (natural > 0) {
          fitEl.style.transform = "scale(" + FIT_WIDTH / natural + ")";
          return true;
        }
        return false;
      }

      // Measure only once Anton's real metrics are available. Gated on the GSAP
      // ticker (not raw rAF) so it stays in sync with frame capture: in the
      // renderer fonts are ready on the first tick; live preview retries until
      // Anton loads. Fully deterministic — no Math.random, no wall-clock timing.
      let fitted = false;
      function tryFit() {
        if (fitted) return;
        const fontReady = document.fonts && document.fonts.check('260px "Anton"');
        if (fontReady && applyFit()) {
          fitted = true;
          gsap.ticker.remove(tryFit);
        }
      }
      gsap.ticker.add(tryFit);
      tryFit();
      renderCount(0);
      applyBlur(0);

      // ---- Timeline -----------------------------------------------------------
      const tl = gsap.timeline({ paused: true });

      const FADE_START = 0.1;
      const FADE_DUR = 0.2;
      const COUNT_START = 0.1;
      const COUNT_DUR = 2.0;
      const COUNT_EASE = "expo.in"; // slow start, jets to the final value
      const LOCK_T = COUNT_START + COUNT_DUR; // 2.1s

      // initial states — everything animates in, no entrance jump cuts, no
      // duplicate/echo of the number: it counts up from a truly empty frame.
      gsap.set("#amount", { opacity: 0 });
      gsap.set("#underglow", { opacity: 0, scale: 0.85 });
      gsap.set("#gone", { opacity: 0, x: 0, scale: 1 });
      applyGoneBlur(0);

      // 1) OPEN on black — numeral fades up from nothing as the count begins.
      tl.to("#amount", { opacity: 1, duration: FADE_DUR, ease: "power1.out" }, FADE_START);

      // 2) Count-up: ease-in-expo (slow, then jets to the final value). Motion
      //    blur is derived analytically from the ease's instantaneous slope, so
      //    it is correct for any seek time (snapshot-safe) and always resolves
      //    to exactly 0 at the lock frame instead of lingering.
      const easeFn = gsap.parseEase(COUNT_EASE);
      const BLUR_SCALE = 2.4;
      const MAX_BLUR = 22;
      function velocityAt(u) {
        const du = 0.004;
        const lo = Math.max(0, u - du);
        const hi = Math.min(1, u + du);
        return (easeFn(hi) - easeFn(lo)) / (hi - lo);
      }

      const count = { v: 0 };
      tl.to(
        count,
        {
          v: TARGET,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            renderCount(count.v);
            const u = gsap.utils.clamp(0, 1, (tl.time() - COUNT_START) / COUNT_DUR);
            const blurPx = u >= 1 ? 0 : Math.min(MAX_BLUR, velocityAt(u) * BLUR_SCALE);
            applyBlur(blurPx);
          },
          onComplete: () => {
            renderCount(TARGET);
            applyBlur(0);
          },
        },
        COUNT_START,
      );

      // 3) LOCK — the underglow ignites (bloom slightly past peak, then settles)
      //    and one subtle overshoot-settle bumps the numeral as it lands.
      const GLOW_PEAK = 0.4;
      const GLOW_OVERSHOOT = 0.46;
      tl.fromTo(
        "#underglow",
        { opacity: 0, scale: 0.85 },
        { opacity: GLOW_OVERSHOOT, scale: 1.04, duration: 0.16, ease: "power2.out" },
        LOCK_T,
      );
      tl.to("#underglow", { opacity: GLOW_PEAK, scale: 1.0, duration: 0.32, ease: "sine.out" }, LOCK_T + 0.16);

      tl.fromTo(
        "#amount",
        { scale: 1.055 },
        { scale: 1.0, duration: 0.42, ease: "back.out(1.25)" },
        LOCK_T,
      );

      // 4) "Gone." swoops in from the side with a zoom, landing exactly on the
      //    same beat as the lock/slam — one unified impact, not a beat late.
      //    Motion blur seeds at peak and resolves to 0 on arrival (same
      //    window/ease as the move), per the entrance-blur recipe.
      const GONE_ENTER_DUR = 0.34;
      const GONE_ENTER_START = LOCK_T - GONE_ENTER_DUR; // arrival == LOCK_T
      const GONE_SIDE_X = 820; // enters from off-frame right
      const GONE_START_SCALE = 0.5; // zooms in toward full size
      const GONE_PEAK_BLUR = 16;
      const GONE_EASE = "expo.out";

      gsap.set("#gone", { x: GONE_SIDE_X, scale: GONE_START_SCALE });
      applyGoneBlur(GONE_PEAK_BLUR);

      tl.to("#gone", { opacity: 1, duration: GONE_ENTER_DUR * 0.4, ease: "power1.out" }, GONE_ENTER_START);
      tl.fromTo(
        "#gone",
        { x: GONE_SIDE_X, scale: GONE_START_SCALE },
        { x: 0, scale: 1, duration: GONE_ENTER_DUR, ease: GONE_EASE },
        GONE_ENTER_START,
      );
      const goneBlur = { v: GONE_PEAK_BLUR };
      tl.to(
        goneBlur,
        {
          v: 0,
          duration: GONE_ENTER_DUR,
          ease: GONE_EASE,
          onUpdate: () => applyGoneBlur(goneBlur.v),
        },
        GONE_ENTER_START,
      );

      // 5) HOLD with micro-life — one bounded glow breath, no ongoing loop.
      const HOLD_BREATH_START = LOCK_T + 0.42;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI,
          duration: 0.42,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            underglowEl.style.opacity = String(GLOW_PEAK + s * 0.07);
          },
        },
        HOLD_BREATH_START,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
