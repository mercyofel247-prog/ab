<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Impact Reveal — $200B</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --black: #030404;
        --cyan-deep: #003b42;
        --cyan-lo: #00626e;
        --cyan: #12dcff;
        --cyan-hi: #7cf3ff;
        --lemon-top: #f4ffb0;
        --gold: #ffd166;
        --gold-hi: #fff1c6;
        --gold-deep: #a97318;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--black);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, -apple-system, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--black);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(70% 62% at 50% 50%, rgba(18, 220, 255, 0.13) 0%, rgba(0, 0, 0, 0) 55%),
          radial-gradient(120% 100% at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.7) 100%);
      }

      .flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(46% 42% at 50% 50%, rgba(255, 236, 190, 0.95) 0%, rgba(255, 209, 102, 0.35) 42%, rgba(255, 209, 102, 0) 72%);
        opacity: 0;
        pointer-events: none;
      }

      .ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 360px;
        height: 360px;
        margin: -180px 0 0 -180px;
        border-radius: 50%;
        border: 3px solid var(--gold);
        box-shadow: 0 0 30px rgba(255, 209, 102, 0.55);
        opacity: 0;
        transform: scale(0.4);
        pointer-events: none;
      }

      .perspective-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1900px;
        perspective-origin: 50% 50%;
      }

      .rotator {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .glyphs {
        position: relative;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 2px;
        font-size: 236px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .glyph {
        display: inline-block;
        background: linear-gradient(
          180deg,
          var(--lemon-top) 0%,
          var(--cyan-hi) 26%,
          var(--cyan) 52%,
          var(--cyan-lo) 78%,
          var(--cyan-deep) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        will-change: transform, filter;
      }

      .glyph[data-glyph="dollar"] {
        margin-right: 6px;
      }

      .glyph[data-glyph="b"] {
        margin-left: 8px;
      }

      .sheen {
        position: absolute;
        top: -20%;
        bottom: -20%;
        width: 260px;
        left: 50%;
        margin-left: -130px;
        background: linear-gradient(
          100deg,
          rgba(255, 241, 198, 0) 0%,
          rgba(255, 241, 198, 0.06) 42%,
          rgba(255, 241, 198, 0.5) 50%,
          rgba(255, 241, 198, 0.06) 58%,
          rgba(255, 241, 198, 0) 100%
        );
        mix-blend-mode: overlay;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="6.2" data-track-index="1">
        <div class="vignette"></div>

        <div class="perspective-wrap">
          <div id="rotator" class="rotator">
            <div id="glyphs" class="glyphs">
              <span class="glyph" data-glyph="dollar" data-layout-allow-overflow>$</span>
              <span class="glyph" data-glyph="two" data-layout-allow-overflow>2</span>
              <span class="glyph" data-glyph="zero1" data-layout-allow-overflow>0</span>
              <span class="glyph" data-glyph="zero2" data-layout-allow-overflow>0</span>
              <span class="glyph" data-glyph="b" data-layout-allow-overflow>B</span>
            </div>
          </div>
        </div>

        <div id="ring1" class="ring"></div>
        <div id="ring2" class="ring"></div>
        <div id="flash" class="flash"></div>
        <div id="sheen" class="sheen" data-layout-allow-overflow></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const glyphEls = {
        dollar: document.querySelector('[data-glyph="dollar"]'),
        two: document.querySelector('[data-glyph="two"]'),
        zero1: document.querySelector('[data-glyph="zero1"]'),
        zero2: document.querySelector('[data-glyph="zero2"]'),
        b: document.querySelector('[data-glyph="b"]'),
      };

      // Each glyph flies in from a distinct compass direction — the "multiple
      // directions" convergence read that sells the collision at IMPACT.
      const entries = {
        dollar: { x: -1560, y: 40, rot: -26 }, // from far left
        two: { x: -20, y: -820, rot: 16 }, // from top
        zero1: { x: 10, y: 820, rot: -14 }, // from bottom
        zero2: { x: 1560, y: -30, rot: 22 }, // from far right
        b: { x: 1180, y: -720, rot: -20 }, // from top-right diagonal
      };

      gsap.set(Object.values(glyphEls), { opacity: 0 });
      for (const key in entries) {
        const e = entries[key];
        gsap.set(glyphEls[key], { x: e.x, y: e.y, rotation: e.rot, filter: "blur(20px)" });
      }
      gsap.set("#rotator", { rotationX: 0, transformPerspective: 1900 });
      gsap.set(".glyphs", { filter: "brightness(1) drop-shadow(0 0 0 rgba(255,209,102,0))" });

      const IMPACT = 0.98;

      const tl = gsap.timeline({ paused: true });

      // ---- Phase 1: multi-direction fly-in, decelerating into a shared landing
      for (const key in entries) {
        const el = glyphEls[key];
        tl.set(el, { opacity: 1 }, 0);
        tl.to(el, { x: 0, y: 0, rotation: 0, duration: IMPACT, ease: "power3.out" }, 0);
        tl.to(el, { filter: "blur(0px)", duration: IMPACT * 0.82, ease: "power1.in" }, 0);
      }

      // ---- Phase 2: IMPACT — flash, shockwave rings, camera shake, punch scale
      tl.set("#flash", { opacity: 0 }, IMPACT - 0.01);
      tl.to("#flash", { opacity: 1, duration: 0.05, ease: "none" }, IMPACT);
      tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, IMPACT + 0.05);

      tl.set(["#ring1", "#ring2"], { opacity: 0, scale: 0.4 }, IMPACT - 0.01);
      tl.set("#ring1", { opacity: 0.9, scale: 1 }, IMPACT);
      tl.to("#ring1", { opacity: 0, scale: 2.6, duration: 0.55, ease: "power2.out" }, IMPACT);
      tl.set("#ring2", { opacity: 0.7, scale: 1 }, IMPACT + 0.06);
      tl.to("#ring2", { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.out" }, IMPACT + 0.06);

      tl.to(".glyphs", { scale: 1.1, duration: 0.08, ease: "power2.out" }, IMPACT);
      tl.to(".glyphs", { scale: 1, duration: 0.24, ease: "back.out(3)" }, IMPACT + 0.08);

      // small handheld-style shake on the whole stage
      const shakeAt = IMPACT;
      tl.to("#stage", { x: -16, y: 10, duration: 0.035, ease: "none" }, shakeAt);
      tl.to("#stage", { x: 14, y: -8, duration: 0.035, ease: "none" }, shakeAt + 0.035);
      tl.to("#stage", { x: -9, y: 6, duration: 0.035, ease: "none" }, shakeAt + 0.07);
      tl.to("#stage", { x: 5, y: -3, duration: 0.035, ease: "none" }, shakeAt + 0.105);
      tl.to("#stage", { x: 0, y: 0, duration: 0.05, ease: "power2.out" }, shakeAt + 0.14);

      // golden glow ignites on impact and holds
      tl.to(
        ".glyphs",
        {
          filter:
            "brightness(1.06) drop-shadow(0 0 14px rgba(255,209,102,0.85)) drop-shadow(0 0 46px rgba(255,209,102,0.55)) drop-shadow(0 14px 30px rgba(0,0,0,0.6))",
          duration: 0.35,
          ease: "power2.out",
        },
        IMPACT,
      );

      // ---- Phase 3: hold, readable, glow settled
      const HOLD_END = 1.95;

      // ---- Phase 4: full 3D rotation on the X axis
      const ROT_START = HOLD_END;
      const ROT_DUR = 1.85;
      const ROT_END = ROT_START + ROT_DUR;

      const rotDriver = { deg: 0 };
      tl.to(
        rotDriver,
        {
          deg: 360,
          duration: ROT_DUR,
          ease: "power1.inOut",
          onUpdate: () => {
            const rad = (rotDriver.deg * Math.PI) / 180;
            gsap.set("#rotator", { rotationX: rotDriver.deg });
            // specular light sweeps + brightness dips as the plane turns edge-on
            const facing = Math.abs(Math.cos(rad));
            const brightness = 0.5 + 0.55 * facing;
            const glow = 0.3 + 0.6 * facing;
            gsap.set(".glyphs", {
              filter: `brightness(${brightness.toFixed(3)}) drop-shadow(0 0 ${(10 + 14 * facing).toFixed(1)}px rgba(255,209,102,${(0.5 * glow).toFixed(3)})) drop-shadow(0 0 ${(30 + 30 * facing).toFixed(1)}px rgba(255,209,102,${(0.5 * glow).toFixed(3)})) drop-shadow(0 14px 30px rgba(0,0,0,0.6))`,
            });
            gsap.set("#sheen", {
              opacity: 1 - facing,
              x: (rotDriver.deg / 360) * 900 - 450,
            });
          },
        },
        ROT_START,
      );

      // settle overshoot + snap on the final stop — the "mechanical" landing
      tl.to("#rotator", { rotationX: 372, duration: 0.12, ease: "power2.out", overwrite: "auto" }, ROT_END - 0.02);
      tl.to("#rotator", { rotationX: 360, duration: 0.32, ease: "back.out(2.4)", overwrite: "auto" }, ROT_END + 0.1);
      tl.to(
        ".glyphs",
        {
          filter:
            "brightness(1.06) drop-shadow(0 0 14px rgba(255,209,102,0.85)) drop-shadow(0 0 46px rgba(255,209,102,0.55)) drop-shadow(0 14px 30px rgba(0,0,0,0.6))",
          duration: 0.3,
          ease: "power2.out",
          overwrite: "auto",
        },
        ROT_END + 0.02,
      );
      tl.set("#sheen", { opacity: 0 }, ROT_END + 0.02);

      // ---- Phase 5: final hold with a slow ambient glow breathe
      const FINAL_START = ROT_END + 0.5;
      tl.to(
        ".glyphs",
        {
          filter:
            "brightness(1.14) drop-shadow(0 0 20px rgba(255,209,102,1)) drop-shadow(0 0 62px rgba(255,209,102,0.75)) drop-shadow(0 14px 30px rgba(0,0,0,0.6))",
          duration: 0.7,
          ease: "sine.inOut",
        },
        FINAL_START,
      );
      tl.to(
        ".glyphs",
        {
          filter:
            "brightness(1.04) drop-shadow(0 0 12px rgba(255,209,102,0.7)) drop-shadow(0 0 42px rgba(255,209,102,0.5)) drop-shadow(0 14px 30px rgba(0,0,0,0.6))",
          duration: 0.7,
          ease: "sine.inOut",
        },
        FINAL_START + 0.7,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
