<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sleep Recharge — a nightly battery charge</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --night-deep: #0a0e24;
        --night-mid: #161c3f;
        --dawn-gold: #ffcf8a;
        --dawn-pink: #ff9d81;
        --dawn-blue: #6d7fc2;
        --low: #ef4b3f;
        --mid: #f5b342;
        --full: #35d488;
        --ink: #f4f6ff;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night-deep);
      }

      body {
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night-deep);
      }

      /* ---- sky ---- */
      #sky-night,
      #sky-dawn {
        position: absolute;
        inset: 0;
      }
      #sky-night {
        background: radial-gradient(120% 90% at 50% 30%, var(--night-mid) 0%, var(--night-deep) 65%, #050712 100%);
      }
      #sky-dawn {
        background: linear-gradient(180deg, #2b3170 0%, var(--dawn-blue) 32%, var(--dawn-pink) 62%, var(--dawn-gold) 100%);
        opacity: 0;
      }

      .grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
        background-size: 72px 72px;
        opacity: 0.5;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(80% 74% at 50% 48%, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }

      /* ---- stars ---- */
      #stars {
        position: absolute;
        inset: 0;
      }
      .star {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--s, 4px);
        height: var(--s, 4px);
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.55);
        opacity: 0;
      }

      /* ---- moon / sun ---- */
      #moon {
        position: absolute;
        left: 220px;
        top: 150px;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(38% 38% at 34% 30%, #ffffff 0%, #eef0f5 30%, #c9cde0 68%, #aab0d2 100%);
        box-shadow: 0 0 60px 14px rgba(210, 216, 245, 0.35);
        opacity: 0;
      }
      #moon .crater {
        position: absolute;
        border-radius: 50%;
        background: rgba(150, 155, 190, 0.35);
      }
      #moon .c1 {
        width: 26px;
        height: 26px;
        left: 66px;
        top: 34px;
      }
      #moon .c2 {
        width: 16px;
        height: 16px;
        left: 40px;
        top: 70px;
      }

      #sun {
        position: absolute;
        left: 1540px;
        top: 140px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(45% 45% at 50% 50%, #fff6d8 0%, #ffd678 40%, #ff9d52 78%, rgba(255, 157, 82, 0) 100%);
        box-shadow: 0 0 120px 30px rgba(255, 184, 100, 0.45);
        opacity: 0;
      }

      /* ---- kicker / tagline ---- */
      #kicker,
      #tagline {
        position: absolute;
        top: 96px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: var(--ink);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }
      #kicker {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.28em;
        opacity: 0;
      }
      #tagline {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: 0.01em;
        opacity: 0;
      }

      /* ---- sleeper ---- */
      #sleeper {
        position: absolute;
        left: 630px;
        top: 300px;
        width: 260px;
        height: 170px;
        opacity: 0;
      }
      #sleeper .pillow {
        position: absolute;
        left: -8px;
        top: 74px;
        width: 116px;
        height: 58px;
        border-radius: 50% 50% 40% 40%;
        background: linear-gradient(160deg, #dfe4ff 0%, #b7bfe6 100%);
        opacity: 0.9;
      }
      #sleeper .body {
        position: absolute;
        left: 46px;
        top: 46px;
        width: 214px;
        height: 118px;
        border-radius: 62% 58% 46% 50% / 78% 78% 42% 42%;
        background: linear-gradient(150deg, #232b52 0%, #171d3c 100%);
      }
      #sleeper .head {
        position: absolute;
        left: 30px;
        top: 58px;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: linear-gradient(150deg, #2a3260 0%, #191f40 100%);
      }
      #zzz {
        position: absolute;
        left: 92px;
        top: -8px;
        font-weight: 700;
        color: var(--ink);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      #zzz span {
        position: absolute;
        opacity: 0;
        display: inline-block;
      }
      #zzz span:nth-child(1) {
        font-size: 26px;
        left: 0;
        top: 30px;
      }
      #zzz span:nth-child(2) {
        font-size: 33px;
        left: 20px;
        top: 10px;
      }
      #zzz span:nth-child(3) {
        font-size: 40px;
        left: 44px;
        top: -16px;
      }

      /* ---- battery ---- */
      #hero {
        position: absolute;
        inset: 0;
      }

      #battery-glow {
        position: absolute;
        left: 380px;
        top: 300px;
        width: 800px;
        height: 500px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255, 205, 140, 0.4) 0%, rgba(255, 205, 140, 0) 70%);
        opacity: 0.2;
        pointer-events: none;
      }

      #battery-wrap {
        position: absolute;
        left: 450px;
        top: 440px;
        width: 660px;
        height: 240px;
      }

      #battery-body {
        position: absolute;
        left: 0;
        top: 0;
        width: 620px;
        height: 240px;
        border: 7px solid rgba(244, 246, 255, 0.92);
        border-radius: 40px;
        background: rgba(8, 11, 28, 0.55);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      #battery-nub {
        position: absolute;
        left: 630px;
        top: 65px;
        width: 30px;
        height: 110px;
        border-radius: 0 12px 12px 0;
        background: rgba(244, 246, 255, 0.92);
      }

      #battery-fill {
        position: absolute;
        left: 14px;
        top: 14px;
        width: 5%;
        height: 212px;
        border-radius: 26px;
        background: var(--low);
        box-shadow: 0 0 22px 4px rgba(239, 75, 63, 0.55);
      }

      #bolt {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 96px;
        height: 96px;
        transform: translate(-50%, -50%);
        fill: #ffffff;
        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.6));
        opacity: 0;
      }

      /* ---- benefit badges ---- */
      #badges {
        position: absolute;
        left: 1420px;
        top: 330px;
        width: 460px;
      }
      .badge {
        position: absolute;
        left: 0;
        width: 460px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 22px;
        border-radius: 20px;
        background: rgba(8, 10, 26, 0.42);
        font-size: 34px;
        font-weight: 600;
        color: var(--ink);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
        opacity: 0;
      }
      .badge .dot {
        width: 22px;
        height: 22px;
        min-width: 22px;
        border-radius: 50%;
        box-shadow: 0 0 14px 2px currentColor;
      }
      #badge1 {
        top: 0px;
      }
      #badge1 .dot {
        background: var(--mid);
        color: var(--mid);
      }
      #badge2 {
        top: 150px;
      }
      #badge2 .dot {
        background: var(--mid);
        color: var(--mid);
      }
      #badge3 {
        top: 300px;
      }
      #badge3 .dot {
        background: var(--full);
        color: var(--full);
      }

      #flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(45% 42% at 62% 55%, rgba(180, 255, 210, 0.5) 0%, rgba(180, 255, 210, 0.12) 42%, rgba(180, 255, 210, 0) 72%);
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div id="sky-night"></div>
        <div id="sky-dawn"></div>
        <div id="stars" data-layout-allow-overflow></div>
        <div id="moon">
          <div class="crater c1"></div>
          <div class="crater c2"></div>
        </div>
        <div id="sun"></div>
        <div class="grain"></div>

        <div id="kicker">WHY YOU NEED SLEEP</div>
        <div id="tagline">RECHARGE TONIGHT</div>

        <div id="hero" data-layout-allow-overflow>
          <div id="sleeper">
            <div class="pillow"></div>
            <div class="body"></div>
            <div class="head"></div>
            <div id="zzz">
              <span>z</span><span>z</span><span>Z</span>
            </div>
          </div>

          <div id="battery-glow"></div>
          <div id="battery-wrap">
            <div id="battery-body">
              <div id="battery-fill"></div>
              <svg id="bolt" viewBox="0 0 24 24"><path d="M13 2 L4 14 H11 L9 22 L20 9 H13 Z" /></svg>
            </div>
            <div id="battery-nub"></div>
          </div>
        </div>

        <div id="badges">
          <div class="badge" id="badge1"><span class="dot"></span>Sharper memory</div>
          <div class="badge" id="badge2"><span class="dot"></span>Stronger immunity</div>
          <div class="badge" id="badge3"><span class="dot"></span>Healthier heart</div>
        </div>

        <div class="vignette"></div>
        <div id="flash"></div>
      </section>

      <audio
        id="chime"
        data-start="0"
        data-duration="8"
        data-track-index="2"
        src="assets/chime.wav"
        data-volume="0.9"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // ---- scatter a fixed field of stars (deterministic positions) ----
      const starField = [
        [120, 90, 4], [260, 220, 3], [80, 300, 5], [420, 70, 3], [560, 180, 4],
        [700, 60, 3], [900, 110, 5], [1020, 240, 3], [1150, 60, 4], [1300, 150, 3],
        [1780, 320, 4], [1860, 120, 3], [1650, 60, 5], [990, 300, 3], [340, 260, 4],
        [1480, 260, 3], [180, 200, 3], [820, 220, 4],
      ];
      const starsEl = document.querySelector("#stars");
      const stars = starField.map(([x, y, s]) => {
        const el = document.createElement("span");
        el.className = "star";
        el.style.setProperty("--x", x + "px");
        el.style.setProperty("--y", y + "px");
        el.style.setProperty("--s", s + "px");
        starsEl.appendChild(el);
        return el;
      });

      const tl = gsap.timeline({ paused: true });

      // ---- scene wakes up: stars, moon, kicker, sleeper settle in ----
      tl.to(stars, { opacity: 0.9, duration: 0.5, stagger: { each: 0.02, from: "random" } }, 0.05);
      tl.to("#moon", { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.15);
      tl.fromTo(
        "#sleeper",
        { opacity: 0, y: -18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" },
        0.15,
      );
      tl.to("#kicker", { opacity: 0.92, duration: 0.5, ease: "power1.out" }, 0.25);
      tl.fromTo(
        "#battery-wrap",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0.2,
      );
      tl.to("#battery-glow", { opacity: 1, duration: 0.5 }, 0.2);

      // gentle looping zzz drift (three staggered puffs, deterministic loop)
      const zzzSpans = document.querySelectorAll("#zzz span");
      const zzzTl = gsap.timeline({ repeat: 5 });
      zzzTl.fromTo(
        zzzSpans,
        { opacity: 0, y: 6 },
        { opacity: 0.85, y: -6, duration: 0.5, ease: "sine.out", stagger: 0.18 },
        0,
      );
      zzzTl.to(zzzSpans, { opacity: 0, duration: 0.35, stagger: 0.1 }, 0.55);
      tl.add(zzzTl, 0.6);
      tl.to(zzzSpans, { opacity: 0, duration: 0.4, overwrite: "auto" }, 6.1);

      // ---- the charge: fill rises, colors turn from red to green ----
      const FILL_START = 0.55;
      const FILL_END = 7.0;
      const FILL_SPAN = FILL_END - FILL_START;

      tl.to(
        "#battery-fill",
        { width: "97%", duration: FILL_SPAN, ease: "power1.inOut" },
        FILL_START,
      );
      tl.to(
        "#battery-fill",
        { backgroundColor: "#f5b342", duration: FILL_SPAN * 0.5, ease: "none" },
        FILL_START,
      );
      tl.to(
        "#battery-fill",
        { backgroundColor: "#35d488", duration: FILL_SPAN * 0.5, ease: "none" },
        FILL_START + FILL_SPAN * 0.5,
      );
      tl.to(
        "#battery-glow",
        { opacity: 0.55, duration: FILL_SPAN, ease: "power1.in", overwrite: "auto" },
        FILL_START,
      );

      // charging bolt: soft continuous pulse while the fill climbs
      tl.to("#bolt", { opacity: 0.9, duration: 0.4 }, FILL_START + 0.15);
      const boltTl = gsap.timeline({ repeat: 13, yoyo: true });
      boltTl.to("#bolt", { scale: 1.08, opacity: 1, duration: 0.45, ease: "sine.inOut" }, 0);
      tl.add(boltTl, FILL_START + 0.3);

      // day breaks behind the charge
      tl.to("#sky-dawn", { opacity: 1, duration: 4.5, ease: "power1.inOut" }, 1.4);
      tl.to(stars, { opacity: 0, duration: 1.2, stagger: { each: 0.02 } }, 3.6);
      tl.to("#moon", { opacity: 0, x: -40, duration: 1.3, ease: "power1.in" }, 3.8);
      tl.to("#sun", { opacity: 1, y: -20, duration: 2.2, ease: "power1.out" }, 4.3);

      // ---- benefit badges arrive as the charge passes their milestones ----
      tl.fromTo(
        "#badge1",
        { opacity: 0, x: 36 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        2.35,
      );
      tl.fromTo(
        "#badge2",
        { opacity: 0, x: 36 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        4.15,
      );
      tl.fromTo(
        "#badge3",
        { opacity: 0, x: 36 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        5.95,
      );

      // ---- full charge: punch, flash, chime, tagline ----
      const FULL_T = 7.0;
      tl.to("#battery-wrap", { scale: 1.045, duration: 0.09, ease: "power3.out" }, FULL_T);
      tl.to("#battery-wrap", { scale: 1, duration: 0.5, ease: "power2.out" }, FULL_T + 0.09);
      tl.to("#battery-glow", { opacity: 0.85, duration: 0.15, ease: "power2.out" }, FULL_T);
      tl.to("#battery-glow", { opacity: 0.6, duration: 0.6, ease: "power2.out" }, FULL_T + 0.2);
      tl.to("#flash", { opacity: 1, duration: 0.08, ease: "none" }, FULL_T);
      tl.to("#flash", { opacity: 0, duration: 0.55, ease: "power2.out" }, FULL_T + 0.1);
      tl.to("#bolt", { opacity: 1, scale: 1.15, duration: 0.2, ease: "power2.out", overwrite: "auto" }, FULL_T);

      tl.to("#kicker", { opacity: 0, y: -14, duration: 0.28 }, FULL_T - 0.45);
      tl.fromTo(
        "#tagline",
        { opacity: 0, y: 14, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power2.out" },
        FULL_T + 0.1,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
