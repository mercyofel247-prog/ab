<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SHEIN 05 — Title Drop</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ground: #0b0b0c;
        --bone: #ede8dd;
        --oxblood: #7a160e;
        --oxblood-hot: #d1502f;
        --graphite: #3a3a3e;
        --metal: #b7b2a8;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }

      body {
        font-family: Arial, "Helvetica Neue", sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 52%, #141416 0%, #0f0f10 44%, var(--ground) 100%);
      }

      #container {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* ---------------- z4 : graphite depth panel behind ---------------- */
      #depthPanel {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 620px;
        transform: translate(-50%, -46%);
        background: linear-gradient(168deg, #34343a 0%, var(--graphite) 46%, #24242a 100%);
        opacity: 0.18;
        border-radius: 6px;
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }

      /* ---------------- z3 : dust + contact shadow ---------------- */
      #dustLayer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .mote {
        position: absolute;
        border-radius: 50%;
        background: var(--bone);
        will-change: transform, opacity;
      }

      #contactShadow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1200px;
        height: 150px;
        transform: translate(-50%, 210px);
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 72%);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ---------------- z0 : top line ---------------- */
      #topLine {
        position: absolute;
        left: 50%;
        top: 27%;
        transform: translate(-50%, -50%);
        color: var(--bone);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.42em;
        white-space: nowrap;
        opacity: 0.4;
        text-indent: 0.42em;
      }

      /* ---------------- z2 : oxblood under-glow ---------------- */
      #underGlow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1400px;
        height: 420px;
        transform: translate(-50%, -6%);
        background: radial-gradient(60% 92% at 50% 100%, var(--oxblood-hot) 0%, var(--oxblood) 34%, rgba(122, 22, 14, 0.35) 62%, rgba(122, 22, 14, 0) 82%);
        filter: blur(6px);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: opacity, clip-path;
      }

      /* ---------------- z1 : hero SHEIN ---------------- */
      #heroSizeLock {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        transform-origin: 50% 50%;
      }

      #heroWrap {
        position: relative;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #hero {
        position: relative;
        display: block;
        font-size: 400px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.01em;
        white-space: nowrap;
        transform: scaleX(0.7);
        transform-origin: 50% 50%;
        background: linear-gradient(176deg, #cfcabf 0%, var(--metal) 20%, #85817a 46%, #565550 64%, #8f8b83 82%, #3f3d39 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        text-shadow:
          1px 1px 0 #7d7970,
          2px 2px 0 #66625b,
          3px 3px 0 #524f49,
          4px 4px 0 #423f3a,
          5px 5px 0 #35322e,
          6px 7px 0 #2a2825,
          7px 9px 18px rgba(0, 0, 0, 0.7);
        will-change: transform, opacity;
      }

      #specular {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 240px;
        height: 460px;
        margin-left: -120px;
        margin-top: -230px;
        background: linear-gradient(100deg, transparent 0%, rgba(255, 250, 240, 0.5) 48%, transparent 100%);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
        will-change: transform, opacity;
      }

      /* ---------------- z5 : grade pass ---------------- */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(72% 68% at 50% 50%, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, 0.18) 100%);
        pointer-events: none;
        will-change: opacity;
      }

      #grain {
        position: absolute;
        inset: -6%;
        background-image:
          radial-gradient(rgba(237, 232, 221, 0.05) 1px, transparent 1px),
          radial-gradient(rgba(237, 232, 221, 0.035) 1px, transparent 1px);
        background-size: 5px 5px, 9px 9px;
        background-position: 0 0, 3px 4px;
        opacity: 0.06;
        pointer-events: none;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main-video"
      data-width="1920"
      data-height="1080"
      data-fps="24"
      data-start="0"
      data-duration="3.4"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div id="container" data-layout-allow-overflow>
          <div id="depthPanel"></div>

          <div id="dustLayer" data-layout-allow-overflow></div>
          <div id="contactShadow"></div>

          <div id="topLine" data-layout-allow-occlusion>THE MOST EXPENSIVE CHEAP CLOTHES ON EARTH</div>

          <div id="underGlow" data-layout-allow-overflow></div>

          <div id="heroSizeLock" data-layout-allow-overflow>
            <div id="heroWrap">
              <div id="hero" data-layout-allow-overflow>SHEIN</div>
            </div>
          </div>

          <div id="specular" data-layout-allow-overflow></div>
        </div>

        <div id="vignette" data-layout-allow-overflow></div>
        <div id="grain" data-layout-allow-overflow></div>
      </section>

      <audio
        id="slam"
        data-start="0"
        data-duration="3.4"
        data-track-index="2"
        src="assets/slam.wav"
        data-volume="0.95"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const FPS = 24;
      const f = (n) => n / FPS;

      // ---- deterministic PRNG (mulberry32) ----
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(0x5eed05);

      const hero = document.querySelector("#hero");
      const heroWrap = document.querySelector("#heroWrap");
      const heroSizeLock = document.querySelector("#heroSizeLock");
      const underGlow = document.querySelector("#underGlow");
      const topLine = document.querySelector("#topLine");
      const specular = document.querySelector("#specular");

      // ---- size-lock: hero fills up to 84% of frame width while staying inside
      // the title-safe inner 90% height, leaving headroom for the 1.12x impact
      // scale spike so the peak still fits ----
      const GROWTH_HEADROOM = 1.13;
      const TARGET_WIDTH = (1920 * 0.84) / GROWTH_HEADROOM;
      const TARGET_HEIGHT = (1080 * 0.6) / GROWTH_HEADROOM;
      const heroBox = hero.getBoundingClientRect();
      const widthScale = heroBox.width > 0 ? TARGET_WIDTH / heroBox.width : 1;
      const heightScale = heroBox.height > 0 ? TARGET_HEIGHT / heroBox.height : 1;
      const lockScale = Math.min(widthScale, heightScale);
      gsap.set(heroSizeLock, { scale: lockScale });

      // real on-screen half-width of the locked hero, for the unscaled specular travel
      const heroScreenHalfWidth = (heroBox.width * lockScale) / 2 + 120;

      // ---- z3 dust motes: deterministic drift ----
      const dustLayer = document.querySelector("#dustLayer");
      const MOTE_COUNT = 42;
      const motes = [];
      for (let i = 0; i < MOTE_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "mote";
        const size = 1.4 + rand() * 3.2;
        el.style.left = rand() * 100 + "%";
        el.style.top = rand() * 100 + "%";
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.opacity = String(0.06 + rand() * 0.2);
        dustLayer.appendChild(el);
        motes.push({ el, ampX: 8 + rand() * 22, ampY: 6 + rand() * 14, dur: 3.4 + rand() * 3, delay: rand() * 1.5 });
      }

      const tl = gsap.timeline({ paused: true });

      // ==================================================================
      // 0 – 500ms (f0–f12)  SILENT VACUUM
      // ==================================================================
      gsap.set("#container", { scale: 1 });
      gsap.set(heroWrap, { scale: 1, y: 0 });
      gsap.set(hero, { opacity: 0 });
      gsap.set(underGlow, { opacity: 0 });
      gsap.set("#contactShadow", { opacity: 0, scaleX: 0.9 });
      gsap.set(specular, { opacity: 0, x: 0 });
      gsap.set(topLine, { opacity: 0.4 });
      gsap.set("#vignette", { opacity: 1 });

      // slow container breath so nothing is frozen
      tl.to("#container", { scale: 1.008, duration: f(12), ease: "sine.inOut" }, f(0));

      // dust drifts across the whole duration
      motes.forEach((m) => {
        gsap.to(m.el, { x: m.ampX, y: -m.ampY, duration: m.dur, ease: "sine.inOut", yoyo: true, repeat: 1, delay: m.delay });
      });
      gsap.to("#grain", { x: 12, y: -9, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 });

      // ==================================================================
      // 500 – 650ms (f12–f16)  HEAVY SLAM — sync frame f12
      // ==================================================================
      const SLAM_T = f(12);

      // (1) SHEIN imposed: slams from y:-40 -> 0 over 150ms, expo.in
      tl.set(hero, { opacity: 1, y: -40 }, SLAM_T);
      tl.to(hero, { y: 0, duration: 0.15, ease: "expo.in" }, SLAM_T);

      // (2) impact scale spike 1.12 -> 1.00, back.out (ONE impulse)
      tl.fromTo(heroWrap, { scale: 1.12 }, { scale: 1.0, duration: 0.2, ease: "back.out(2.4)" }, SLAM_T);

      // (3) oxblood under-glow ignites from below 0 -> full, expo.out
      tl.fromTo(underGlow, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "expo.out" }, SLAM_T);
      // clip-path reveal of the glow on the land (wipes up from the base)
      const glowReveal = { p: 0 };
      tl.to(
        glowReveal,
        {
          p: 1,
          duration: 0.2,
          ease: "expo.out",
          onUpdate: () => {
            const topInset = (1 - glowReveal.p) * 100;
            const css = `inset(${topInset.toFixed(1)}% 0% 0% 0%)`;
            underGlow.style.clipPath = css;
            underGlow.style.webkitClipPath = css;
          },
        },
        SLAM_T,
      );

      // (4) contact shadow snaps in
      tl.fromTo("#contactShadow", { opacity: 0, scaleX: 0.9 }, { opacity: 0.4, scaleX: 1.0, duration: 0.12, ease: "power3.out" }, SLAM_T);

      // (5) vignette pulse
      tl.to("#vignette", { opacity: 1.35, duration: 0.05, ease: "power2.out" }, SLAM_T);
      tl.to("#vignette", { opacity: 1, duration: 0.35, ease: "power2.out" }, SLAM_T + 0.05);

      // (6) grain kick
      tl.fromTo("#grain", { opacity: 0.06 }, { opacity: 0.2, duration: 0.05, ease: "power1.out" }, SLAM_T);
      tl.to("#grain", { opacity: 0.06, duration: 0.18, ease: "power1.out" }, SLAM_T + 0.05);

      // ==================================================================
      // 650 – 1400ms (f16–f34)  SETTLE
      // ==================================================================
      // under-glow cools oxblood-hot -> deep #7A160E (opacity eases down a touch)
      tl.to(underGlow, { opacity: 0.72, duration: f(34) - f(16), ease: "sine.inOut" }, f(16));

      // specular travels the metal caps (unscaled sibling, real pixel travel)
      tl.fromTo(specular, { x: -heroScreenHalfWidth }, { x: heroScreenHalfWidth, duration: f(34) - f(16), ease: "power2.out" }, f(16));
      tl.fromTo(specular, { opacity: 0 }, { opacity: 0.85, duration: (f(34) - f(16)) * 0.35, ease: "power1.out" }, f(16));
      tl.to(specular, { opacity: 0, duration: (f(34) - f(16)) * 0.35, ease: "power1.in" }, f(16) + (f(34) - f(16)) * 0.65);
      tl.set(specular, { opacity: 0, x: 0 }, f(34));

      // ==================================================================
      // 1400 – 3150ms (f34–f76)  SUSTAINED — no dead air
      // ==================================================================
      tl.to("#container", { scale: 1.05, duration: f(76) - f(34), ease: "sine.inOut" }, f(34));
      tl.to(
        underGlow,
        { opacity: 0.68, duration: (f(76) - f(34)) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        f(34),
      );

      // ==================================================================
      // 3150 – 3400ms (f76–f82)  EXIT — HOLD, cuttable, oxblood + grain live
      // ==================================================================
      // no new tweens: hero/under-glow freeze at sustained values; dust + grain
      // keep drifting underneath into the chapter-card cut.

      window.__timelines["main-video"] = tl;
    </script>
  </body>
</html>
