<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hero — $209 BILLION (Path 1 / Mode B / Part 0.5 Track-2)</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
      }

      :root {
        /* Part 0.5 / Track-2 theme */
        --near-black: #0b0b0c;
        --oxblood: #7a160e;
        --bone: #ede8dd;
        --bone-hi: #f7f3ea; /* key-lit highlight step above bone */
        --charcoal: #3a3a3e;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--near-black);
      }

      body {
        font-family: "Anton", sans-serif;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--near-black);
      }

      /* ONE hard key, upper-left — a whisper of warm wash across the vast
         negative space, never touching the letterforms directly (that's
         handled by the face gradient below). Static, never animated. */
      #key-wash {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 55% at 21% 17%, rgba(247, 243, 234, 0.055) 0%, rgba(247, 243, 234, 0) 60%);
        pointer-events: none;
      }

      #grain {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
        background-size: 68px 68px;
        opacity: 0.5;
        pointer-events: none;
      }

      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(80% 72% at 50% 48%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.82) 100%);
        pointer-events: none;
      }

      /* 2.35:1 letterbox within the 1920x1080 canvas: active height
         1920 / 2.35 = 817.02px, so 131.5px bars top and bottom. Static. */
      .letterbox-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 131.5px;
        background: #000;
        z-index: 5;
      }
      #bar-top {
        top: 0;
      }
      #bar-bottom {
        bottom: 0;
      }

      /* the whole assembly (text + rim) rides the single permitted
         transform: scale push together */
      #scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #stack {
        position: relative;
        display: grid;
        place-items: center;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* shared type settings for the hero face AND its rim clones, so the
         rim glow hugs the exact same glyph shapes */
      .hero-type {
        grid-area: 1 / 1;
        font-family: "Anton", sans-serif;
        font-size: 176px;
        line-height: 1;
        letter-spacing: -0.01em; /* static — never animated */
        text-transform: uppercase;
        white-space: nowrap;
        text-align: center;
      }

      /* the hero face: warm-bone, key-lit brighter at upper-left, fading
         toward the lower-right where the extrusion falls into shadow */
      #face {
        background: linear-gradient(135deg, var(--bone-hi) 0%, var(--bone) 45%, #ded7c8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        position: relative;
        z-index: 2;
        /* extruded body: bone -> charcoal -> near-black, then a real,
           grounded contact shadow (soft, large blur, offset down-right,
           away from the upper-left key) */
        filter: drop-shadow(1px 1px 0 #ded7c8) drop-shadow(2px 2px 0 #cfc6b2) drop-shadow(3px 3px 0 #b0a48c)
          drop-shadow(4px 4px 0 #8d8272) drop-shadow(5px 5px 0 #675f56) drop-shadow(6px 6px 0 var(--charcoal))
          drop-shadow(7px 7px 0 #2c2c2f) drop-shadow(8px 8px 0 #1a1a1c) drop-shadow(9px 9px 0 var(--near-black))
          drop-shadow(11px 14px 26px rgba(0, 0, 0, 0.65));
      }

      /* dimensional oxblood rim, biased to the right edge (opposite the
         upper-left key = classic separation rim-light logic) — three
         stacked clones of the SAME real text, tight -> wide, for a real
         bloom. Only this wrapper's opacity is animated (0.70 -> 0.85). */
      #rim {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        z-index: 1;
        opacity: 0.7; /* animated: opacity only */
        mix-blend-mode: screen;
        pointer-events: none;
      }

      #rim .clone {
        grid-area: 1 / 1;
        color: var(--oxblood);
      }
      #rim .clone.tight {
        transform: translateX(3px);
        filter: blur(2px);
        opacity: 0.9;
      }
      #rim .clone.mid {
        transform: translateX(6px);
        filter: blur(15px);
        opacity: 0.55;
      }
      #rim .clone.wide {
        transform: translateX(11px);
        filter: blur(36px);
        opacity: 0.32;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="key-wash"></div>

        <div id="scene">
          <div id="stack">
            <!-- real DOM text, never a rasterized image — it cannot warp or mis-spell -->
            <div id="rim" data-layout-allow-overflow data-layout-ignore>
              <div class="hero-type clone tight">$209 BILLION</div>
              <div class="hero-type clone mid">$209 BILLION</div>
              <div class="hero-type clone wide">$209 BILLION</div>
            </div>
            <div id="face" class="hero-type" data-layout-allow-overflow data-layout-allow-occlusion>$209 BILLION</div>
          </div>
        </div>

        <div id="grain" data-layout-allow-occlusion></div>
        <div id="vignette" data-layout-allow-occlusion></div>
        <div id="bar-top" class="letterbox-bar"></div>
        <div id="bar-bottom" class="letterbox-bar"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Deterministic: no Math.random()/Date.now() anywhere in this scene —
      // every value below is a fixed constant, so the render is identical
      // on every run/seek.

      // A literally-named ease-out-cubic (t=0..1 -> eased 0..1), used
      // directly as the scale-push's easing function.
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      const DWELL = 3.0;

      const tl = gsap.timeline({ paused: true });

      gsap.set("#stack", { scale: 1 });
      gsap.set("#rim", { opacity: 0.7 });

      // ANIMATE ONLY these two channels — nothing else in the scene moves:

      // (1) a 4% scale push on the whole stack (text + rim together)
      tl.to("#stack", { scale: 1.04, duration: DWELL, ease: easeOutCubic }, 0);

      // (2) the oxblood rim's opacity breathing 0.70 -> 0.85 on a slow sine
      tl.to("#rim", { opacity: 0.85, duration: DWELL, ease: "sine.inOut" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
