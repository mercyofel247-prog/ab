<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>HyperFrames + GSAP + 3D</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
      }

      /* Reflective floor: a faint horizon wash + a soft mirrored glow of the
         cube's accent light, grounding the scene without fighting the box. */
      #floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 300px;
        background: linear-gradient(
          to bottom,
          rgba(79, 195, 247, 0) 0%,
          rgba(60, 130, 170, 0.05) 42%,
          rgba(96, 176, 224, 0.13) 100%
        );
        pointer-events: none;
      }

      #floor-reflection {
        position: absolute;
        left: 490px;
        top: 498px;
        width: 300px;
        height: 92px;
        background: radial-gradient(
          ellipse at center,
          rgba(79, 195, 247, 0.4) 0%,
          rgba(79, 195, 247, 0) 70%
        );
        filter: blur(11px);
        pointer-events: none;
      }

      /* Cinematic vignette overlay (matches the data-beat look). */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          78% 68% at 50% 42%,
          rgba(0, 0, 0, 0) 46%,
          rgba(0, 0, 0, 0.55) 100%
        );
        pointer-events: none;
      }

      /* GSAP title — fades / scales in (ported from the Remotion GsapTitle) */
      #title {
        position: absolute;
        top: 60px;
        width: 100%;
        text-align: center;
        font-size: 56px;
        font-weight: 700;
        color: #ffffff;
        /* from-state is set by GSAP fromTo() below (seek-safe, no CSS/GSAP
           transform conflict) */
      }

      /* 3D cube — CSS transforms replace the Remotion @remotion/three canvas */
      #scene {
        position: absolute;
        top: 160px;
        left: 440px;
        width: 400px;
        height: 400px;
        display: grid;
        place-items: center;
        perspective: 800px;
      }

      /* soft glow behind the cube — a plain 2D leaf, NOT in the preserve-3d
         chain, so its blur filter can't flatten the cube's translateZ faces */
      .cube-glow {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(79, 195, 247, 0.5) 0%,
          rgba(79, 195, 247, 0.18) 45%,
          rgba(79, 195, 247, 0) 72%
        );
        filter: blur(14px);
      }

      #cube {
        position: relative;
        width: 160px;
        height: 160px;
        transform-style: preserve-3d;
        /* base orientation; GSAP drives rotationX / rotationY on top of this */
        transform: rotateX(0deg) rotateY(0deg);
      }

      /* Lit faces: a top-left highlight → bottom-right shade gradient fakes a
         fixed key light, replacing the flat fill of the first pass. Per-face
         base tone keeps the edges legible as the cube turns. */
      .face {
        position: absolute;
        top: 0;
        left: 0;
        width: 160px;
        height: 160px;
        background: linear-gradient(
          135deg,
          rgba(150, 224, 255, 0.98) 0%,
          rgba(79, 195, 247, 0.94) 46%,
          rgba(34, 110, 158, 0.94) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow:
          inset 0 0 42px rgba(0, 0, 0, 0.32),
          inset 34px 34px 60px rgba(255, 255, 255, 0.12);
      }
      .face.front  { transform: translateZ(80px); }
      .face.back   { transform: rotateY(180deg) translateZ(80px); filter: brightness(0.82); }
      .face.right  { transform: rotateY(90deg) translateZ(80px); filter: brightness(0.9); }
      .face.left   { transform: rotateY(-90deg) translateZ(80px); filter: brightness(0.78); }
      .face.top    { transform: rotateX(90deg) translateZ(80px); filter: brightness(1.12); }
      .face.bottom { transform: rotateX(-90deg) translateZ(80px); filter: brightness(0.62); }

      /* Sweeping box (ported from the Remotion MovingBox). The Remotion source
         wrapped it in CameraMotionBlur; a seeked renderer can't integrate over
         shutter time, so a constant directional X-axis blur (feGaussianBlur,
         applied via #box-motion-blur) fakes the constant-velocity smear. */
      #box {
        position: absolute;
        top: 580px;
        left: 0;
        width: 200px;
        height: 200px;
        border-radius: 24px;
        background: #4fc3f7;
        filter: url(#box-motion-blur);
        /* CSS holds the "from" x position (matches interpolate start of -100) */
        transform: translateX(-100px);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-fps="30"
      data-width="1280"
      data-height="720"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <!-- constant directional (X-axis) blur faking CameraMotionBlur on the
             constant-velocity box; generous region so the smear isn't clipped -->
        <svg width="0" height="0" aria-hidden="true" style="position: absolute">
          <filter id="box-motion-blur" x="-60%" y="-20%" width="220%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="16 0" />
          </filter>
        </svg>

        <div id="floor"></div>
        <div id="floor-reflection"></div>

        <div id="title" data-layout-allow-overflow>HyperFrames + GSAP + 3D</div>

        <div id="scene" data-layout-allow-overflow>
          <div class="cube-glow" data-layout-allow-overflow></div>
          <div id="cube" data-layout-allow-overflow>
            <div class="face front" data-layout-allow-overflow></div>
            <div class="face back" data-layout-allow-overflow></div>
            <div class="face right" data-layout-allow-overflow></div>
            <div class="face left" data-layout-allow-overflow></div>
            <div class="face top" data-layout-allow-overflow></div>
            <div class="face bottom" data-layout-allow-overflow></div>
          </div>
        </div>

        <!-- intentionally sweeps off-frame and sits partly below the 720px edge
             (faithful to the Remotion MovingBox) -->
        <div id="box" data-layout-allow-overflow></div>

        <div id="vignette"></div>

        <!-- Audio sting (matches the data-beat project's use of a sting):
             a short whoosh on the title/motion entrance, and a bass impact as
             the title settles (~1s). -->
        <audio
          id="sfx-whoosh"
          data-start="0"
          data-duration="0.58"
          data-track-index="2"
          src="assets/whoosh.mp3"
          data-volume="0.6"
        ></audio>
        <audio
          id="sfx-impact"
          data-start="0.85"
          data-duration="2.15"
          data-track-index="3"
          src="assets/impact.mp3"
          data-volume="0.55"
        ></audio>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Single paused timeline; HyperFrames seeks it frame-by-frame, so all
      // motion is deterministic (no real-time tickers, no Date.now / random).
      const tl = gsap.timeline({ paused: true });

      // Title: fade + rise + scale in — the Remotion back.out(2) tween.
      tl.fromTo(
        "#title",
        { opacity: 0, y: 40, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 1, ease: "back.out(2)" },
        0,
      );

      // Cube: linear rotation across the whole 3s.
      // Remotion drove rotation=[frame/30, frame/20, 0] rad; over 90 frames
      // that is ~172deg on X and ~258deg on Y. Reproduced as a linear tween.
      tl.fromTo(
        "#cube",
        { rotationX: 0, rotationY: 0 },
        { rotationX: 172, rotationY: 258, duration: 3, ease: "none" },
        0,
      );

      // Box: sweeps left→right across the frame (Remotion interpolate
      // [-100, width+100] = [-100, 1380]), clamped, linear.
      tl.fromTo(
        "#box",
        { x: -100 },
        { x: 1380, duration: 3, ease: "none" },
        0,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
