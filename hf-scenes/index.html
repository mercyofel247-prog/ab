<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>hf-scenes — index</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: radial-gradient(90% 90% at 50% 46%, #141416 0%, #0b0b0c 100%);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .label {
        color: #ede8dd;
        font-size: 40px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-fps="24"
      data-start="0"
      data-duration="2"
    >
      <section id="stage" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div id="label" class="label">hf-scenes</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#label", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
