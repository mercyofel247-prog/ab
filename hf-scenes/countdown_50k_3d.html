<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Countdown — $50,000 → $0 (TRUE 3D, oxblood)</title>
    <!--
      Real Three.js scene: extruded 3D number, OXBLOOD emissive material, real lights + env,
      tumbling on its X axis while the value counts $50,000 -> $0. 1920x1080 @24fps, 8s.
      Premium sound effect (assets/countdown.wav) muxed by HyperFrames, impact synced to the land.
      three.js + font vendored locally (org egress policy blocks CDNs; also more deterministic).
    -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/loaders/FontLoader.js": "./vendor/three/FontLoader.js",
          "three/addons/geometries/TextGeometry.js": "./vendor/three/TextGeometry.js"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #scene { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: radial-gradient(66% 60% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.66) 100%);
      }
      #grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 3;
        opacity: 0.06; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch' seed='7'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main-video"
      data-width="1920"
      data-height="1080"
      data-fps="24"
      data-start="0"
      data-duration="8"
    >
      <section id="stage" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <canvas id="scene" width="1920" height="1080"></canvas>
        <div id="vignette"></div>
        <div id="grain"></div>
      </section>

      <audio
        id="sfx"
        data-start="0"
        data-duration="8"
        data-track-index="2"
        src="assets/countdown.wav"
        data-volume="1"
      ></audio>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { FontLoader } from "three/addons/loaders/FontLoader.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

      const gsap = window.gsap;
      window.__timelines = window.__timelines || {};

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const W = 1920, H = 1080;
      const canvas = document.getElementById("scene");

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x0b0b0c, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
      camera.position.set(0, 0.7, 6.3);
      camera.lookAt(0, 0, 0);

      // dim procedural env so the oxblood surface has a subtle sheen
      function makeEnvTexture() {
        const c = document.createElement("canvas"); c.width = 512; c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0.0, "#4a4046"); g.addColorStop(0.5, "#241d20"); g.addColorStop(1.0, "#0a0708");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
        const s = ctx.createLinearGradient(160, 0, 360, 0);
        s.addColorStop(0, "rgba(220,210,214,0)"); s.addColorStop(0.5, "rgba(220,210,214,0.7)"); s.addColorStop(1, "rgba(220,210,214,0)");
        ctx.fillStyle = s; ctx.fillRect(160, 0, 200, 150);
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping; tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;

      // soft oxblood ember glow behind the number (additive)
      const glowTex = (function () {
        const c = document.createElement("canvas"); c.width = 256; c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(140,26,16,0.9)"); g.addColorStop(0.4, "rgba(105,20,12,0.4)"); g.addColorStop(1, "rgba(105,20,12,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
      })();
      const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 5.2), glowMat);
      glow.position.set(0, 0, -1.4);
      scene.add(glow);

      // lights: neutral key so the oxblood keeps its hue + a cool rim to edge-light the tumble
      const key = new THREE.DirectionalLight(0xfff2ec, 1.7);
      key.position.set(-3.4, 5.0, 3.4); scene.add(key);
      const rim = new THREE.DirectionalLight(0x8fa0c4, 0.6);
      rim.position.set(2.6, 1.2, -4.0); scene.add(rim);
      scene.add(new THREE.HemisphereLight(0x241318, 0x05060a, 0.35));

      // OXBLOOD digits — emissive so they read on the dark ground
      const material = new THREE.MeshStandardMaterial({
        color: 0x7a160e, emissive: 0x7a160e, emissiveIntensity: 0.6,
        metalness: 0.35, roughness: 0.45, envMapIntensity: 0.85,
      });

      const numberMesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
      scene.add(numberMesh);

      const fmt = (v) => "$" + Math.max(0, Math.round(v)).toLocaleString("en-US");

      let font = null;
      let lastText = null;
      function rebuild(text) {
        if (!font || text === lastText) return;
        lastText = text;
        const geo = new TextGeometry(text, {
          font, size: 0.62, height: 0.2, curveSegments: 5,
          bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.014, bevelOffset: 0, bevelSegments: 2,
        });
        geo.computeBoundingBox();
        const bb = geo.boundingBox;
        geo.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -(bb.max.z + bb.min.z) / 2);
        geo.computeVertexNormals();
        numberMesh.geometry.dispose();
        numberMesh.geometry = geo;
      }

      const S = { count: 50000, rotX: 0, scale: 1, emis: 0.6, glow: 0.6, _pad: 0 };

      function apply() {
        rebuild(fmt(S.count));
        numberMesh.rotation.x = S.rotX;
        numberMesh.scale.setScalar(S.scale);
        material.emissiveIntensity = S.emis;
        glowMat.opacity = S.glow;
        renderer.render(scene, camera);
      }

      new FontLoader().load("vendor/three/helvetiker_bold.typeface.json", (f) => {
        font = f;
        rebuild(fmt(S.count));

        const LAND = 7.2;
        const tl = gsap.timeline({ paused: true });

        // count $50,000 -> $0 while tumbling 2 full turns on X, easing to a front-facing rest
        tl.to(S, { count: 0, duration: LAND, ease: "power2.inOut" }, 0);
        tl.to(S, { rotX: Math.PI * 4, duration: LAND, ease: "power2.out" }, 0);

        // landing punch synced to the sub-boom: quick scale pop + emissive/glow flash, then dead stop
        tl.to(S, { scale: 1.06, duration: 0.08, ease: "power3.out" }, LAND);
        tl.to(S, { scale: 1.0, duration: 0.28, ease: "power2.out" }, LAND + 0.08);
        tl.to(S, { emis: 1.3, duration: 0.06, ease: "power2.out" }, LAND);
        tl.to(S, { emis: 0.74, duration: 0.32, ease: "power2.out" }, LAND + 0.1);
        tl.to(S, { glow: 1.35, duration: 0.06, ease: "power2.out" }, LAND);
        tl.to(S, { glow: 0.6, duration: 0.34, ease: "power2.out" }, LAND + 0.1);

        // pad to a full 8.0s (everything at rest by 7.64 -> last 8 frames static)
        tl.to(S, { _pad: 1, duration: 0.36, ease: "none" }, 7.64);

        tl.eventCallback("onUpdate", apply);
        apply();
        window.__timelines["main-video"] = tl;
      });
    </script>
  </body>
</html>
