<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Theranos · Ch1 · 06 — $0 Collapse</title>
    <script src="vendor/gsap.min.js"></script>
    <!--
      SHOT CONTEXT (verbatim):
      - Canvas: 1920x1080 @24fps, strict 16:9. [GLOBAL 1080p delivery — upscale to 4K later in Resolve.]
      - Palette (Track 2): ground #0B0B0C-#141416, bone type #EDE8DD, oxblood #7A160E emissive-edge-only,
        graphite #3A3A3E secondary. Single-beat alarm-red #D62E1F override NOT sanctioned in this chunk.
      - Grade: the 15.4 SHARED LOOK-BLOCK verbatim, applied as ONE master-LUT pass at ~60% in Resolve, not baked per shot.
      - Construction register — Mode B: dimensional lit editorial, machined/brushed-metal hero on near-black,
        single studio key, contact shadow, specular, shallow DoF, layered depth — NOT flat vector.
      - Output: render to MP4 at the above canvas/fps, SILENT (VO/music added in Resolve), under the master-grade layer.
      - REAL-LIKENESS: no named real person/landmark; unbranded; no real logos.
      SOUND-DESIGN INTENT (for Resolve): inverted sub-boom — a low hollow thud + the drone CUTTING OUT on 'nothing'.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --ground-0: #0b0b0c;
        --ground-1: #141416;
        --bone: #ede8dd;
        --oxblood: #7a160e;
        --graphite: #3a3a3e;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground-0);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(78% 78% at 50% 47%, var(--ground-1) 0%, var(--ground-0) 62%, #050505 100%);
      }

      /* ---- z1: cold dust (static, slightly out of focus for shallow DoF) ---- */
      #dust {
        position: absolute;
        inset: 0;
        filter: blur(0.6px);
        opacity: 0.5;
        z-index: 1;
      }
      .mote {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #aeb4bd;
      }

      /* ---- z2: hero deck (no glow) ---- */
      #deck {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 2;
      }

      .hero-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 900px;
        height: 520px;
      }

      /* the dying oxblood underglow — emissive edge only, extinguishes to black */
      #underglow {
        position: absolute;
        left: 50%;
        top: 54%;
        width: 760px;
        height: 300px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          50% 50% at 50% 50%,
          rgba(122, 22, 14, 0.55) 0%,
          rgba(122, 22, 14, 0.22) 42%,
          rgba(122, 22, 14, 0) 72%
        );
        z-index: 1;
      }

      /* ghosted prior value, plummeting 4,500,000,000 -> 0 */
      #ghost {
        position: absolute;
        left: 50%;
        top: 2%;
        transform: translateX(-50%);
        font-size: 40px;
        font-weight: 500;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: center;
        color: #6c6a66;
        opacity: 0.55;
        z-index: 3;
      }

      /* extruded brushed-graphite HERO "$0" — bone face, machined depth, contact shadow */
      #hero {
        position: relative;
        font-size: 340px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--bone);
        /* brushed specular face */
        background: linear-gradient(
          178deg,
          #fefcf6 0%,
          #ede8dd 32%,
          #cbc6ba 52%,
          #ede8dd 62%,
          #ddd8cc 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        /* extrusion in graphite going down, ending in a soft contact shadow */
        text-shadow:
          0 1px 0 #4a4a4e,
          0 2px 0 #434347,
          0 3px 0 #3d3d41,
          0 4px 0 #3a3a3e,
          0 6px 0 #333337,
          0 8px 0 #2c2c30,
          0 10px 0 #252528,
          0 12px 0 #1d1d20,
          0 26px 30px rgba(0, 0, 0, 0.62);
        z-index: 4;
      }

      /* single hairline fracture across the zero */
      #fracture {
        position: absolute;
        left: 57%;
        top: 50%;
        width: 300px;
        height: 2px;
        background: linear-gradient(
          90deg,
          rgba(11, 11, 12, 0) 0%,
          rgba(11, 11, 12, 0.9) 12%,
          rgba(230, 224, 213, 0.85) 50%,
          rgba(11, 11, 12, 0.9) 88%,
          rgba(11, 11, 12, 0) 100%
        );
        opacity: 0;
        z-index: 5;
      }

      /* ---- z3: vignette ---- */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(72% 64% at 50% 47%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.72) 100%);
        z-index: 6;
        pointer-events: none;
      }

      /* grade: 8% grain, no bloom (static, deterministic) */
      #grain {
        position: absolute;
        inset: 0;
        z-index: 7;
        opacity: 0.08;
        mix-blend-mode: overlay;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch' seed='7'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        background-size: 320px 320px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main-video"
      data-width="1920"
      data-height="1080"
      data-fps="24"
      data-start="0"
      data-duration="3"
    >
      <section id="stage" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="dust"></div>

        <div id="deck">
          <div class="hero-wrap">
            <div id="underglow"></div>
            <div id="ghost">$4,500,000,000</div>
            <div id="hero">$0</div>
            <div id="fracture"></div>
          </div>
        </div>

        <div id="vignette"></div>
        <div id="grain"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // deterministic PRNG for the static cold-dust field (no Math.random)
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      (function seedDust() {
        const rand = mulberry32(0x51ed5);
        const dust = document.getElementById("dust");
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 90; i++) {
          const m = document.createElement("div");
          m.className = "mote";
          const s = 0.6 + rand() * 1.8;
          m.style.left = (5 + rand() * 90).toFixed(3) + "%";
          m.style.top = (6 + rand() * 88).toFixed(3) + "%";
          m.style.transform = "scale(" + s.toFixed(3) + ")";
          m.style.opacity = (0.12 + rand() * 0.4).toFixed(3);
          frag.appendChild(m);
        }
        dust.appendChild(frag);
      })();

      // ghost counter — tabular, centered, no layout shift of tracked elements
      const ghostEl = document.getElementById("ghost");
      const ghost = { v: 4500000000 };
      function renderGhost() {
        const n = Math.max(0, Math.round(ghost.v));
        ghostEl.textContent = "$" + n.toLocaleString("en-US");
      }
      renderGhost();

      // TRANSFORMS + OPACITY ONLY. Easing matched to meaning. Never linear.
      const tl = gsap.timeline({ paused: true });

      // 0-500ms: prior $4.5B plummets to 0 — accelerating collapse (power4.in)
      tl.to(
        ghost,
        { v: 0, duration: 0.5, ease: "power4.in", onUpdate: renderGhost, onComplete: renderGhost },
        0,
      );
      // the ghost dies as it lands
      tl.to("#ghost", { opacity: 0, duration: 0.18, ease: "power2.out" }, 0.44);

      // 400-600ms: oxblood underglow EXTINGUISHES to black (expo.out)
      tl.to("#underglow", { opacity: 0, duration: 0.2, ease: "expo.out" }, 0.4);

      // inverted sub-boom landing — a hollow thud on 'nothing' (subtle, transform-only)
      tl.to("#hero", { scale: 0.99, duration: 0.05, ease: "power4.in" }, 0.5);
      tl.to("#hero", { scale: 1, duration: 0.12, ease: "power2.out" }, 0.55);

      // 550ms: single hairline fracture snaps across the zero (opacity pop, transform-only) — then dead stop.
      // GSAP owns the whole transform (centering + rotation + scaleX) via fromTo, so nothing snaps
      // under frame-seek capture. immediateRender seats the centered/invisible state at frame 0.
      tl.fromTo(
        "#fracture",
        { xPercent: -50, yPercent: -50, rotation: -24, scaleX: 0.94, opacity: 0 },
        { xPercent: -50, yPercent: -50, rotation: -24, scaleX: 1, opacity: 1, duration: 0.07, ease: "power3.out" },
        0.55,
      );

      // hard dead stop; hold to end (cold dust only) — last frames fully static.

      window.__timelines["main-video"] = tl;
    </script>
  </body>
</html>
